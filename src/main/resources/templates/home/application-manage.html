<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 애플리케이션 - App Builder</title>
    <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/dist/css/adminlte.min.css">

    <style th:replace="~{console/app/contents/application-manage::style}"></style>
    <style>
        body {
            background: #f7f8fa;
        }

        .home-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .home-topbar-logo {
            font-size: 17px;
            color: #374151;
        }

        .home-topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #374151;
            min-width: 0;
        }

        .home-topbar-user span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .home-topbar-user a {
            margin-right: 8px;
            color: #4b5563;
            white-space: nowrap;
        }

        .home-topbar-user a:hover {
            color: #1d4ed8;
            text-decoration: none;
        }

        .home-topbar-user button {
            border: 1px solid #d7dbe0;
            background: #fff;
            color: #374151;
            border-radius: 7px;
            font-size: 12px;
            padding: 4px 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .home-topbar-user button:hover {
            background: #f1f3f5;
        }

        /* 콘솔 탭이 아니라 단독 화면이므로 가운데로 모은다 */
        #application-manage-app {
            padding: 24px 16px;
        }

        #application-manage-app .ds-panel {
            margin: 0 auto;
        }
    </style>
</head>
<body>
<header class="home-topbar">
    <div class="home-topbar-logo"><b>App</b> Builder</div>
    <div class="home-topbar-user">
        <a href="/applications" title="사용자로 등록된 애플리케이션에 접속합니다"><i class="fas fa-th"></i> 가입된 애플리케이션</a>
        <i class="fas fa-user-circle"></i>
        <span th:text="${userName}">사용자</span>
        <button type="button" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
    </div>
</header>

<div th:replace="~{console/app/contents/application-manage::view}"></div>

<script src="/plugins/jquery/jquery.min.js"></script>
<script src="/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/core/common.js"></script>
<script src="/core/LoadingBar.js"></script>
<script src="/core/HttpClient.js"></script>
<script>
    App.loadingBar.render();
    const httpClient = new HttpClient();

    // 애플리케이션 콘솔 밖이라 현재 콘솔이 없다. 콘솔용 API 대신 로그인 사용자 기준 API 를 쓰고, 접속은 같은 탭에서 한다
    window.APPLICATION_ID = '';
    window.APPLICATION_MANAGE_API = '/api/my-applications';
    window.APPLICATION_MANAGE_OPEN_TARGET = '_self';

    function logout() {
        fetch('/api/auth/logout', {method: 'POST'})
            .finally(function() {
                location.href = '/login';
            });
    }
</script>
<script th:replace="~{console/app/contents/application-manage::script}"></script>
</body>
</html>
