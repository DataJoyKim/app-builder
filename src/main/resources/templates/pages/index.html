<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <link rel="icon" th:if="${faviconPath}" th:href="${faviconPath}">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
        <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
        <link rel="stylesheet" href="/dist/css/adminlte.min.css">
        <link rel="stylesheet" href="/plugins/overlayScrollbars/css/OverlayScrollbars.min.css">
        <style>
            /* 레이아웃의 프로필 이미지 크기(--profile-img-size). 정사각형으로 맞춰 원형이 찌그러지지 않게 한다 */
            #profile .user-panel img.profile-img-sized {
                width: var(--profile-img-size);
                height: var(--profile-img-size);
                object-fit: cover;
                transition: width .3s ease-in-out, height .3s ease-in-out;
            }
            /* 상단 바의 상위 메뉴(root menu). 왼쪽/오른쪽 버튼 사이 남은 폭을 다 쓰고,
               들어가지 않는 메뉴는 맨 끝 "더보기" 드롭다운으로 옮긴다 (layoutRootMenuNav).
               드롭다운이 잘리지 않도록 overflow 는 숨기지 않는다 */
            .root-menu-nav {
                flex: 1 1 0;
                min-width: 0;
                flex-wrap: nowrap;
            }
            .root-menu-nav > .nav-item > .nav-link {
                position: relative;
                white-space: nowrap;
            }
            .root-menu-nav > .nav-item > .nav-link.active {
                color: #007bff;
                font-weight: 600;
            }
            .root-menu-more .dropdown-menu {
                max-height: 70vh;
                overflow-y: auto;
            }
            .root-menu-nav > .nav-item > .nav-link.active::after {
                content: '';
                position: absolute;
                left: .75rem;
                right: .75rem;
                bottom: 0;
                height: 2px;
                border-radius: 2px;
                background: #007bff;
            }
            /* 사이드바를 접으면 폭(약 58px)보다 큰 이미지가 잘리므로 AdminLTE 기본 크기로 줄인다. 마우스를 올려 펼치면 다시 커진다 */
            .sidebar-mini.sidebar-collapse .main-sidebar:not(:hover):not(.sidebar-focused) #profile .user-panel img.profile-img-sized {
                width: 2.1rem;
                height: 2.1rem;
            }
        </style>
    </head>
    <body class="hold-transition sidebar-mini layout-fixed" data-panel-auto-height-mode="height">

        <div class="wrapper">
            <!-- Navbar -->
            <nav class="main-header navbar navbar-expand navbar-white navbar-light">
                <ul class="navbar-nav" >
                    <li class="nav-item">
                        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                    </li>
                </ul>
                <!-- 상위 메뉴: 누르면 사이드바의 상위 메뉴 선택(#rootMenu)이 그 값으로 바뀌고 하위 메뉴가 나온다 (selectRootMenu) -->
                <!-- 좁은 화면(md 미만)에서는 숨긴다. 사이드바의 상위 메뉴 선택 상자로 고른다 -->
                <ul class="navbar-nav root-menu-nav d-none d-md-flex" id="rootMenuNav" aria-label="상위 메뉴"></ul>
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout(null, `/${APPLICATION_ID}/login`); return false;" role="button" title="로그아웃">
                            <i class="fas fa-sign-out-alt"></i>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Main Sidebar Container -->
            <aside class="main-sidebar sidebar-light-primary elevation-4">
                <div id="logo"></div>

                <div class="sidebar">
                    <div id="profile"></div>

                    <!-- 회사 선택 영역: Layout.useCompanySelect 가 켜져 있을 때만 보인다 (setLayout) -->
                    <div id="companySelectArea" style="display: none;">
                        <div class="form-group ">
                            <select class="form-control col-12" id="companyList">
                            </select>
                        </div>
                    </div>

                    <div>
                        <div class="form-group">
                            <select class="form-control col-12" id="rootMenu">
                            </select>
                        </div>
                    </div>
                    <!-- Sidebar Menu -->
                    <nav class="mt-2">
                        <ul id="menu" class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                        </ul>
                    </nav>
                </div>
            </aside>

            <!-- Content Wrapper. Contains page content -->
            <div class="content-wrapper iframe-mode" data-widget="iframe" data-loading-screen="750">
                <div class="nav navbar navbar-expand navbar-white navbar-light border-bottom p-0">
                    <div class="nav-item dropdown">
                        <a class="nav-link bg-light" data-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">
                            <i class="nav-item fas fa-times" style="color:#bd2130"></i>
                        </a>
                        <div class="dropdown-menu mt-0">
                            <a class="dropdown-item" href="#" data-widget="iframe-close" data-type="all">Close All</a>
                            <a class="dropdown-item" href="#" data-widget="iframe-close" data-type="all-other">Close All Other</a>
                        </div>
                    </div>
                    <a class="nav-link bg-light" href="#" data-widget="iframe-scrollleft"><i class="fas fa-angle-double-left"></i></a>
                    <ul class="navbar-nav overflow-hidden" role="tablist"></ul>
                    <a class="nav-link bg-light" href="#" data-widget="iframe-scrollright"><i class="fas fa-angle-double-right"></i></a>
                    <a class="nav-link bg-light" href="#" data-widget="iframe-fullscreen"><i class="fas fa-expand"></i></a>
                </div>

                <div class="tab-content">
                    <div class="tab-empty" id="homeContent"></div>

                    <div class="tab-loading" >
                        <div>
                            <h2 class="display-4">Tab is loading <i class="fa fa-sync fa-spin"></i></h2>
                        </div>
                    </div>
                </div>
            </div>
            <!-- /.content-wrapper -->
            <footer class="main-footer">
                <strong>Copyright &copy; 2024. <a href="">Prometis</a></strong>
                All rights reserved.
                <div class="float-right d-none d-sm-inline-block">
                    <b>Version</b> 0.0.1
                </div>
            </footer>

            <!-- Control Sidebar -->
            <aside class="control-sidebar control-sidebar-dark">
            </aside>
        </div>

        <script src="/core/Application.js"></script>
        <script src="/core/Logout.js"></script>

        <script src="/plugins/jquery/jquery.min.js"></script>
        <script src="/plugins/jquery-ui/jquery-ui.min.js"></script>
        <script>
          $.widget.bridge('uibutton', $.ui.button)
        </script>
        <script src="/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
        <script src="/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js"></script>
        <script src="/dist/js/adminlte.js?v=2"></script>
        <script>
            $( document ).ready(function() {
                console.log('version.0.0.1');

                setLayout();

                // 사이드바의 상위 메뉴 선택과 상단 바의 상위 메뉴는 같은 값을 가리킨다. 어느 쪽에서 골라도 둘 다 맞춘다
                $('#rootMenu').on('change', function() {
                    selectRootMenu($(this).val());
                });

                // 상단 바 링크와 더보기 항목은 href="#" 이라 AdminLTE(iframe 모드)가 탭으로 열지 않는다
                $('#rootMenuNav').on('click', 'a[data-menu-cd]', function(e) {
                    e.preventDefault();
                    selectRootMenu(String($(this).attr('data-menu-cd')));
                });
                $('#rootMenuNav').on('click', '.root-menu-more > a.dropdown-toggle', function(e) {
                    e.preventDefault();
                });

                // 폭이 바뀌면(창 크기, 사이드바 접기/펴기) 다시 나눈다
                const rootMenuNav = document.getElementById('rootMenuNav');
                if(window.ResizeObserver) {
                    new ResizeObserver(scheduleRootMenuLayout).observe(rootMenuNav);
                }
                else {
                    window.addEventListener('resize', scheduleRootMenuLayout);
                }
                if(document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(scheduleRootMenuLayout);
                }

                $('#companyList').on('change', function() {
                    changeCompany($(this).val());
                });
            });

            function setLayout() {
                $.ajax({
                  type: 'GET',
                  url: `/${APPLICATION_ID}/api/layout`,
                  data: {},
                  success: function(response) {
                    let data = response;

                    $("title").text(data.layoutTitle);

                    if(data.useLogo) {
                        setLogo(data);
                    }

                    if(data.useProfile) {
                        setProfile(data);
                    }

                    if(data.useCompanySelect) {
                        $("#companySelectArea").show();
                        setCompanyList();
                    }

                    setRootMenu();

                    setHomeContent(data.homeObjectCode);
                  },
                  error: function(error) {
                    alert('에러가 발생하였습니다.');
                  },
                });
            }

            function setLogo(data) {
                let logoHtml = ``;
                logoHtml += `<div style="background-color:${data.logoBackgroundColor}">`;
                logoHtml += `   <a href="${data.logoLink}" class="brand-link">`;
                if(data.logoImg) {
                    logoHtml += `<img src="${data.logoImg}" alt="Logo" class="brand-image img-circle elevation-3" style="opacity: .8">`;
                }
                if(data.logoText) {
                    logoHtml += `<span style="color:${data.logoTextColor || '#FFFFFF'};font-weight:bold;font-size: 19px;">${data.logoText}</span>`;
                }
                logoHtml += `   </a>`;
                logoHtml += `</div>`;

                $("#logo").html(logoHtml);
            }

            function setProfile(layout) {
                $.ajax({
                  type: 'GET',
                  url: `/${APPLICATION_ID}/api/profile`,
                  data: {},
                  success: function(response) {
                    console.log('profile',response);
                    const blankProfileImg = "../../dist/img/blank_profile.png";
                    let data = {
                        profileImg: response.profileImg || blankProfileImg
                    }

                    let profileHtml = ``;
                    profileHtml += `<div class="user-panel mt-3 pb-3 mb-3 d-flex">`;
                    profileHtml += `    <div class="image">`;
                    profileHtml += `        <img class="img-circle elevation-2" alt="Profile Image">`;
                    profileHtml += `    </div>`;
                    profileHtml += `    <div class="info"></div>`;
                    profileHtml += `</div>`;

                    const $profile = $(profileHtml);
                    $profile.find('img').one('error', function() { this.src = blankProfileImg; }).attr('src', data.profileImg);
                    $profile.find('.info').text(response.userName || '');

                    const profileImgSize = Number(layout && layout.profileImgSize);
                    if(profileImgSize > 0) {
                        $profile.addClass('align-items-center');
                        $profile.find('img').addClass('profile-img-sized');
                        $profile[0].style.setProperty('--profile-img-size', profileImgSize + 'px');
                    }

                    $("#profile").html($profile);
                  },
                  error: function(error) {
                    alert('에러가 발생하였습니다.');
                  },
                });
            }

            function setCompanyList() {
                $.ajax({
                  type: 'GET',
                  url: `/${APPLICATION_ID}/api/company`,
                  success: function(response) {
                    const $companyList = $("#companyList");
                    $companyList.empty();
                    if(response.companyList && response.companyList.length > 0){
                        const companyList = response.companyList || [];
                        $companyList.append($('<option></option>').val("").text("회사를 선택해주세요."));

                        for(let i=0; i<companyList.length; i++) {
                            $companyList.append($('<option></option>').val(companyList[i].companyCode).text(companyList[i].companyName));
                        }

                        // 현재 세션의 회사 선택 (목록에 없으면 선택 없음)
                        $companyList.val(response.companyCode);
                        if($companyList.val() == null) {
                            $companyList.prop('selectedIndex', -1);
                        }

                        // 회사가 하나뿐이면 고를 것이 없으므로 선택 영역을 숨기고, 아직 그 회사가 아니면 자동으로 선택한다.
                        // 회사 변경은 페이지를 다시 불러오므로, 변경 뒤에도 선택이 안 되는 경우 무한 새로고침이 되지 않게 한 번만 시도한다
                        if(companyList.length === 1) {
                            const onlyCompany = companyList[0].companyCode;
                            const autoSelectKey = `companyAutoSelect:${APPLICATION_ID}`;

                            if(response.companyCode === onlyCompany) {
                                $("#companySelectArea").hide();
                                try { sessionStorage.removeItem(autoSelectKey); } catch (e) { }
                            }
                            else {
                                let tried = false;
                                try { tried = sessionStorage.getItem(autoSelectKey) === onlyCompany; } catch (e) { tried = true; }

                                if(!tried) {
                                    try { sessionStorage.setItem(autoSelectKey, onlyCompany); } catch (e) { }
                                    $("#companySelectArea").hide();
                                    changeCompany(onlyCompany);
                                }
                                // 이미 시도했는데도 선택되지 않았으면 선택 영역을 그대로 두어 사용자가 고를 수 있게 한다
                            }
                        }
                    }
                    else {
                        $companyList.append($('<option></option>').val("").text("대상이없습니다."));
                    }
                  },
                  error: function(error) {
                    alert('에러가 발생하였습니다.');
                  },
                });
            }

            function changeCompany(companyCode) {
                $.ajax({
                  type: 'GET',
                  url: `/${APPLICATION_ID}/api/company/change`,
                  data: {"companyCode":companyCode},
                  success: function(response) {
                    location.href = `/${APPLICATION_ID}`;
                  },
                  error: function(error) {
                    alert('회사 변경 중 에러가 발생하였습니다.');
                  },
                });
            }

            let MENU_TREE_REQUEST = 0;

            function menuPageUrl(menu) {
                // menuCd 는 화면 접근 로그에 어느 메뉴에서 열었는지 남기려고 붙인다
                return `/${APPLICATION_ID}/pages/` + menu.objectCode + '?menuCd=' + encodeURIComponent(menu.menuCd);
            }

            // 상위 메뉴를 사이드바 선택 상자(#rootMenu)와 상단 바(#rootMenuNav) 두 곳에 채운다
            function setRootMenu() {
                $.ajax({
                  type: 'GET',
                  url: `/${APPLICATION_ID}/api/menu/root`,
                  success: function(response) {
                    const rootMenus = response || [];
                    const $select = $("#rootMenu").empty();
                    const $nav = $("#rootMenuNav").empty();

                    // 더보기: 모든 메뉴를 같은 순서로 넣어 두고, 바에 들어가지 않은 것만 보인다 (layoutRootMenuNav)
                    const $more = $(`
                        <li class="nav-item dropdown root-menu-more" style="display:none">
                            <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">더보기</a>
                            <div class="dropdown-menu dropdown-menu-right"></div>
                        </li>
                    `);

                    $select.append($('<option></option>').val('').text('선택'));
                    rootMenus.forEach(function(menu) {
                        $select.append($('<option></option>').val(menu.menuCd).text(menu.menuNm));

                        const $link = $('<a class="nav-link" href="#"></a>')
                            .attr('data-menu-cd', menu.menuCd)
                            .text(menu.menuNm);
                        $nav.append($('<li class="nav-item root-menu-item"></li>').attr('data-menu-cd', menu.menuCd).append($link));

                        $more.find('.dropdown-menu').append(
                            $('<a class="dropdown-item" href="#"></a>').attr('data-menu-cd', menu.menuCd).text(menu.menuNm));
                    });
                    $nav.append($more);

                    // 메뉴를 다시 채웠으므로 지금 선택(선택 상자 값) 표시를 되살린다
                    markRootMenu($("#rootMenu").val());
                    layoutRootMenuNav();
                  },
                  error: function(error) {
                    alert('에러가 발생하였습니다.');
                  },
                });
            }

            let ROOT_MENU_LAYOUT_FRAME = 0;

            function scheduleRootMenuLayout() {
                cancelAnimationFrame(ROOT_MENU_LAYOUT_FRAME);
                ROOT_MENU_LAYOUT_FRAME = requestAnimationFrame(layoutRootMenuNav);
            }

            /**
             * 상단 바에 들어가는 만큼 앞에서부터 메뉴를 보여주고, 처음으로 넘치는 메뉴부터 끝까지는 더보기로 옮긴다.
             * 메뉴 폭은 모두 보인 상태에서 잰다. 목록 폭은 남은 공간(flex: 1 1 0)이라 메뉴를 숨겨도 바뀌지 않아 다시 불리지 않는다
             */
            function layoutRootMenuNav() {
                const nav = document.getElementById('rootMenuNav');
                if(!nav || nav.offsetParent === null) return; // 좁은 화면에서 숨겨져 있으면 잴 수 없다

                const items = Array.from(nav.querySelectorAll(':scope > li.root-menu-item'));
                const more = nav.querySelector(':scope > li.root-menu-more');
                if(!more) return;

                items.forEach(li => li.style.display = '');
                more.style.display = 'none';

                const available = nav.clientWidth;
                const widths = items.map(li => li.getBoundingClientRect().width);
                const total = widths.reduce((sum, w) => sum + w, 0);
                const overflowed = new Set();

                if(total > available) {
                    more.style.display = '';
                    const room = available - more.getBoundingClientRect().width;
                    let used = 0;
                    items.forEach(function(li, i) {
                        if(overflowed.size === 0 && used + widths[i] <= room) {
                            used += widths[i];
                        }
                        else {
                            overflowed.add(li.getAttribute('data-menu-cd'));
                            li.style.display = 'none';
                        }
                    });
                }

                more.querySelectorAll('.dropdown-item').forEach(function(a) {
                    a.style.display = overflowed.has(a.getAttribute('data-menu-cd')) ? '' : 'none';
                });
                updateRootMenuMore();
            }

            // 선택한 메뉴가 더보기 안에 있으면 더보기 버튼에도 선택 표시를 한다
            function updateRootMenuMore() {
                const $more = $('#rootMenuNav .root-menu-more');
                const selectedInMore = $more.find('.dropdown-item.active').filter(function() {
                    return this.style.display !== 'none';
                }).length > 0;
                $more.children('a.dropdown-toggle').toggleClass('active', selectedInMore);
            }

            function markRootMenu(value) {
                const $links = $("#rootMenuNav a[data-menu-cd]");
                $links.removeClass('active').removeAttr('aria-current');
                if(value) {
                    $links.filter(`[data-menu-cd="${CSS.escape(value)}"]`).addClass('active').attr('aria-current', 'true');
                }
                updateRootMenuMore();
            }

            // 상위 메뉴 선택: 선택 상자 값과 상단 바(더보기 포함) 표시를 맞추고 사이드바에 하위 메뉴를 나열한다. 빈 값이면 사이드바를 비운다
            function selectRootMenu(menuCd) {
                const value = menuCd || '';
                $("#rootMenu").val(value);
                markRootMenu(value);

                if(value) {
                    setMenuTree(value);
                }
                else {
                    MENU_TREE_REQUEST++;
                    $("#menu").html('');
                }
            }

            function setMenuTree(rootMenuCd) {
                // 빠르게 다른 상위 메뉴를 고르면 늦게 온 이전 응답은 버린다
                const requestNo = ++MENU_TREE_REQUEST;
                $.ajax({
                  type: 'GET',
                  url: `/${APPLICATION_ID}/api/menu/tree`,
                  data: {"parentMenuCd":rootMenuCd},
                  success: function(response) {
                    if(requestNo !== MENU_TREE_REQUEST) return;

                    let shtml = '';
                    for(let i=0; i<response.length; i++) {
                        shtml += getMenuHtml(response[i]);
                    }
                    $("#menu").html(shtml);
                  },
                  error: function(error) {
                    alert('에러가 발생하였습니다.');
                  },
                });
            }

            function getMenuHtml(menu) {
                const menuPath = (menu.objectCode != null) ? menuPageUrl(menu) : '#';
                const menuItemClass = 'nav-icon ' + menu.icon;

                let shtml = '';

                shtml += '<li class="nav-item">';
                shtml += '<a href="'+menuPath+'" class="nav-link" >';
                if(!menu.isLeafNode) {
                    shtml += '<i class="right fas fa-angle-left"></i>';
                }
                shtml +=    '<i class="'+menuItemClass+'"></i><p>'+menu.menuNm+'</p>';
                shtml += '</a>';

                if(menu.children != undefined && menu.children != null) {
                    shtml += '<ul class="nav nav-treeview">';
                    for(let i=0; i<menu.children.length; i++) {
                        shtml += getMenuHtml(menu.children[i]);
                    }
                    shtml += '</ul>';
                }
                shtml += '</li>';

                return shtml;
            }

            function setHomeContent(objectCode) {
                let homeHtml = ``;

                if(objectCode) {
                    homeHtml += `<iframe src="/${APPLICATION_ID}/pages/${objectCode}"></iframe>`;
                }

                $("#homeContent").html(homeHtml);
            }

            function moveConsole() {
                window.open(`/${APPLICATION_ID}/console`, 'console');
            }
        </script>
    </body>
</html>
