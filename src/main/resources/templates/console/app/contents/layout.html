<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #layout-app {
        padding: 16px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #layout-app .ds-detail-panel {
        max-width: 900px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #layout-app .ds-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
    }

    #layout-app .ds-panel-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #layout-app .ds-panel-header h3 i {
        color: #4A90E2;
    }

    #layout-app .ds-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #4A90E2;
        background: #4A90E2;
        color: #fff;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #layout-app .ds-btn:hover {
        background: #3d7fce;
    }

    #layout-app .ds-detail-body {
        padding: 16px;
    }

    #layout-app .ds-section {
        border: 1px solid #eef0f2;
        border-radius: 10px;
        margin-bottom: 14px;
        overflow: hidden;
    }

    #layout-app .ds-section:last-child {
        margin-bottom: 0;
    }

    #layout-app .ds-section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        font-weight: 700;
        font-size: 12px;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #layout-app .ds-section-header i {
        color: #4A90E2;
    }

    #layout-app .ds-section-grid {
        display: flex;
        flex-wrap: wrap;
        padding: 14px 8px 0;
    }

    #layout-app .ds-section-grid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #layout-app .ds-section-grid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #layout-app .ds-switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        padding: 7px 10px;
        background: #fff;
    }

    #layout-app .ds-switch-row-title {
        font-size: 13px;
        font-weight: 600;
        color: #374151;
    }

    #layout-app .ds-switch-row .custom-control-label {
        cursor: pointer;
        margin-bottom: 0;
    }

    #layout-app .ds-section-grid .form-control {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
        background: #fff;
        color: #1f2937;
    }

    #layout-app .ds-section-grid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #layout-app .ds-color-input {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #layout-app .ds-color-input input[type="color"] {
        width: 34px;
        height: 30px;
        padding: 2px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        flex: 0 0 auto;
    }
</style>
<script th:fragment="script">
        $( document ).ready(function() {
            console.log('version.0.0.1');
            init();
        });

        // 프로필 이미지 링크: /{applicationId}/image/{storageType}/#{userId} (filename 자리는 항상 로그인한 사용자ID)
        const PROFILE_USER_ID_EXPRESSION = '#{userId}';
        let PROFILE_IMG = '';

        function init() {
            getStorageTypeList();
            getList();
        }

        function getStorageTypeList() {
            httpClient.get(`/${APPLICATION_ID}/console/api/image/storage-type`, {},
                function(response){
                    const $select = $("#profileImageStorageType");
                    $select.find('option:not([value=""])').remove();
                    for(const item of (response || [])) {
                        $select.append($('<option></option>').val(item.storageType).text(`${item.displayName} (${item.storageType})`));
                    }
                    setProfileImg(PROFILE_IMG);
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function profileImgPrefix() {
            return `/${encodeURIComponent(APPLICATION_ID)}/image/`;
        }

        function profileImgOf(storageType) {
            return isEmpty(storageType) ? '' : `${profileImgPrefix()}${storageType}/${PROFILE_USER_ID_EXPRESSION}`;
        }

        // 저장된 링크에서 저장소 유형을 꺼내 선택한다. 목록에 없는 유형(삭제됨)이면 그대로 보여주기만 한다
        function setProfileImg(link) {
            PROFILE_IMG = link || '';

            const prefix = profileImgPrefix();
            const suffix = '/' + PROFILE_USER_ID_EXPRESSION;
            let storageType = '';
            if(PROFILE_IMG.startsWith(prefix) && PROFILE_IMG.endsWith(suffix)) {
                storageType = PROFILE_IMG.substring(prefix.length, PROFILE_IMG.length - suffix.length);
            }

            const $select = $("#profileImageStorageType");
            if(storageType && $select.find('option').filter(function() { return this.value === storageType; }).length === 0) {
                $select.append($('<option></option>').val(storageType).text(`${storageType} (없는 저장소 유형)`));
            }
            $select.val(storageType);
            $("#profileImg").val(PROFILE_IMG);
        }

        function changeProfileImageStorageType(storageType) {
            PROFILE_IMG = profileImgOf(storageType);
            $("#profileImg").val(PROFILE_IMG);
        }

        function alertError(error) {
            const message = error && error.responseJSON && error.responseJSON.message;
            alert(message || 'error');
        }

        function getList() {
            httpClient.get(`/${APPLICATION_ID}/console/api/layout`, {},
                function(response){
                    if(!isEmpty(response)) {
                        setContentData(response[0]);
                    }
                },
                function(error){
                    alert('error');
                }
            );
        }

        function isEmpty(v) {
            return (v == undefined || v == null || v == '');
        }

        function save() {
            let id = $("#id").val();

            if(isEmpty(id))
                insertContent();
            else
                updateContent(id);
        }

        function insertContent() {
            httpClient.post(`/${APPLICATION_ID}/console/api/layout`,{},getContent(),
                function(response){
                    alert("저장완료되었습니다.");
                    getList();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function updateContent(id) {
          httpClient.put(`/${APPLICATION_ID}/console/api/layout/${id}`, {}, getContent(),
              function(response){
                  alert("저장완료되었습니다.");
                  getList();
              },
              function(error){
                  alertError(error);
              }
          );
        }

        function deleteContent() {
          let id = $("#id").val();

          httpClient.delete(`/${APPLICATION_ID}/console/api/layout/${id}`, {},
              function(response){
                  alert("삭제 처리 완료되었습니다.");
                  getList();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function setContentData(response) {
            setContent(response);
        }

        function getContent() {
            return {
                id: $("#id").val(),
                // 서버(LayoutRestController)가 문자열로 받아 Boolean.valueOf 하므로 문자열로 보낸다
                useAuthValidation: String(App.util.isCheck('useAuthValidation')),
                useProfile: String(App.util.isCheck('useProfile')),
                useLogo: String(App.util.isCheck('useLogo')),
                logoText: $("#logoText").val(),
                logoBackgroundColor: $("#logoBackgroundColor").val(),
                logoTextColor: $("#logoTextColor").val(),
                logoLink: $("#logoLink").val(),
                logoImg: $("#logoImg").val(),
                layoutTitle: $("#layoutTitle").val(),
                homeObjectCode: $("#homeObjectCode").val(),
                faviconPath: $("#faviconPath").val(),
                profileImg: PROFILE_IMG,
                profileImgSize: ($("#profileImgSize").val() || '').trim()
            }
        }

        function setContent(params) {
            $("#id").val(params.id);
            App.util.check('useAuthValidation', params.useAuthValidation === true || params.useAuthValidation === 'true');
            App.util.check('useProfile', params.useProfile === true || params.useProfile === 'true');
            App.util.check('useLogo', params.useLogo === true || params.useLogo === 'true');
            $("#logoText").val(params.logoText);
            $("#logoBackgroundColor").val(params.logoBackgroundColor);
            $("#logoColorPicker").val(params.logoBackgroundColor || '#4A90E2');
            $("#logoTextColor").val(params.logoTextColor);
            $("#logoTextColorPicker").val(params.logoTextColor || '#FFFFFF');
            $("#logoLink").val(params.logoLink);
            $("#logoImg").val(params.logoImg);
            $("#layoutTitle").val(params.layoutTitle);
            $("#homeObjectCode").val(params.homeObjectCode);
            $("#faviconPath").val(params.faviconPath);
            setProfileImg(params.profileImg);
            $("#profileImgSize").val(params.profileImgSize == null ? '' : params.profileImgSize);
          }
    </script>
<div id="layout-app" th:fragment="view">
    <div class="ds-detail-panel">
        <div class="ds-panel-header">
            <h3><i class="fas fa-window-maximize"></i> Layout 설정</h3>
            <button type="button" class="ds-btn" onclick="save()"><i class="fas fa-save"></i>저장</button>
        </div>

        <div class="ds-detail-body">
            <input type="hidden" id="id">

            <div class="ds-section">
                <div class="ds-section-header"><i class="fas fa-info-circle"></i><span>기본 정보</span></div>
                <div class="ds-section-grid">
                    <div class="form-group col-6">
                        <label for="layoutTitle">레이아웃 title</label>
                        <input type="text" class="form-control" id="layoutTitle" autocomplete="off">
                    </div>
                    <div class="form-group col-6">
                        <label for="homeObjectCode">Home 오브젝트코드</label>
                        <input type="text" class="form-control" id="homeObjectCode" autocomplete="off">
                    </div>
                    <div class="form-group col-12">
                        <label for="faviconPath">브라우저 탭 아이콘 경로</label>
                        <input type="text" class="form-control" id="faviconPath" autocomplete="off" maxlength="500" placeholder="예: /dist/img/favicon.ico 또는 https://.../favicon.png">
                    </div>
                </div>
            </div>

            <div class="ds-section">
                <div class="ds-section-header"><i class="fas fa-shield-alt"></i><span>인증 / 화면 요소</span></div>
                <div class="ds-section-grid">
                    <div class="form-group col-4">
                        <div class="ds-switch-row">
                            <span class="ds-switch-row-title">인증사용</span>
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="useAuthValidation">
                                <label for="useAuthValidation" class="custom-control-label"></label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group col-4">
                        <div class="ds-switch-row">
                            <span class="ds-switch-row-title">프로필사용</span>
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="useProfile">
                                <label for="useProfile" class="custom-control-label"></label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group col-4">
                        <div class="ds-switch-row">
                            <span class="ds-switch-row-title">로고사용</span>
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="useLogo">
                                <label for="useLogo" class="custom-control-label"></label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="ds-section">
                <div class="ds-section-header"><i class="fas fa-image"></i><span>로고</span></div>
                <div class="ds-section-grid">
                    <div class="form-group col-4">
                        <label for="logoText">로고 텍스트</label>
                        <input type="text" class="form-control" id="logoText" autocomplete="off">
                    </div>
                    <div class="form-group col-4">
                        <label for="logoBackgroundColor">로고 배경색</label>
                        <div class="ds-color-input">
                            <input type="color" id="logoColorPicker" onchange="$('#logoBackgroundColor').val(this.value)">
                            <input type="text" class="form-control" id="logoBackgroundColor" autocomplete="off" oninput="$('#logoColorPicker').val(this.value)">
                        </div>
                    </div>
                    <div class="form-group col-4">
                        <label for="logoTextColor">로고 텍스트 색상</label>
                        <div class="ds-color-input">
                            <input type="color" id="logoTextColorPicker" onchange="$('#logoTextColor').val(this.value)">
                            <input type="text" class="form-control" id="logoTextColor" autocomplete="off" placeholder="#FFFFFF" oninput="$('#logoTextColorPicker').val(this.value)">
                        </div>
                    </div>
                    <div class="form-group col-6">
                        <label for="logoLink">로고 link</label>
                        <input type="text" class="form-control" id="logoLink" autocomplete="off">
                    </div>
                    <div class="form-group col-6">
                        <label for="logoImg">로고 img</label>
                        <input type="text" class="form-control" id="logoImg" autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="ds-section">
                <div class="ds-section-header"><i class="fas fa-user-circle"></i><span>프로필</span></div>
                <div class="ds-section-grid">
                    <div class="form-group col-3">
                        <label for="profileImageStorageType">프로필 이미지 저장소 유형</label>
                        <select class="form-control" id="profileImageStorageType" onchange="changeProfileImageStorageType(this.value)">
                            <option value="">사용 안 함 (기본 이미지)</option>
                        </select>
                    </div>
                    <div class="form-group col-6">
                        <label for="profileImg">프로필 이미지 링크</label>
                        <input type="text" class="form-control" id="profileImg" readonly placeholder="저장소 유형을 선택하면 /{applicationId}/image/{storageType}/#{userId} 로 설정됩니다">
                        <small class="text-muted">#{userId} 는 로그인한 사용자ID로 바뀝니다. Image Manage 에서 해당 저장소 유형에 파일명을 사용자ID로 지정해 올려주세요. 이미지가 없는 사용자는 기본 이미지가 보입니다.</small>
                    </div>
                    <div class="form-group col-3">
                        <label for="profileImgSize">프로필 이미지 크기 (px)</label>
                        <input type="number" class="form-control" id="profileImgSize" min="16" max="200" step="1" placeholder="비우면 기본 크기 (약 34px)" autocomplete="off">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
