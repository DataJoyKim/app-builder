<script th:fragment="script">
    App.codes = {
        "YN_CD":[
            {code:"true",name:"Y"},
            {code:"false",name:"N"}
        ],
        "METHOD":[
            {code:"GET",name:"GET"},
            {code:"POST",name:"POST"},
            {code:"PUT",name:"PUT"},
            {code:"DELETE",name:"DELETE"}
        ],
        "CONTENT_TYPE":[
            {code:"",name:"선택"},
            {code:"APPLICATION_JSON",name:"application/json"},
            {code:"APPLICATION_FORM_URLENCODED",name:"application/x-www-form-urlencoded"},
            {code:"TEXT_PLAIN",name:"text/plain"}
        ],
        "BODY_MESSAGE_FORMAT":[
            {code:"",name:"선택"},
            {code:"ARRAY",name:"Array"},
            {code:"OBJECT",name:"Object"}
        ],
        "REST_DATA_TYPE":[
            {code:"STRING",name:"String"},
            {code:"NUMBER",name:"Number"},
            {code:"BOOLEAN",name:"Boolean"},
            {code:"OBJECT",name:"Object"},
            {code:"ARRAY",name:"Array"}
        ],
        "VALUE_TYPE":[
            {code:"PARAM_VALUE",name:"파라미터값"},
            {code:"INPUT_VALUE",name:"입력값"},
            {code:"SESSION_USER_ID",name:"세션 유저 ID"}
        ]
    };

    /* ================= 인라인 편집 테이블 (jsGrid 대체) ================= */
    class EditableTable {
        constructor(containerId, columns) {
            this.containerId = containerId;
            this.columns = columns;
            this.data = [];
            this.render();
        }

        setData(data) {
            this.data = (data || []).map(d => Object.assign({}, d));
            this.render();
        }

        getData() {
            return this.data;
        }

        addRow(defaults) {
            this.data.push(Object.assign({}, defaults));
            this.render();
        }

        removeRow(index) {
            this.data.splice(index, 1);
            this.render();
        }

        render() {
            const $container = $('#' + this.containerId);
            $container.empty();

            const $table = $('<table class="wf-table"></table>');
            const $theadRow = $('<tr></tr>');
            for (const col of this.columns) {
                $theadRow.append($('<th></th>').text(col.label));
            }
            $theadRow.append('<th class="wf-table-action-col"></th>');
            $table.append($('<thead></thead>').append($theadRow));

            const $tbody = $('<tbody></tbody>');
            if (this.data.length === 0) {
                $tbody.append(`<tr><td colspan="${this.columns.length + 1}" class="wf-table-empty">데이터가 없습니다.</td></tr>`);
            }

            this.data.forEach((row, idx) => {
                const $tr = $('<tr></tr>');
                for (const col of this.columns) {
                    const $td = $('<td></td>');
                    if (col.editable === false) {
                        $td.text(row[col.field] != null ? row[col.field] : '');
                    }
                    else if (col.type === 'select') {
                        const $select = $('<select class="wf-cell-input"></select>');
                        for (const opt of col.options) {
                            $select.append($('<option></option>').attr('value', opt.code).text(opt.name));
                        }
                        $select.val(row[col.field]);
                        $select.on('change', (e) => { row[col.field] = $(e.target).val(); });
                        $td.append($select);
                    }
                    else {
                        const $input = $(`<input type="${col.type === 'number' ? 'number' : 'text'}" class="wf-cell-input">`);
                        $input.val(row[col.field] != null ? row[col.field] : '');
                        $input.on('input', (e) => { row[col.field] = $(e.target).val(); });
                        $td.append($input);
                    }
                    $tr.append($td);
                }

                const $actionTd = $('<td class="wf-table-action-col"></td>');
                const $delBtn = $('<button type="button" class="wf-row-del-btn" title="삭제"><i class="fas fa-times"></i></button>');
                $delBtn.on('click', () => this.removeRow(idx));
                $actionTd.append($delBtn);
                $tr.append($actionTd);

                $tbody.append($tr);
            });

            $table.append($tbody);
            $container.append($table);
        }
    }

    /* ================= Body 파라미터 트리 에디터 =================
       parentParamName === 'ROOT'(또는 미지정)인 항목이 최상위 필드.
       각 노드에 하위 필드를 추가할 수 있고, 저장 시 형제 순서를 orderNum으로 자동 부여한다. */
    class BodyTreeEditor {
        constructor(containerId, options) {
            this.containerId = containerId;
            this.options = options;
            this.data = [];
            this.render();
        }

        setData(data) {
            this.data = (data || []).map(d => Object.assign({}, d));
            this.render();
        }

        getData() {
            const siblingCounters = {};
            return this.data.map(row => {
                const key = row.parentParamName || 'ROOT';
                siblingCounters[key] = (siblingCounters[key] || 0) + 1;
                return Object.assign({}, row, {orderNum: siblingCounters[key]});
            });
        }

        addRoot() {
            const name = 'param' + (this.data.length + 1);
            this.data.push({paramName:name, parentParamName:'ROOT', dataType:'STRING', valueType:'PARAM_VALUE', inputValue:''});
            this.render();
        }

        addChild(parentParamName) {
            const name = 'param' + (this.data.length + 1);
            this.data.push({paramName:name, parentParamName:parentParamName, dataType:'STRING', valueType:'PARAM_VALUE', inputValue:''});
            this.render();
        }

        removeNode(paramName) {
            const toRemove = new Set([paramName]);
            let changed = true;
            while (changed) {
                changed = false;
                for (const row of this.data) {
                    if (toRemove.has(row.parentParamName) && !toRemove.has(row.paramName)) {
                        toRemove.add(row.paramName);
                        changed = true;
                    }
                }
            }
            this.data = this.data.filter(row => !toRemove.has(row.paramName));
            this.render();
        }

        render() {
            const $container = $('#' + this.containerId);
            $container.empty();

            const roots = this.data.filter(r => !r.parentParamName || r.parentParamName === 'ROOT');

            if (this.data.length === 0) {
                $container.append('<div class="wf-tree-empty">등록된 필드가 없습니다. "필드 추가"로 시작하세요.</div>');
                return;
            }

            const $tree = $('<div class="wf-tree"></div>');
            for (const root of roots) {
                $tree.append(this.renderNode(root, 0));
            }
            $container.append($tree);
        }

        renderNode(row, depth) {
            const $node = $(`<div class="wf-tree-node" style="margin-left:${depth * 22}px"></div>`);
            const $row = $('<div class="wf-tree-row"></div>');

            $row.append(`<i class="fas fa-${depth > 0 ? 'level-up-alt fa-rotate-90' : 'circle'} wf-tree-connector"></i>`);

            const $nameInput = $('<input type="text" class="wf-cell-input wf-tree-name" placeholder="필드명">');
            $nameInput.val(row.paramName || '');
            $nameInput.on('input', (e) => {
                const oldName = row.paramName;
                const newName = e.target.value;
                for (const child of this.data) {
                    if (child.parentParamName === oldName) child.parentParamName = newName;
                }
                row.paramName = newName;
            });
            $row.append($nameInput);

            const $typeSelect = $('<select class="wf-cell-input wf-tree-type"></select>');
            for (const opt of this.options.dataTypeCodes) {
                $typeSelect.append($('<option></option>').attr('value', opt.code).text(opt.name));
            }
            $typeSelect.val(row.dataType);
            $typeSelect.on('change', (e) => { row.dataType = e.target.value; });
            $row.append($typeSelect);

            const $valueTypeSelect = $('<select class="wf-cell-input wf-tree-valuetype"></select>');
            for (const opt of this.options.valueTypeCodes) {
                $valueTypeSelect.append($('<option></option>').attr('value', opt.code).text(opt.name));
            }
            $valueTypeSelect.val(row.valueType);
            $valueTypeSelect.on('change', (e) => { row.valueType = e.target.value; });
            $row.append($valueTypeSelect);

            const $inputValue = $('<input type="text" class="wf-cell-input wf-tree-value" placeholder="입력값">');
            $inputValue.val(row.inputValue || '');
            $inputValue.on('input', (e) => { row.inputValue = e.target.value; });
            $row.append($inputValue);

            const $addChildBtn = $('<button type="button" class="wf-icon-btn" title="하위 필드 추가"><i class="fas fa-plus"></i></button>');
            $addChildBtn.on('click', () => this.addChild(row.paramName));
            $row.append($addChildBtn);

            const $delBtn = $('<button type="button" class="wf-icon-btn danger" title="삭제(하위 필드 포함)"><i class="fas fa-times"></i></button>');
            $delBtn.on('click', () => {
                if (confirm('하위 필드를 포함해 삭제하시겠습니까?')) this.removeNode(row.paramName);
            });
            $row.append($delBtn);

            $node.append($row);

            const children = this.data.filter(r => r.parentParamName === row.paramName);
            if (children.length > 0) {
                const $childWrap = $('<div class="wf-tree-children"></div>');
                for (const child of children) {
                    $childWrap.append(this.renderNode(child, depth + 1));
                }
                $node.append($childWrap);
            }

            return $node;
        }
    }

    let functionName;
    let queryParamsGrid;
    let headersGrid;
    let bodyTree;
    let executeGrid;

    $( document ).ready(function() {
        init();
    });

    function init() {
        setDatSourceAsRestServer();
        App.util.setCodeBox("rest-client-method", App.codes['METHOD']);
        App.util.setCodeBox("rest-client-contentType", App.codes['CONTENT_TYPE']);
        App.util.setCodeBox("rest-client-bodyMessageFormat", App.codes['BODY_MESSAGE_FORMAT']);

        queryParamsGrid = new EditableTable('queryParamsGrid', [
            {field:'paramName', label:'파라미터', type:'text'},
            {field:'valueType', label:'값유형', type:'select', options:App.codes['VALUE_TYPE']},
            {field:'inputValue', label:'입력값', type:'text'}
        ]);

        headersGrid = new EditableTable('headersGrid', [
            {field:'name', label:'Header 명', type:'text'},
            {field:'valueType', label:'값유형', type:'select', options:App.codes['VALUE_TYPE']},
            {field:'inputValue', label:'입력값', type:'text'}
        ]);

        bodyTree = new BodyTreeEditor('bodyGrid', {
            dataTypeCodes: App.codes['REST_DATA_TYPE'],
            valueTypeCodes: App.codes['VALUE_TYPE']
        });

        executeGrid = new EditableTable('executeGrid', [
            {field:'key', label:'파라미터', type:'text'},
            {field:'value', label:'값', type:'text'}
        ]);

        App.modalPopup.receiveParam('FUNC_REQUEST', function(data){
            if(!data.functionName) {
                alert('기능코드가 존재하지않습니다.');
            }

            functionName = data.functionName;
            getRestClient(functionName)
        });
    }

    function setDatSourceAsRestServer() {
        httpClient.get(`/${APPLICATION_ID}/console/api/datasource/rest-server`, {},
            function(response){
                let codes = new Array();
                for(let i=0; i<response.length; i++) {
                    codes.push({code:response[i].dataSourceName,name:response[i].displayName});
                }

                 App.util.setCodeBox("rest-client-dataSourceName", codes, {useFirstItem:true, firstItemLabel:'선택', firstItemValue:''});
            },
            function(error){
                alert('error');
            }
        );
    }

    function execute() {
        let executeTarget = functionName;

        let contents = {};
        const gridData = executeGrid.getData();

        for(const data of gridData) {
            if(data.value == "null") {
                contents[data.key] = null;
            }
            else {
                contents[data.key] = data.value;
            }
        }

        httpClient.post(`/${APPLICATION_ID}/console/api/rest-client/${executeTarget}/execute`,contents, null,
            function(response){
                $("#responseData").val(JSON.stringify(response,null,3));
            },
            function(error){
                $("#responseData").val(JSON.stringify(error.responseJSON,null,3));
            }
        );

    }

    function copyResult() {
        const text = $("#responseData").val();
        if (!text) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
        } else {
            const $textarea = $("#responseData");
            $textarea.trigger('select');
            document.execCommand('copy');
        }
    }

        function getRestClient(clientName) {
            httpClient.get(`/${APPLICATION_ID}/console/api/rest-client`, {clientName:clientName},
                function(response){
                    if(response[0]) {
                        setRestClientContent(response[0]);
                    }
                    else {
                        newRestClientContent(clientName);
                    }
                },
                function(error){
                    alert('error');
                }
            );
        }

        function getRestClientContent() {
            let contentType = $("#rest-client-contentType").val();
            if(contentType == '') {
                contentType = null;
            }

            let bodyMessageFormat = $("#rest-client-bodyMessageFormat").val();
            if(bodyMessageFormat == '') {
                bodyMessageFormat = null;
            }

            return {
                id: $("#rest-client-id").val(),
                clientName: $("#rest-client-clientName").val(),
                displayName: $("#rest-client-displayName").val(),
                dataSourceName: $("#rest-client-dataSourceName").val(),
                method: $("#rest-client-method").val(),
                path: $("#rest-client-path").val(),
                contentType: contentType,
                bodyMessageFormat: bodyMessageFormat
            }
        }

        function setRestClientContent(params) {
            $("#rest-client-id").val(params.id);
            $("#rest-client-clientName").val(params.clientName);
            $("#rest-client-displayName").val(params.displayName);
            $("#rest-client-dataSourceName").val(params.dataSourceName);
            $("#rest-client-method").val(params.method);
            $("#rest-client-path").val(params.path);
            $("#rest-client-contentType").val(params.contentType);
            $("#rest-client-bodyMessageFormat").val(params.bodyMessageFormat);
            queryParamsGrid.setData(params.queryParams);
            headersGrid.setData(params.headers);
            bodyTree.setData(params.body);
          }

          function newRestClientContent(clientName){
            setRestClientContent({
                id:'',
                clientName:clientName,
                displayName:'',
                dataSourceName:'',
                method:'',
                path:'',
                contentType:'',
                bodyMessageFormat:'',
                queryParams:[],
                headers:[],
                body:[]
                });
          }

        function save() {
            httpClient.post(`/${APPLICATION_ID}/console/api/rest-client/save`,
                {},
                {
                    'restClient':getRestClientContent(),
                    'queryParams':queryParamsGrid.getData(),
                    'headers':headersGrid.getData(),
                    'body':bodyTree.getData()
                },
                function(response){
                    alert("저장완료되었습니다.");
                    getRestClient($("#rest-client-clientName").val());
                },
                function(error){
                    alert('error');
                }
            );
        }
</script>
