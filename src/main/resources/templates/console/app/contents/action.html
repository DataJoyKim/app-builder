<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #action-app {
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 14px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #action-app .act-layout {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        gap: 14px;
    }

    #action-app .act-list-panel,
    #action-app .act-detail-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #action-app .act-list-panel {
        flex: 0 0 360px;
    }

    #action-app .act-detail-panel {
        flex: 1 1 auto;
        min-width: 0;
    }

    #action-app .act-panel-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
    }

    #action-app .act-panel-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #action-app .act-panel-header h3 i {
        color: #4A90E2;
    }

    #action-app .act-panel-tools {
        display: flex;
        gap: 6px;
    }

    #action-app .act-panel-tools .btn {
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        transition: background-color .12s ease;
    }

    #action-app .act-panel-tools .btn i {
        margin-right: 5px;
    }

    #action-app .act-panel-tools .btn:hover {
        background: #f1f3f5;
    }

    #action-app #save {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #action-app #save:hover {
        background: #3d7fce;
    }

    #action-app #delete {
        color: #dc2626;
    }

    #action-app #delete:hover {
        background: #fef2f2;
    }

    #action-app .act-panel-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    /* ---- Action 목록: ag-Grid 대신 검색+카드형 리스트로 직접 렌더링 ---- */
    #action-app .act-list-search {
        flex: 0 0 auto;
        position: relative;
        padding: 10px 12px;
        border-bottom: 1px solid #eef0f2;
    }

    #action-app .act-list-search i {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        font-size: 12px;
        pointer-events: none;
    }

    #action-app .act-list-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px 7px 28px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 12.5px;
    }

    #action-app .act-list-search input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #action-app .act-list-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
    }

    #action-app .act-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-bottom: 1px solid #f1f3f5;
        border-left: 3px solid transparent;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #action-app .act-list-item:hover {
        background: #fafbfc;
    }

    #action-app .act-list-item.selected {
        background: #eef5ff;
        border-left-color: #4A90E2;
    }

    #action-app .act-list-item-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #action-app .act-list-item-name {
        font-size: 13px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #action-app .act-list-item.selected .act-list-item-name {
        color: #1d4ed8;
    }

    #action-app .act-list-item-code {
        font-size: 11px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #action-app .act-type-chip {
        flex: 0 0 auto;
        font-size: 10.5px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 20px;
    }

    #action-app .act-type-chip.type-NEW_DATA {
        background: #ecfdf5;
        color: #047857;
    }

    #action-app .act-type-chip.type-WORKFLOW {
        background: #eef5ff;
        color: #1d4ed8;
    }

    #action-app .act-type-chip.type-SCRIPT {
        background: #f5f3ff;
        color: #7c3aed;
    }

    #action-app .act-list-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 50px 16px;
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
    }

    #action-app .act-list-empty i {
        font-size: 22px;
        color: #d7dbe0;
    }

    #action-app .act-panel-footer {
        flex: 0 0 auto;
        padding: 10px 14px;
        border-top: 1px solid #eef0f2;
    }

    #action-app .act-panel-footer .btn {
        width: 100%;
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
        border-radius: 7px;
        padding: 8px 10px;
        font-weight: 600;
    }

    #action-app .act-panel-footer .btn:hover {
        background: #3d7fce;
    }

    #action-app .act-panel-footer .btn i {
        margin-right: 6px;
    }

    #action-app .act-detail-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 16px;
    }

    /* ---- 기본 정보(Action명/화면노출명/유형/argument) ---- */
    #action-app .act-basic-card {
        display: flex;
        flex-wrap: wrap;
        border: 1px solid #eef0f2;
        border-radius: 10px;
        background: #fbfbfc;
        padding: 14px 8px 0;
        margin-bottom: 14px;
    }

    /* ---- 옵션 설정 카드(유형별 optionPanelView가 그려지는 영역) ---- */
    #action-app .act-option-card {
        border: 1px solid #eef0f2;
        border-radius: 10px;
        overflow: hidden;
    }

    #action-app .act-option-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        font-weight: 700;
        font-size: 12px;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #action-app .act-option-header i {
        color: #4A90E2;
    }

    #action-app .act-type-badge {
        margin-left: auto;
        background: #eef5ff;
        color: #1d4ed8;
        border-radius: 20px;
        padding: 3px 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: none;
        letter-spacing: 0;
    }

    #action-app .act-type-badge:empty {
        display: none;
    }

    #action-app #actionContentGrid {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        padding: 14px;
    }

    #action-app .act-empty-hint {
        flex: 0 0 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 40px 16px;
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
    }

    #action-app .act-empty-hint i {
        font-size: 22px;
        color: #d7dbe0;
    }

    /* ---- 필드 공통 톤: 화면빌더 옵션패널과 동일한 스타일로 통일 ---- */
    #action-app .act-basic-card .form-group,
    #action-app #actionContentGrid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #action-app .act-basic-card label,
    #action-app #actionContentGrid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #action-app .act-basic-card .form-control,
    #action-app #actionContentGrid .form-control {
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
    }

    #action-app .act-basic-card .form-control:focus,
    #action-app #actionContentGrid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #action-app #actionContentGrid .CodeMirror {
        border: 1px solid #d7dbe0;
        border-radius: 7px;
    }

    #action-app #actionContentGrid > .row,
    #action-app .vb-opt-section-grid > .row {
        flex: 0 0 100%;
        width: 100%;
        margin: 0;
    }

    /* ---- OptionPanel.groupSections()가 만드는 섹션 카드: 화면빌더 옵션패널과 같은 톤 ---- */
    #action-app #actionContentGrid > .vb-opt-section {
        flex: 0 0 100%;
        width: 100%;
        border: 1px solid #eef0f2;
        border-radius: 8px;
        margin: 0 0 10px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
    }

    #action-app #actionContentGrid > .vb-opt-section:last-child {
        margin-bottom: 0;
    }

    #action-app .vb-opt-section-header {
        padding: 9px 12px;
        background: #fbfbfc;
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: #374151;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        user-select: none;
    }

    #action-app .vb-opt-section-header:hover {
        background: #f1f3f5;
    }

    #action-app .vb-opt-section-header:focus-visible {
        outline: 2px solid #4A90E2;
        outline-offset: -2px;
    }

    #action-app .vb-opt-section-chevron {
        color: #9199a3;
        font-size: 10px;
        width: 10px;
        text-align: center;
        transition: transform .2s ease;
    }

    #action-app .vb-opt-section.open .vb-opt-section-chevron {
        transform: rotate(90deg);
    }

    #action-app .vb-opt-section-body {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows .2s ease;
    }

    #action-app .vb-opt-section.open .vb-opt-section-body {
        grid-template-rows: 1fr;
    }

    #action-app .vb-opt-section-grid {
        overflow: hidden;
        min-height: 0;
        display: flex;
        flex-wrap: wrap;
        padding: 0 6px;
        transition: padding .2s ease;
    }

    #action-app .vb-opt-section.open .vb-opt-section-grid {
        padding: 10px 6px 2px;
    }

    #action-app .vb-opt-block {
        background: #fbfbfc;
        border: 1px solid #eef0f2;
        border-radius: 8px;
        padding: 10px;
    }

    #action-app .vb-opt-block-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
    }

    #action-app .vb-opt-block-header label {
        margin: 0;
    }

    #action-app .vb-opt-label-spacer {
        margin-bottom: 5px;
        display: block;
        height: 14px;
    }
</style>
<script th:fragment="script">
        let P_OBJECT_CODE;
        let ACTION_TYPE_CODES = [];
        let ACTION_LIST = [];
        let SELECTED_ACTION_ID = null;

        $( document ).ready(function() {
            console.log('version.0.0.1');
            init();

            $('#type').on('change', function () {
                setActionGrid($('#type').val());
            });
        });

        function setActionGrid(type) {
            VB.builder.actionPanel.setOptionPanel($("#actionContentGrid"), type);
            updateTypeBadge(type);
        }

        function updateTypeBadge(type) {
            const found = ACTION_TYPE_CODES.find(c => c.code === type);
            $("#actionTypeBadge").text(found && found.code ? found.name : '');
        }

        function init() {
            let codes = {
                "ActionType":[
                    {code:"",name:""},
                    {code:"NEW_DATA",name:"new 데이터"},
                    {code:"WORKFLOW",name:"워크플로우"},
                    {code:"SCRIPT",name:"Script"}
                ]
            };

            ACTION_TYPE_CODES = codes.ActionType;
            setCodes(codes);

            App.modalPopup.receiveParam('ACTION_REQUEST', function(data){
                if(!data.objectCode) {
                    alert('오브젝트코드가 존재하지않습니다.');
                }

                P_OBJECT_CODE = data.objectCode;
                getList();
            });
        }

        function setCodes(codes) {
            App.util.setCodeBox("type", codes["ActionType"]);
        }

        function getList() {
            httpClient.get(`/${APPLICATION_ID}/console/api/action`, {objectCode:P_OBJECT_CODE},
                function(response){
                    ACTION_LIST = response || [];
                    renderActionList($("#actionSearch").val());
                },
                function(error){
                    alert('error');
                }
            );
        }

        function typeLabel(type) {
            const found = ACTION_TYPE_CODES.find(c => c.code === type);
            return (found && found.name) ? found.name : type;
        }

        function renderActionList(keyword) {
            const kw = (keyword || '').trim().toLowerCase();
            const filtered = ACTION_LIST.filter(function(item) {
                if(!kw) return true;
                return (item.actionName || '').toLowerCase().includes(kw)
                    || (item.displayName || '').toLowerCase().includes(kw);
            });

            const $body = $("#actionListBody");
            $body.empty();

            if(filtered.length === 0) {
                const $empty = $(`
                    <div class="act-list-empty">
                        <i class="fas fa-inbox"></i>
                        <span></span>
                    </div>
                `);
                $empty.find('span').text(ACTION_LIST.length === 0 ? '등록된 Action이 없습니다.' : '검색 결과가 없습니다.');
                $body.append($empty);
                return;
            }

            for(const item of filtered) {
                const $item = $(`
                    <div class="act-list-item" data-id="${item.id}">
                        <div class="act-list-item-main">
                            <span class="act-list-item-name"></span>
                            <span class="act-list-item-code"></span>
                        </div>
                        <span class="act-type-chip type-${item.type}"></span>
                    </div>
                `);

                $item.find('.act-list-item-name').text(item.displayName || item.actionName);
                $item.find('.act-list-item-code').text(item.actionName);
                $item.find('.act-type-chip').text(typeLabel(item.type));

                if(String(item.id) === String(SELECTED_ACTION_ID)) {
                    $item.addClass('selected');
                }

                $item.on('click', function() {
                    selectAction(item.id);
                });

                $body.append($item);
            }
        }

        function selectAction(id) {
            const item = ACTION_LIST.find(a => String(a.id) === String(id));
            if(!item) return;

            SELECTED_ACTION_ID = id;
            $("#actionListBody .act-list-item").removeClass('selected');
            $(`#actionListBody .act-list-item[data-id="${id}"]`).addClass('selected');

            selectedContent(item);
        }

        function selectedContent(item) {
            httpClient.get(`/${APPLICATION_ID}/console/api/action/${item.id}`, {},
                function(response){
                    setActionGrid(response.type);
                    setContent(response);
                },
                function(error){
                    alert('error');
                }
            );
        }

        function save() {
            httpClient.post(`/${APPLICATION_ID}/console/api/action/upsert`,{},getContent(),
                function(response){
                    alert("저장완료되었습니다.");
                    getList();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function deleteContent() {
          let id = $("#id").val();

          httpClient.delete(`/${APPLICATION_ID}/console/api/action/${id}`, {},
              function(response){
                  alert("삭제 처리 완료되었습니다.");
                  SELECTED_ACTION_ID = null;
                  getList();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function resolveEmpty(v) {
            if(!v || v == '') return null;
            else return v;
        }

        function getContent() {
            const type = $("#type").val();

            let data = {
                id: resolveEmpty($("#id").val()),
                objectCode: resolveEmpty(P_OBJECT_CODE),
                actionName: resolveEmpty($("#actionName").val()),
                displayName: resolveEmpty($("#displayName").val()),
                type: resolveEmpty(type),
                argsName: resolveEmpty($("#argsName").val())
            }

            if(type == 'SCRIPT') {
                const scriptData = VB.builder.actionPanel.getOptions(type);
                data.script = (scriptData) ? scriptData.script : '';
            }
            else {
                data.contents = JSON.stringify(VB.builder.actionPanel.getOptions(type));
            }

            return data;
        }

        function setContent(params) {
            $("#id").val(params.id);
            $("#objectCode").val(params.objectCode);
            $("#actionName").val(params.actionName);
            $("#displayName").val(params.displayName);
            $("#type").val(params.type);
            $("#argsName").val(params.argsName);

            if(params.type == 'SCRIPT') {
                VB.builder.actionPanel.setOptions(params.type, {script:params.script});
            }
            else {
                VB.builder.actionPanel.setOptions(params.type, (params.contents) ? JSON.parse(params.contents) : {});
            }
        }

        function newContent(){
            SELECTED_ACTION_ID = null;
            $("#actionListBody .act-list-item").removeClass('selected');

            setActionGrid('WORKFLOW');

            setContent({
                id:'',
                objectCode:P_OBJECT_CODE,
                actionName:'',
                displayName:'',
                type:'WORKFLOW',
                argsName:'',
                script:'',
                content:{}
            });
        }

        function openPopupWorkflow() {
            App.popup.open(`/${APPLICATION_ID}/console/workflow-builder`,{title:'워크플로우 팝업'});
        }

        function apply() {
            let params = {
                actionName: $("#actionName").val()
            };

            App.modalPopup.sendParamToParent(params);
            App.modalPopup.close();
        }
    </script>
    <div id="action-app" th:fragment="view">
        <div class="act-layout">
            <aside class="act-list-panel">
                <div class="act-panel-header">
                    <h3><i class="fas fa-bolt"></i> Action 목록</h3>
                    <div class="act-panel-tools">
                        <mf-action-button id="search" actionName="getList()" icon="fas fa-sync-alt" label="새로고침"></mf-action-button>
                    </div>
                </div>
                <div class="act-panel-body">
                    <div class="act-list-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="actionSearch" placeholder="Action명, 화면노출명으로 검색" oninput="renderActionList(this.value)">
                    </div>
                    <div class="act-list-body" id="actionListBody"></div>
                </div>
                <div class="act-panel-footer">
                    <mf-action-button id="apply" actionName="apply()" icon="fas fa-check" label="이 Action 선택"></mf-action-button>
                </div>
            </aside>

            <section class="act-detail-panel">
                <div class="act-panel-header">
                    <h3><i class="fas fa-sliders-h"></i> 상세 설정</h3>
                    <div class="act-panel-tools">
                        <mf-action-button id="new" actionName="newContent()" icon="fas fa-plus" label="신규"></mf-action-button>
                        <mf-action-button id="save" actionName="save()" icon="fas fa-save" label="저장"></mf-action-button>
                        <mf-action-button id="delete" actionName="deleteContent()" icon="fas fa-trash" label="삭제"></mf-action-button>
                    </div>
                </div>

                <div class="act-detail-scroll">
                    <div class="d-none">
                        <mf-text-input id="id" label="ID" enable="false" ></mf-text-input>
                        <mf-text-input id="objectCode" label="오브젝트코드" enable="false" ></mf-text-input>
                    </div>

                    <div class="act-basic-card">
                        <mf-text-input id="actionName" label="Action 명" enable="true" size="col-6"></mf-text-input>
                        <mf-text-input id="displayName" label="화면노출명" enable="true" size="col-6"></mf-text-input>
                        <mf-select id="type" label="유형" enable="true" useFirstItem="true" firstItemLabel="" firstItemValue="" size="col-6"></mf-select>
                        <mf-text-input id="argsName" label="argument" enable="true" size="col-6"></mf-text-input>
                    </div>

                    <div class="act-option-card">
                        <div class="act-option-header">
                            <i class="fas fa-cog"></i>
                            <span>옵션 설정</span>
                            <span class="act-type-badge" id="actionTypeBadge"></span>
                        </div>
                        <div id="actionContentGrid"></div>
                    </div>
                </div>
            </section>
        </div>

        <script type="module" src="/ui/view-builder/builder/app-tool.js"></script>
    </div>
</html>
