<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<script th:fragment="script">
        $( document ).ready(function() {
            console.log('version.0.0.1');
            init();
        });

        function init() {
            const codes = {
                TYPE:[
                    {code:"bar",name:"Bar 차트"},
                    {code:"line",name:"Line 차트"}
                ]
            };

            const columns = [
                {field:'alias', label:'차트항목 alias', type:'text', width:180, hide:false, editable: true, align:'center', required:true},
                {field:'name', label:'차트항목명', type:'text', width:180, hide:false, editable: true, align:'center', required:true},
                {field:'type', label:'차트유형', type:'combo', width:120, editable: true, align:'center', required:true, comboCodes:codes.TYPE},
                {field:'color', label:'차트색상', type:'text', width:150, hide:false, editable: true, align:'center', required:false}

            ];

            Sheet.initSheet('mySheet1', "100%", "400px",
                {
                    useSeq:false,
                    useStatus:false,
                    useDelete:true,
                    useDnd:true
                }, columns);

            App.modalPopup.receiveParam('CHART_ITEM_REQUEST', function(data){
                for(let col of data.seriesSetting) {
                    col._status = 'C';
                }

                mySheet1.setSheetData(data.seriesSetting);
            });
        }

        function createColumn() {
            mySheet1.addRowData({
                name:'name',
                type:'bar'
            });
        }

        function apply(){
            let columns = mySheet1.getSheetData();

            const paramsCols = columns.map(({ _status, _delete, _seq, _dnd, ...rest }) => rest);

            let params = {
                seriesSetting:paramsCols
            };

            App.modalPopup.sendParamToParent('CHART_ITEM_RESULT', params);
            App.modalPopup.close();
        }

    </script>
<div th:fragment="view">
    <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">항목설정</h3>
                        <div class="card-tools">
                            <button class="btn btn-default btn-sm" onclick="createColumn()">
                                <i class="fas fa-plus"></i>생성
                            </button>
                            <button class="btn btn-default btn-sm" onclick="apply()">
                                <i class="fas fa-check"></i>적용
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="mySheet1"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>
