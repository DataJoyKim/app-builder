<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<style th:fragment="style">
    #app-user-app {
        padding: 16px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #app-user-app .ds-layout {
        display: flex;
        align-items: flex-start;
        gap: 16px;
    }

    #app-user-app .ds-panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        min-width: 0;
    }

    #app-user-app .ds-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        flex-wrap: wrap;
    }

    #app-user-app .ds-panel-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #app-user-app .ds-panel-header h3 i {
        color: #4A90E2;
    }

    #app-user-app .ds-count {
        font-size: 11px;
        font-weight: 700;
        color: #6b7280;
        background: #f1f3f5;
        border-radius: 999px;
        padding: 1px 8px;
    }

    #app-user-app .ds-panel-tools {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #app-user-app .ds-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #app-user-app .ds-btn:hover {
        background: #f1f3f5;
    }

    #app-user-app .ds-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #app-user-app .ds-btn-primary:hover {
        background: #3d7fce;
    }

    #app-user-app .ds-btn:disabled {
        opacity: .45;
        cursor: not-allowed;
    }

    #app-user-app .ds-btn:disabled:hover {
        background: #fff;
    }

    #app-user-app .ds-btn-primary:disabled:hover {
        background: #4A90E2;
    }

    #app-user-app .ds-list-search {
        position: relative;
        padding: 10px 12px;
        border-bottom: 1px solid #eef0f2;
    }

    #app-user-app .ds-list-search i {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        font-size: 12px;
        pointer-events: none;
    }

    #app-user-app .ds-list-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px 7px 28px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 12.5px;
    }

    #app-user-app .ds-list-search input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    /* 전체선택 / 선택 건수 */
    #app-user-app .ds-select-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        font-size: 12px;
        color: #6b7280;
    }

    #app-user-app .ds-select-bar label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-weight: 600;
        color: #374151;
        cursor: pointer;
    }

    #app-user-app .ds-select-bar strong {
        color: #1d4ed8;
    }

    #app-user-app .ds-link {
        border: 0;
        background: none;
        padding: 0;
        margin-left: 8px;
        font-size: 12px;
        color: #6b7280;
        text-decoration: underline;
        cursor: pointer;
    }

    #app-user-app .ds-list-body {
        height: 520px;
        overflow-y: auto;
    }

    #app-user-app .ds-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid #f1f3f5;
        border-left: 3px solid transparent;
    }

    #app-user-app .ds-candidate-list .ds-list-item {
        cursor: pointer;
        user-select: none;
        transition: background-color .12s ease;
    }

    #app-user-app .ds-candidate-list .ds-list-item:hover {
        background: #fafbfc;
    }

    #app-user-app .ds-candidate-list .ds-list-item.selected {
        background: #eef5ff;
        border-left-color: #4A90E2;
    }

    #app-user-app .ds-list-item input[type="checkbox"] {
        flex: 0 0 auto;
        width: 15px;
        height: 15px;
        margin: 0;
        cursor: pointer;
    }

    #app-user-app .ds-list-item-avatar {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #eef5ff;
        color: #1d4ed8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
    }

    #app-user-app .ds-list-item-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #app-user-app .ds-list-item-name {
        font-size: 13px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #app-user-app .ds-list-item-code {
        font-size: 11px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #app-user-app .ds-role {
        flex: 0 0 auto;
        font-size: 10.5px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        background: #f3f4f6;
        color: #6b7280;
    }

    #app-user-app .ds-role.admin {
        background: #eef5ff;
        color: #1d4ed8;
    }

    #app-user-app .ds-list-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 50px 16px;
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
    }

    #app-user-app .ds-list-empty i {
        font-size: 22px;
        color: #d7dbe0;
    }

    #app-user-app .ds-panel-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
        border-top: 1px solid #eef0f2;
        background: #fbfbfc;
    }

    #app-user-app .ds-hint {
        font-size: 11.5px;
        color: #9199a3;
    }
</style>
<script th:fragment="script">
    // 등록된 애플리케이션 사용자
    let APP_USER_LIST = [];
    // 등록할 수 있는 플랫폼 사용자 (아직 등록되지 않은 User)
    let CANDIDATE_LIST = [];
    // 선택한 userId. 검색어가 바뀌어도 선택은 유지한다
    const SELECTED_USER_IDS = new Set();

    const AUTHORITY_LABEL = {
        APPLICATION_ADMIN: '관리자',
        APPLICATION_USER: '사용자'
    };

    $( document ).ready(function() {
        init();
    });

    function init() {
        reload();
    }

    function reload() {
        getAppUserList();
        getCandidateList();
    }

    function alertError(error) {
        const message = error && error.responseJSON && error.responseJSON.message;
        alert(message || 'error');
    }

    function matches(item, keyword) {
        const kw = (keyword || '').trim().toLowerCase();
        if(!kw) return true;

        return (item.loginId || '').toLowerCase().includes(kw)
            || (item.userName || '').toLowerCase().includes(kw)
            || (item.email || '').toLowerCase().includes(kw);
    }

    function createUserItem(item) {
        const $item = $(`
            <div class="ds-list-item">
                <span class="ds-list-item-avatar"></span>
                <div class="ds-list-item-main">
                    <span class="ds-list-item-name"></span>
                    <span class="ds-list-item-code"></span>
                </div>
            </div>
        `);

        const name = item.userName || item.loginId || `(삭제된 사용자 #${item.userId})`;
        $item.find('.ds-list-item-avatar').text(name.trim().charAt(0).toUpperCase());
        $item.find('.ds-list-item-name').text(name);
        $item.find('.ds-list-item-code').text([item.loginId, item.email].filter(v => v).join(' · '));

        return $item;
    }

    function renderEmpty($body, icon, message) {
        const $empty = $(`
            <div class="ds-list-empty">
                <i class="fas"></i>
                <span></span>
            </div>
        `);
        $empty.find('i').addClass(icon);
        $empty.find('span').text(message);
        $body.append($empty);
    }

    // ---- 등록된 사용자 ----
    function getAppUserList() {
        httpClient.get(`/${APPLICATION_ID}/console/api/app-user`, {},
            function(response){
                APP_USER_LIST = response || [];
                renderAppUserList();
            },
            function(error){
                alertError(error);
            }
        );
    }

    function renderAppUserList() {
        const keyword = $("#appUserSearch").val();
        const filtered = APP_USER_LIST.filter(item => matches(item, keyword));

        $("#appUserCount").text(APP_USER_LIST.length);

        const $body = $("#appUserListBody");
        $body.empty();

        if(filtered.length === 0) {
            renderEmpty($body, 'fa-users', APP_USER_LIST.length === 0 ? '등록된 사용자가 없습니다.' : '검색 결과가 없습니다.');
            return;
        }

        for(const item of filtered) {
            const $item = createUserItem(item);
            $item.append($('<span class="ds-role"></span>')
                .toggleClass('admin', item.authority === 'APPLICATION_ADMIN')
                .text(AUTHORITY_LABEL[item.authority] || item.authority || '-'));

            $body.append($item);
        }
    }

    // ---- 등록할 사용자 검색/선택 ----
    function getCandidateList() {
        httpClient.get(`/${APPLICATION_ID}/console/api/app-user/candidates`, {},
            function(response){
                CANDIDATE_LIST = response || [];

                // 이미 등록되어 후보에서 빠진 사용자는 선택에서도 뺀다
                const candidateIds = new Set(CANDIDATE_LIST.map(item => String(item.userId)));
                for(const userId of Array.from(SELECTED_USER_IDS)) {
                    if(!candidateIds.has(userId)) SELECTED_USER_IDS.delete(userId);
                }

                renderCandidateList();
            },
            function(error){
                alertError(error);
            }
        );
    }

    function filteredCandidates() {
        const keyword = $("#candidateSearch").val();
        return CANDIDATE_LIST.filter(item => matches(item, keyword));
    }

    function renderCandidateList() {
        const filtered = filteredCandidates();

        $("#candidateCount").text(CANDIDATE_LIST.length);

        const $body = $("#candidateListBody");
        $body.empty();

        if(filtered.length === 0) {
            renderEmpty($body, 'fa-user-slash', CANDIDATE_LIST.length === 0 ? '등록할 수 있는 사용자가 없습니다.' : '검색 결과가 없습니다.');
        }

        for(const item of filtered) {
            const userId = String(item.userId);
            const $item = createUserItem(item).attr('data-id', userId);
            const $check = $('<input type="checkbox">').prop('checked', SELECTED_USER_IDS.has(userId));

            $item.toggleClass('selected', SELECTED_USER_IDS.has(userId)).prepend($check);

            // 행 어디를 눌러도 선택/해제된다
            $item.on('click', function(e) {
                if(e.target !== $check[0]) {
                    $check.prop('checked', !$check.prop('checked'));
                }
                toggleCandidate(userId, $check.prop('checked'));
            });

            $body.append($item);
        }

        renderSelectState();
    }

    function toggleCandidate(userId, checked) {
        if(checked) SELECTED_USER_IDS.add(userId);
        else SELECTED_USER_IDS.delete(userId);

        $(`#candidateListBody .ds-list-item[data-id="${userId}"]`).toggleClass('selected', checked);
        renderSelectState();
    }

    // 전체선택은 지금 검색된 사용자를 대상으로 한다
    function toggleAllCandidates(checked) {
        for(const item of filteredCandidates()) {
            const userId = String(item.userId);
            if(checked) SELECTED_USER_IDS.add(userId);
            else SELECTED_USER_IDS.delete(userId);
        }

        renderCandidateList();
    }

    function clearSelection() {
        SELECTED_USER_IDS.clear();
        renderCandidateList();
    }

    function renderSelectState() {
        const filtered = filteredCandidates();
        const selectedInFilter = filtered.filter(item => SELECTED_USER_IDS.has(String(item.userId))).length;

        $("#candidateSelectAll")
            .prop('disabled', filtered.length === 0)
            .prop('checked', filtered.length > 0 && selectedInFilter === filtered.length)
            .prop('indeterminate', selectedInFilter > 0 && selectedInFilter < filtered.length);

        $("#selectedCount").text(SELECTED_USER_IDS.size);
        $("#clearSelectionBtn").toggle(SELECTED_USER_IDS.size > 0);

        $("#registerSelectedBtn").prop('disabled', SELECTED_USER_IDS.size === 0);
        $("#registerSelectedCount").text(SELECTED_USER_IDS.size);
        $("#registerAllBtn").prop('disabled', filtered.length === 0);
    }

    // ---- 등록 ----
    function registerSelected() {
        if(SELECTED_USER_IDS.size === 0) {
            alert("등록할 사용자를 선택해주세요.");
            return;
        }

        register(Array.from(SELECTED_USER_IDS).map(Number));
    }

    // 모두선택등록: 지금 검색된 사용자 전부를 선택해서 등록한다
    function registerAll() {
        const filtered = filteredCandidates();
        if(filtered.length === 0) return;

        const keyword = ($("#candidateSearch").val() || '').trim();
        const target = keyword ? `검색된 사용자 ${filtered.length}명` : `등록되지 않은 사용자 전체 ${filtered.length}명`;
        if(!confirm(`${target}을(를) 모두 등록하시겠습니까?`)) return;

        for(const item of filtered) {
            SELECTED_USER_IDS.add(String(item.userId));
        }
        renderCandidateList();

        register(filtered.map(item => item.userId));
    }

    function register(userIds) {
        httpClient.post(`/${APPLICATION_ID}/console/api/app-user`, {}, {userIds: userIds},
            function(response){
                const skipped = response && response.skipped ? ` (이미 등록된 ${response.skipped}명 제외)` : '';
                alert(`${response ? response.registered : 0}명을 등록했습니다.${skipped}`);

                for(const userId of userIds) {
                    SELECTED_USER_IDS.delete(String(userId));
                }
                reload();
            },
            function(error){
                alertError(error);
            }
        );
    }
</script>
<div id="app-user-app" th:fragment="view">
    <div class="ds-layout">
        <section class="ds-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-users"></i> 등록된 사용자 <span class="ds-count" id="appUserCount">0</span></h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="reload()"><i class="fas fa-sync-alt"></i>새로고침</button>
                </div>
            </div>
            <div class="ds-list-search">
                <i class="fas fa-search"></i>
                <input type="text" id="appUserSearch" placeholder="로그인ID, 성명, email로 검색" autocomplete="off" oninput="renderAppUserList()">
            </div>
            <div class="ds-list-body" id="appUserListBody"></div>
        </section>

        <section class="ds-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-user-plus"></i> 사용자 등록 <span class="ds-count" id="candidateCount">0</span></h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" id="registerAllBtn" onclick="registerAll()" title="검색된 사용자를 모두 선택해서 등록합니다" disabled><i class="fas fa-check-double"></i>모두선택등록</button>
                    <button type="button" class="ds-btn ds-btn-primary" id="registerSelectedBtn" onclick="registerSelected()" disabled><i class="fas fa-check"></i>선택 등록 (<span id="registerSelectedCount">0</span>)</button>
                </div>
            </div>
            <div class="ds-list-search">
                <i class="fas fa-search"></i>
                <input type="text" id="candidateSearch" placeholder="로그인ID, 성명, email로 검색" autocomplete="off" oninput="renderCandidateList()">
            </div>
            <div class="ds-select-bar">
                <label><input type="checkbox" id="candidateSelectAll" onchange="toggleAllCandidates(this.checked)" disabled>전체선택</label>
                <span><strong id="selectedCount">0</strong>명 선택<button type="button" class="ds-link" id="clearSelectionBtn" onclick="clearSelection()" style="display:none">선택 해제</button></span>
            </div>
            <div class="ds-list-body ds-candidate-list" id="candidateListBody"></div>
            <div class="ds-panel-footer">
                <span class="ds-hint">플랫폼에 가입된 사용자 중 이 애플리케이션에 아직 등록되지 않은 사용자만 표시됩니다.</span>
            </div>
        </section>
    </div>
</div>
</html>
