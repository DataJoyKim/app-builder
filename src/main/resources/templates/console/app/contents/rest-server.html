<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #restserver-app {
        padding: 16px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #restserver-app .ds-layout {
        display: flex;
        align-items: flex-start;
        gap: 16px;
    }

    #restserver-app .ds-list-panel,
    #restserver-app .ds-detail-panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #restserver-app .ds-list-panel {
        flex: 0 0 380px;
        display: flex;
        flex-direction: column;
    }

    #restserver-app .ds-detail-panel {
        flex: 1 1 auto;
        min-width: 0;
    }

    #restserver-app .ds-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        flex-wrap: wrap;
    }

    #restserver-app .ds-panel-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #restserver-app .ds-panel-header h3 i {
        color: #4A90E2;
    }

    #restserver-app .ds-panel-tools {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #restserver-app .ds-btn-divider {
        width: 1px;
        align-self: stretch;
        background: #e5e7eb;
        margin: 0 2px;
    }

    #restserver-app .ds-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #restserver-app .ds-btn:hover {
        background: #f1f3f5;
    }

    #restserver-app .ds-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #restserver-app .ds-btn-primary:hover {
        background: #3d7fce;
    }

    #restserver-app .ds-btn-danger {
        color: #dc2626;
    }

    #restserver-app .ds-btn-danger:hover {
        background: #fef2f2;
    }

    /* ---- 목록: ag-Grid 대신 검색+카드형 리스트로 직접 렌더링 ---- */
    #restserver-app .ds-list-search {
        position: relative;
        padding: 10px 12px;
        border-bottom: 1px solid #eef0f2;
    }

    #restserver-app .ds-list-search i {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        font-size: 12px;
        pointer-events: none;
    }

    #restserver-app .ds-list-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px 7px 28px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 12.5px;
    }

    #restserver-app .ds-list-search input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #restserver-app .ds-list-body {
        max-height: 560px;
        min-height: 200px;
        overflow-y: auto;
    }

    #restserver-app .ds-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-bottom: 1px solid #f1f3f5;
        border-left: 3px solid transparent;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #restserver-app .ds-list-item:hover {
        background: #fafbfc;
    }

    #restserver-app .ds-list-item.selected {
        background: #eef5ff;
        border-left-color: #4A90E2;
    }

    #restserver-app .ds-list-item-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #restserver-app .ds-list-item-name {
        font-size: 13px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #restserver-app .ds-list-item.selected .ds-list-item-name {
        color: #1d4ed8;
    }

    #restserver-app .ds-list-item-code {
        font-size: 11px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #restserver-app .ds-list-item-url {
        flex: 0 0 auto;
        max-width: 140px;
        font-size: 10.5px;
        font-weight: 600;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #restserver-app .ds-list-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 50px 16px;
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
    }

    #restserver-app .ds-list-empty i {
        font-size: 22px;
        color: #d7dbe0;
    }

    /* ---- 상세 설정 ---- */
    #restserver-app .ds-detail-body {
        padding: 16px;
    }

    #restserver-app .ds-section {
        border: 1px solid #eef0f2;
        border-radius: 10px;
        margin-bottom: 14px;
        overflow: hidden;
    }

    #restserver-app .ds-section:last-child {
        margin-bottom: 0;
    }

    #restserver-app .ds-section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        font-weight: 700;
        font-size: 12px;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #restserver-app .ds-section-header i {
        color: #4A90E2;
    }

    #restserver-app .ds-section-grid {
        display: flex;
        flex-wrap: wrap;
        padding: 14px 8px 0;
    }

    #restserver-app .ds-section-grid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #restserver-app .ds-section-grid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #restserver-app .ds-section-grid .form-control {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
        background: #fff;
        color: #1f2937;
    }

    #restserver-app .ds-section-grid .form-control:disabled {
        background: #f8f9fa;
        color: #6b7280;
    }

    #restserver-app .ds-section-grid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }
</style>
<script th:fragment="script">
        let DATASOURCE_LIST = [];
        let SELECTED_DATASOURCE_ID = null;

        $( document ).ready(function() {
            init();
        });

        function init() {
            getDataSource();
        }

        function getDataSource() {
            httpClient.get(`/${APPLICATION_ID}/console/api/datasource/rest-server`, {},
                function(response){
                    DATASOURCE_LIST = response || [];
                    renderDataSourceList($("#dsSearch").val());
                },
                function(error){
                    alert('error');
                }
            );
        }

        function renderDataSourceList(keyword) {
            const kw = (keyword || '').trim().toLowerCase();
            const filtered = DATASOURCE_LIST.filter(function(item) {
                if(!kw) return true;
                return (item.dataSourceName || '').toLowerCase().includes(kw)
                    || (item.displayName || '').toLowerCase().includes(kw);
            });

            const $body = $("#dsListBody");
            $body.empty();

            if(filtered.length === 0) {
                const $empty = $(`
                    <div class="ds-list-empty">
                        <i class="fas fa-inbox"></i>
                        <span></span>
                    </div>
                `);
                $empty.find('span').text(DATASOURCE_LIST.length === 0 ? '등록된 REST Server가 없습니다.' : '검색 결과가 없습니다.');
                $body.append($empty);
                return;
            }

            for(const item of filtered) {
                const $item = $(`
                    <div class="ds-list-item" data-id="${item.id}">
                        <div class="ds-list-item-main">
                            <span class="ds-list-item-name"></span>
                            <span class="ds-list-item-code"></span>
                        </div>
                        <span class="ds-list-item-url"></span>
                    </div>
                `);

                $item.find('.ds-list-item-name').text(item.displayName || item.dataSourceName);
                $item.find('.ds-list-item-code').text(item.dataSourceName);
                $item.find('.ds-list-item-url').text(item.baseUrl || '');
                $item.attr('title', item.baseUrl || '');

                if(String(item.id) === String(SELECTED_DATASOURCE_ID)) {
                    $item.addClass('selected');
                }

                $item.on('click', function() {
                    selectDataSource(item.id);
                });

                $body.append($item);
            }
        }

        function selectDataSource(id) {
            const item = DATASOURCE_LIST.find(a => String(a.id) === String(id));
            if(!item) return;

            SELECTED_DATASOURCE_ID = id;
            $("#dsListBody .ds-list-item").removeClass('selected');
            $(`#dsListBody .ds-list-item[data-id="${id}"]`).addClass('selected');

            selectedContent(item);
        }

        function selectedContent(item) {
            httpClient.get(`/${APPLICATION_ID}/console/api/datasource/rest-server/${item.id}`, {},
                function(response){
                    setContentData(response);
                },
                function(error){
                    alert('error');
                }
            );
        }

        function isEmpty(v) {
            return (v == undefined || v == null || v == '');
        }

        function save() {
            let id = $("#id").val();

            if(isEmpty(id))
                insertContent();
            else
                updateContent(id);
        }

        function insertContent() {
            httpClient.post(`/${APPLICATION_ID}/console/api/datasource/rest-server`,{},getContent(),
                function(response){
                    alert("저장완료되었습니다.");
                    getDataSource();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function updateContent(id) {
          httpClient.put(`/${APPLICATION_ID}/console/api/datasource/rest-server/${id}`, {}, getContent(),
              function(response){
                  alert("저장완료되었습니다.");
                  getDataSource();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function deleteContent() {
          let id = $("#id").val();

          httpClient.delete(`/${APPLICATION_ID}/console/api/datasource/rest-server/${id}`, {},
              function(response){
                  alert("삭제 처리 완료되었습니다.");
                  SELECTED_DATASOURCE_ID = null;
                  getDataSource();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function refreshDataSource() {
          let id = $("#id").val();

          httpClient.post(`/${APPLICATION_ID}/console/api/datasource/rest-server/${id}/refresh`,{},{},
              function(response){
                  alert("갱신 완료되었습니다.");
              },
              function(error){
                  alert('error');
              }
          );
        }

        function validateConnectDataSource() {
          let id = $("#id").val();

          httpClient.get(`/${APPLICATION_ID}/console/api/datasource/rest-server/${id}/connect-valid`, {},
              function(response){
                    if(response != null && response.result == true) {
                        alert("연결 성공");
                    }
                    else {
                        alert("연결 실패");
                    }
              },
              function(error){
                  alert('error');
              }
          );
        }

        function setContentData(response) {
            setContent({
                id:response.id,
                displayName:response.displayName,
                dataSourceName:response.dataSourceName,
                note:response.note,
                baseUrl:response.baseUrl,
                connectTimeout:response.connectTimeout,
                connectRequestTimeout:response.connectRequestTimeout,
                connectionMaxTotal:response.connectionMaxTotal,
                connectionDefaultMaxPerRoute:response.connectionDefaultMaxPerRoute
              });
        }

        function getContent() {
            return {
                id: $("#id").val(),
                displayName: $("#displayName").val(),
                dataSourceName: $("#dataSourceName").val(),
                note: $("#note").val(),
                baseUrl: $("#baseUrl").val(),
                connectTimeout: $("#connectTimeout").val(),
                connectRequestTimeout: $("#connectRequestTimeout").val(),
                connectionMaxTotal: $("#connectionMaxTotal").val(),
                connectionDefaultMaxPerRoute:$("#connectionDefaultMaxPerRoute").val()
            }
        }

        function setContent(params) {
            $("#id").val(params.id);
            $("#displayName").val(params.displayName);
            $("#dataSourceName").val(params.dataSourceName);
            $("#note").val(params.note);
            $("#baseUrl").val(params.baseUrl);
            $("#connectTimeout").val(params.connectTimeout);
            $("#connectRequestTimeout").val(params.connectRequestTimeout);
            $("#connectionMaxTotal").val(params.connectionMaxTotal);
            $("#connectionDefaultMaxPerRoute").val(params.connectionDefaultMaxPerRoute);
          }

          function newContent(){
            SELECTED_DATASOURCE_ID = null;
            $("#dsListBody .ds-list-item").removeClass('selected');

            setContent({
                id:'',
                displayName:'',
                dataSourceName:'',
                note:'',
                baseUrl:'',
                connectTimeout:10000,
                connectRequestTimeout:60000,
                connectionMaxTotal:20,
                connectionDefaultMaxPerRoute:2
              });
          }
    </script>
<div id="restserver-app" th:fragment="view">
    <div class="ds-layout">
        <aside class="ds-list-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-server"></i> REST Server 목록</h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="getDataSource()"><i class="fas fa-sync-alt"></i>새로고침</button>
                </div>
            </div>
            <div class="ds-list-search">
                <i class="fas fa-search"></i>
                <input type="text" id="dsSearch" placeholder="DataSource명, 화면노출명으로 검색" oninput="renderDataSourceList(this.value)">
            </div>
            <div class="ds-list-body" id="dsListBody"></div>
        </aside>

        <section class="ds-detail-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-sliders-h"></i> 상세 설정</h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="newContent()"><i class="fas fa-plus"></i>신규</button>
                    <button type="button" class="ds-btn ds-btn-primary" onclick="save()"><i class="fas fa-save"></i>저장</button>
                    <button type="button" class="ds-btn ds-btn-danger" onclick="deleteContent()"><i class="fas fa-trash"></i>삭제</button>
                    <span class="ds-btn-divider"></span>
                    <button type="button" class="ds-btn" onclick="refreshDataSource()"><i class="fas fa-arrow-up"></i>갱신</button>
                    <button type="button" class="ds-btn" onclick="validateConnectDataSource()"><i class="fas fa-check"></i>연결확인</button>
                </div>
            </div>

            <div class="ds-detail-body">
                <input type="hidden" id="id">

                <div class="ds-section">
                    <div class="ds-section-header"><i class="fas fa-info-circle"></i><span>기본 정보</span></div>
                    <div class="ds-section-grid">
                        <div class="form-group col-6">
                            <label for="dataSourceName">DataSource 명</label>
                            <input type="text" class="form-control" id="dataSourceName" autocomplete="off">
                        </div>
                        <div class="form-group col-6">
                            <label for="displayName">화면 노출명</label>
                            <input type="text" class="form-control" id="displayName" autocomplete="off">
                        </div>
                        <div class="form-group col-12">
                            <label for="note">note</label>
                            <input type="text" class="form-control" id="note" autocomplete="off">
                        </div>
                    </div>
                </div>

                <div class="ds-section">
                    <div class="ds-section-header"><i class="fas fa-plug"></i><span>연결 정보</span></div>
                    <div class="ds-section-grid">
                        <div class="form-group col-12">
                            <label for="baseUrl">baseUrl</label>
                            <input type="text" class="form-control" id="baseUrl" autocomplete="off">
                        </div>
                    </div>
                </div>

                <div class="ds-section">
                    <div class="ds-section-header"><i class="fas fa-water"></i><span>커넥션 설정</span></div>
                    <div class="ds-section-grid">
                        <div class="form-group col-3">
                            <label for="connectTimeout">connectTimeout</label>
                            <input type="number" class="form-control" id="connectTimeout">
                        </div>
                        <div class="form-group col-3">
                            <label for="connectRequestTimeout">connectRequestTimeout</label>
                            <input type="number" class="form-control" id="connectRequestTimeout">
                        </div>
                        <div class="form-group col-3">
                            <label for="connectionMaxTotal">connectionMaxTotal</label>
                            <input type="number" class="form-control" id="connectionMaxTotal">
                        </div>
                        <div class="form-group col-3">
                            <label for="connectionDefaultMaxPerRoute">connectionDefaultMaxPerRoute</label>
                            <input type="number" class="form-control" id="connectionDefaultMaxPerRoute">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</html>
