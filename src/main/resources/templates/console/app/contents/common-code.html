<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #commoncode-app {
        padding: 16px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #commoncode-app .ds-layout {
        display: flex;
        align-items: flex-start;
        gap: 16px;
    }

    #commoncode-app .ds-list-panel,
    #commoncode-app .ds-detail-panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #commoncode-app .ds-list-panel {
        flex: 0 0 360px;
        display: flex;
        flex-direction: column;
    }

    #commoncode-app .ds-detail-panel {
        flex: 1 1 auto;
        min-width: 0;
    }

    #commoncode-app .ds-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        flex-wrap: wrap;
    }

    #commoncode-app .ds-panel-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #commoncode-app .ds-panel-header h3 i {
        color: #4A90E2;
    }

    #commoncode-app .ds-panel-tools {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #commoncode-app .ds-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #commoncode-app .ds-btn:hover {
        background: #f1f3f5;
    }

    #commoncode-app .ds-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #commoncode-app .ds-btn-primary:hover {
        background: #3d7fce;
    }

    #commoncode-app .ds-btn-danger {
        color: #dc2626;
    }

    #commoncode-app .ds-btn-danger:hover {
        background: #fef2f2;
    }

    /* ---- 목록: ag-Grid 대신 검색+카드형 리스트로 직접 렌더링 ---- */
    #commoncode-app .ds-list-search {
        position: relative;
        padding: 10px 12px;
        border-bottom: 1px solid #eef0f2;
    }

    #commoncode-app .ds-list-search i {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        font-size: 12px;
        pointer-events: none;
    }

    #commoncode-app .ds-list-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px 7px 28px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 12.5px;
    }

    #commoncode-app .ds-list-search input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #commoncode-app .ds-list-body {
        max-height: 560px;
        min-height: 200px;
        overflow-y: auto;
    }

    #commoncode-app .ds-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-bottom: 1px solid #f1f3f5;
        border-left: 3px solid transparent;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #commoncode-app .ds-list-item:hover {
        background: #fafbfc;
    }

    #commoncode-app .ds-list-item.selected {
        background: #eef5ff;
        border-left-color: #4A90E2;
    }

    #commoncode-app .ds-list-item-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #commoncode-app .ds-list-item-name {
        font-size: 13px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #commoncode-app .ds-list-item.selected .ds-list-item-name {
        color: #1d4ed8;
    }

    #commoncode-app .ds-list-item-code {
        font-size: 11px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #commoncode-app .ds-list-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 50px 16px;
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
    }

    #commoncode-app .ds-list-empty i {
        font-size: 22px;
        color: #d7dbe0;
    }

    /* ---- 상세 설정 ---- */
    #commoncode-app .ds-detail-body {
        padding: 16px;
    }

    #commoncode-app .ds-section {
        border: 1px solid #eef0f2;
        border-radius: 10px;
        margin-bottom: 14px;
        overflow: hidden;
    }

    #commoncode-app .ds-section:last-child {
        margin-bottom: 0;
    }

    #commoncode-app .ds-section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        font-weight: 700;
        font-size: 12px;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #commoncode-app .ds-section-header i {
        color: #4A90E2;
    }

    #commoncode-app .ds-section-grid {
        display: flex;
        flex-wrap: wrap;
        padding: 14px 8px 0;
    }

    #commoncode-app .ds-section-grid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #commoncode-app .ds-section-grid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #commoncode-app .ds-section-grid .form-control {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
        background: #fff;
        color: #1f2937;
    }

    #commoncode-app .ds-section-grid .form-control:disabled {
        background: #f8f9fa;
        color: #6b7280;
    }

    #commoncode-app .ds-section-grid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    /* ---- 관계 편집기(코드 목록): 추가/수정 폼 + 행 리스트 ---- */
    #commoncode-app .rel-body {
        padding: 14px;
    }

    #commoncode-app .rel-add-form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        flex-wrap: wrap;
        padding: 12px;
        background: #fbfbfc;
        border: 1px solid #eef0f2;
        border-radius: 8px;
        margin-bottom: 12px;
    }

    #commoncode-app .rel-add-form .form-group {
        margin-bottom: 0;
    }

    #commoncode-app .rel-add-form label {
        font-size: 11px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 4px;
        display: block;
    }

    #commoncode-app .rel-add-form .form-control {
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
    }

    #commoncode-app .rel-add-actions {
        display: flex;
        gap: 6px;
        margin-left: auto;
    }

    #commoncode-app .rel-list {
        border: 1px solid #eef0f2;
        border-radius: 8px;
        overflow: hidden;
    }

    #commoncode-app .rel-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid #f1f3f5;
    }

    #commoncode-app .rel-row:last-child {
        border-bottom: none;
    }

    #commoncode-app .rel-row:hover {
        background: #fafbfc;
    }

    #commoncode-app .rel-row-main {
        flex: 1 1 auto;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    #commoncode-app .rel-row-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #commoncode-app .rel-field-label {
        font-size: 10px;
        color: #9199a3;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #commoncode-app .rel-field-value {
        color: #1f2937;
        font-weight: 600;
        font-size: 12.5px;
    }

    #commoncode-app .rel-row-actions {
        display: flex;
        gap: 4px;
        flex: 0 0 auto;
    }

    #commoncode-app .rel-icon-btn {
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #374151;
        font-size: 11px;
    }

    #commoncode-app .rel-icon-btn:hover {
        background: #f1f3f5;
    }

    #commoncode-app .rel-icon-btn.danger {
        color: #dc2626;
    }

    #commoncode-app .rel-icon-btn.danger:hover {
        background: #fef2f2;
    }

    #commoncode-app .rel-empty {
        padding: 24px;
        text-align: center;
        color: #9199a3;
        font-size: 12.5px;
    }
</style>
<script th:fragment="script">
        let CODEKIND_LIST = [];
        let SELECTED_CODEKIND_ID = null;
        let CODE_LIST = [];
        let CODE_EDIT_ID = null;

        $( document ).ready(function() {
            console.log('version.0.0.1');
            init();
        });

        function init() {
            getList();
        }

        function getList() {
            httpClient.get(`/${APPLICATION_ID}/console/api/common-code-kind`, {},
                function(response){
                    CODEKIND_LIST = response || [];
                    renderCodeKindList($("#codeKindSearch").val());
                },
                function(error){
                    alert('error');
                }
            );
        }

        function renderCodeKindList(keyword) {
            const kw = (keyword || '').trim().toLowerCase();
            const filtered = CODEKIND_LIST.filter(function(item) {
                if(!kw) return true;
                return (item.code || '').toLowerCase().includes(kw)
                    || (item.name || '').toLowerCase().includes(kw);
            });

            const $body = $("#codeKindListBody");
            $body.empty();

            if(filtered.length === 0) {
                const $empty = $(`
                    <div class="ds-list-empty">
                        <i class="fas fa-inbox"></i>
                        <span></span>
                    </div>
                `);
                $empty.find('span').text(CODEKIND_LIST.length === 0 ? '등록된 코드종류가 없습니다.' : '검색 결과가 없습니다.');
                $body.append($empty);
                return;
            }

            for(const item of filtered) {
                const $item = $(`
                    <div class="ds-list-item" data-id="${item.id}">
                        <div class="ds-list-item-main">
                            <span class="ds-list-item-name"></span>
                            <span class="ds-list-item-code"></span>
                        </div>
                    </div>
                `);

                $item.find('.ds-list-item-name').text(item.name || item.code);
                $item.find('.ds-list-item-code').text(item.code);

                if(String(item.id) === String(SELECTED_CODEKIND_ID)) {
                    $item.addClass('selected');
                }

                $item.on('click', function() {
                    selectCodeKind(item.id);
                });

                $body.append($item);
            }
        }

        function selectCodeKind(id) {
            const item = CODEKIND_LIST.find(a => String(a.id) === String(id));
            if(!item) return;

            SELECTED_CODEKIND_ID = id;
            $("#codeKindListBody .ds-list-item").removeClass('selected');
            $(`#codeKindListBody .ds-list-item[data-id="${id}"]`).addClass('selected');

            selectedContent(item);
        }

        function selectedContent(item) {
            httpClient.get(`/${APPLICATION_ID}/console/api/common-code-kind/${item.id}`, {},
                function(response){
                    setContentData(response);
                    getCommonCode(response.code);
                },
                function(error){
                    alert('error');
                }
            );
        }

        function save() {
            let id = $("#id").val();

            if(!id)
                insertContent();
            else
                updateContent(id);
        }

        function insertContent() {
            httpClient.post(`/${APPLICATION_ID}/console/api/common-code-kind`,{},getContent(),
                function(response){
                    alert("저장완료되었습니다.");
                    getList();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function updateContent(id) {
          httpClient.put(`/${APPLICATION_ID}/console/api/common-code-kind/${id}`, {}, getContent(),
              function(response){
                  alert("저장완료되었습니다.");
                  getList();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function deleteContent() {
          let id = $("#id").val();

          httpClient.delete(`/${APPLICATION_ID}/console/api/common-code-kind/${id}`, {},
              function(response){
                  alert("삭제 처리 완료되었습니다.");
                  SELECTED_CODEKIND_ID = null;
                  getList();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function setContentData(response) {
            setContent({
                id:response.id,
                code:response.code,
                name:response.name
              });
        }

        function getContent() {
            return {
                id: $("#id").val(),
                code: $("#code").val(),
                name: $("#name").val()
            }
        }

        function setContent(params) {
            $("#id").val(params.id);
            $("#code").val(params.code);
            $("#name").val(params.name);
          }

          function newContent(){
            SELECTED_CODEKIND_ID = null;
            $("#codeKindListBody .ds-list-item").removeClass('selected');
            CODE_LIST = [];
            renderCommonCodeList();

            setContent({
                id:'',
                code:'',
                name:''
              });
          }


        function getCommonCode(codeKindCode) {
            httpClient.get(`/${APPLICATION_ID}/console/api/common-code`, {codeKindCode:codeKindCode},
                function(response){
                    CODE_LIST = response || [];
                    renderCommonCodeList();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function renderCommonCodeList() {
            const $body = $("#commonCodeList");
            $body.empty();

            if(CODE_LIST.length === 0) {
                $body.append('<div class="rel-empty">등록된 코드가 없습니다.</div>');
                return;
            }

            const sorted = CODE_LIST.slice().sort((a,b) => (Number(a.orderNum)||0) - (Number(b.orderNum)||0));

            for(const item of sorted) {
                const $row = $(`
                    <div class="rel-row" data-id="${item.id}">
                        <div class="rel-row-main">
                            <div class="rel-row-field"><span class="rel-field-label">code</span><span class="rel-field-value cc-code"></span></div>
                            <div class="rel-row-field"><span class="rel-field-label">name</span><span class="rel-field-value cc-name"></span></div>
                            <div class="rel-row-field"><span class="rel-field-label">순서</span><span class="rel-field-value cc-order"></span></div>
                        </div>
                        <div class="rel-row-actions">
                            <button type="button" class="rel-icon-btn" title="수정"><i class="fas fa-pen"></i></button>
                            <button type="button" class="rel-icon-btn danger" title="삭제"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                `);

                $row.find('.cc-code').text(item.code);
                $row.find('.cc-name').text(item.name);
                $row.find('.cc-order').text(item.orderNum);

                $row.find('.rel-icon-btn:not(.danger)').on('click', function() {
                    editCommonCode(item.id);
                });
                $row.find('.rel-icon-btn.danger').on('click', function() {
                    if(confirm('삭제하시겠습니까?')) {
                        deleteCommonCode($("#code").val(), item);
                    }
                });

                $body.append($row);
            }
        }

        function editCommonCode(id) {
            const item = CODE_LIST.find(a => String(a.id) === String(id));
            if(!item) return;

            CODE_EDIT_ID = id;
            $("#ccCodeInput").val(item.code);
            $("#ccNameInput").val(item.name);
            $("#ccOrderInput").val(item.orderNum);
            $("#ccSubmitBtn").html('<i class="fas fa-check"></i>수정');
            $("#ccCancelBtn").removeClass('d-none');
        }

        function cancelCommonCodeEdit() {
            CODE_EDIT_ID = null;
            $("#ccCodeInput").val('');
            $("#ccNameInput").val('');
            $("#ccOrderInput").val('');
            $("#ccSubmitBtn").html('<i class="fas fa-plus"></i>추가');
            $("#ccCancelBtn").addClass('d-none');
        }

        function submitCommonCode() {
            const codeKindCode = $("#code").val();
            if(!codeKindCode) {
                alert('먼저 코드종류를 저장해주세요.');
                return;
            }

            const item = {
                code: $("#ccCodeInput").val(),
                name: $("#ccNameInput").val(),
                orderNum: $("#ccOrderInput").val()
            };

            if(!item.code) {
                alert('code를 입력해주세요.');
                return;
            }

            if(CODE_EDIT_ID) {
                item.id = CODE_EDIT_ID;
                updateCommonCode(codeKindCode, item);
            }
            else {
                insertCommonCode(codeKindCode, item);
            }

            cancelCommonCodeEdit();
        }

        function insertCommonCode(codeKindCode, item) {
            httpClient.post(`/${APPLICATION_ID}/console/api/common-code`,{},
                {
                   codeKindCode:codeKindCode,
                   code:item.code,
                   name:item.name,
                   orderNum:item.orderNum
                },
                function(response){
                    getCommonCode(codeKindCode);
                },
                function(error){
                    alert('error');
                }
            );
        }

        function updateCommonCode(codeKindCode, item) {
          httpClient.put(`/${APPLICATION_ID}/console/api/common-code/${item.id}`, {},
              {
                   codeKindCode:codeKindCode,
                   code:item.code,
                   name:item.name,
                   orderNum:item.orderNum
              },
              function(response){
                  getCommonCode(codeKindCode);
              },
              function(error){
                  alert('error');
              }
          );
        }

        function deleteCommonCode(codeKindCode, item) {
          httpClient.delete(`/${APPLICATION_ID}/console/api/common-code/${item.id}`, {},
              function(response){
                  getCommonCode(codeKindCode);
              },
              function(error){
                  alert('error');
              }
          );
        }
    </script>
<div id="commoncode-app" th:fragment="view">
    <div class="ds-layout">
        <aside class="ds-list-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-list"></i> 코드종류 목록</h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="getList()"><i class="fas fa-sync-alt"></i>새로고침</button>
                </div>
            </div>
            <div class="ds-list-search">
                <i class="fas fa-search"></i>
                <input type="text" id="codeKindSearch" placeholder="코드, 명칭으로 검색" oninput="renderCodeKindList(this.value)">
            </div>
            <div class="ds-list-body" id="codeKindListBody"></div>
        </aside>

        <section class="ds-detail-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-sliders-h"></i> 상세 내용</h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="newContent()"><i class="fas fa-plus"></i>신규</button>
                    <button type="button" class="ds-btn ds-btn-primary" onclick="save()"><i class="fas fa-save"></i>저장</button>
                    <button type="button" class="ds-btn ds-btn-danger" onclick="deleteContent()"><i class="fas fa-trash"></i>삭제</button>
                </div>
            </div>

            <div class="ds-detail-body">
                <input type="hidden" id="id">

                <div class="ds-section">
                    <div class="ds-section-header"><i class="fas fa-info-circle"></i><span>기본 정보</span></div>
                    <div class="ds-section-grid">
                        <div class="form-group col-6">
                            <label for="code">코드종류</label>
                            <input type="text" class="form-control" id="code" autocomplete="off">
                        </div>
                        <div class="form-group col-6">
                            <label for="name">코드종류명</label>
                            <input type="text" class="form-control" id="name" autocomplete="off">
                        </div>
                    </div>
                </div>

                <div class="ds-section">
                    <div class="ds-section-header"><i class="fas fa-tags"></i><span>코드 목록</span></div>
                    <div class="rel-body">
                        <div class="rel-add-form">
                            <div class="form-group">
                                <label for="ccCodeInput">code</label>
                                <input type="text" class="form-control" id="ccCodeInput" style="width:140px;">
                            </div>
                            <div class="form-group">
                                <label for="ccNameInput">name</label>
                                <input type="text" class="form-control" id="ccNameInput" style="width:180px;">
                            </div>
                            <div class="form-group">
                                <label for="ccOrderInput">순서</label>
                                <input type="number" class="form-control" id="ccOrderInput" style="width:80px;">
                            </div>
                            <div class="rel-add-actions">
                                <button type="button" class="ds-btn ds-btn-primary" id="ccSubmitBtn" onclick="submitCommonCode()"><i class="fas fa-plus"></i>추가</button>
                                <button type="button" class="ds-btn d-none" id="ccCancelBtn" onclick="cancelCommonCodeEdit()">취소</button>
                            </div>
                        </div>
                        <div class="rel-list" id="commonCodeList"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</html>
