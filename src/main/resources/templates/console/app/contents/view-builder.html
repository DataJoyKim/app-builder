<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<div th:fragment="view">
    <div id="app-container">
        <div id="left-panel">
            <div id="object-panel">
                <label class="vb-panel-label">오브젝트</label>
                <div class="vb-object-input-group">
                    <input type="text" class="vb-input" id="objectCode" placeholder="오브젝트코드 입력" spellcheck="false" autocomplete="off" data-watch="true">
                    <button type="button" class="vb-icon-btn" onclick="openPopupObject()" title="오브젝트 찾기">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <input type="text" class="vb-input vb-input-readonly" id="objectName" placeholder="오브젝트명" spellcheck="false" autocomplete="off" data-watch="true" disabled>

                <div class="vb-object-actions">
                    <button type="button" class="vb-btn" onclick="createObject()" title="새 오브젝트 생성">
                        <i class="fas fa-plus-square"></i><span>생성</span>
                    </button>
                    <button type="button" class="vb-btn" onclick="load()" title="오브젝트 불러오기">
                        <i class="fas fa-download"></i><span>불러오기</span>
                    </button>
                    <button type="button" class="vb-btn" onclick="openPopupMenu()" title="메뉴 관리">
                        <i class="fas fa-th-list"></i><span>메뉴</span>
                    </button>
                </div>
            </div>

            <h5><i class="fas fa-shapes"></i> Component</h5>
            <div id="component-panel">
            </div>
        </div>


        <div class="vb-main">
            <div class="vb-topbar">
                <button type="button" class="vb-sidebar-toggle" onclick="toggleLeftPanel()" title="컴포넌트 패널 접기/펼치기">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="vb-title-group">
                    <span class="vb-title-name" id="topbarObjectName">오브젝트를 선택하세요</span>
                    <span class="vb-title-code" id="topbarObjectCode"></span>
                </div>
                <div class="vb-topbar-actions">
                    <!--
                    <button type="button" class="vb-btn d-none" id="previewBtn" onclick="preview()" title="미리보기">
                        <i class="fas fa-eye"></i><span>Preview</span>
                    </button>
                    <button type="button" class="vb-btn d-none" id="cancelPreviewBtn" onclick="cancelPreview()" title="미리보기 종료">
                        <i class="fas fa-undo"></i><span>Cancel</span>
                    </button>
                    -->
                    <button type="button" class="vb-btn" onclick="openPopupCode()" title="코드 보기">
                        <i class="fas fa-book"></i><span>Code</span>
                    </button>
                    <button type="button" class="vb-btn" onclick="openPopupAction()" title="액션 설정">
                        <i class="fas fa-layer-group"></i><span>Action</span>
                    </button>
                    <button type="button" class="vb-btn vb-btn-primary" onclick="save()" title="저장">
                        <i class="fas fa-save"></i><span>저장</span>
                    </button>
                </div>
                <button type="button" class="vb-sidebar-toggle" id="optionPanelToggle" onclick="toggleOptionPanel()" title="옵션 패널 열기/닫기">
                    <i class="fas fa-sliders-h"></i>
                </button>
            </div>

            <div class="vb-workspace">
                <div id="center-panel">
                    <div class="drop-area" id="canvas"></div>
                </div>

                <!-- 컴포넌트를 선택하면 오른쪽에서 슬라이드로 열린다 (builder/app.js) -->
                <aside id="right-panel">
                    <div class="vb-drawer-header">
                        <span class="vb-drawer-title"><i class="fas fa-sliders-h"></i> Option</span>
                        <button type="button" class="vb-drawer-close" onclick="closeOptionPanel()" title="닫기">&times;</button>
                    </div>
                    <div id="options"></div>
                </aside>
            </div>
        </div>

        <!-- 좁은 화면에서 패널이 캔버스 위에 겹쳐 떴을 때 깔리는 배경. 누르면 패널이 닫힌다. -->
        <div class="vb-panel-backdrop" id="panelBackdrop"></div>
    </div>

    <script type="module" src="/ui/view-builder/builder/app.js"></script>
</div>
<script th:fragment="script">
    $( document ).ready(function() {
        togglePreviewBtn(true);

        App.modalPopup.receiveParam('OBJECT_RESULT',function(data){
            if(data.objectCode) {
                $("#objectCode").val(data.objectCode);
                $("#objectName").val(data.objectName);
                updateTopbarTitle();
                load();
            }
        });

        $('#objectCode').on('change', function() {
            loadObject($(this).val());
        });

        $('#objectCode').on('input', updateTopbarTitle);

        initResponsivePanels();
        resetOptionPanel();
    });

    /* ================= Panels ================= */

    const PANEL_TRANSITION_MS = 200; // vb-theme.css 패널 트랜지션(.18s) 종료 후

    // 이 폭 이하(태블릿 세로/모바일)에서는 패널이 캔버스를 밀어내지 않고 위에 겹쳐 뜬다.
    // vb-theme.css의 @media (max-width: 991.98px) 블록과 기준을 맞춰야 한다.
    const NARROW_MEDIA = window.matchMedia('(max-width: 991.98px)');

    function initResponsivePanels() {
        // 처음 상태: PC에서는 컴포넌트/옵션 패널 둘 다 열어두고, 좁은 화면(모바일)에서는
        // 패널이 캔버스 위에 겹쳐 떠서 다 가려버리므로 둘 다 닫아두고 시작한다.
        // 로드하자마자 슬라이드 애니메이션이 보이지 않도록 vb-no-transition으로 트랜지션을 잠시 끄고
        // 클래스만 바로 단 뒤, 두 프레임 뒤(첫 렌더가 끝난 뒤)에 다시 켠다.
        const $container = $("#app-container").addClass('vb-no-transition');
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                $container.removeClass('vb-no-transition');
            });
        });

        if(NARROW_MEDIA.matches) {
            $("#left-panel").addClass('collapsed');
            $("#right-panel").removeClass('open');
            $("#optionPanelToggle").removeClass('is-active');
        }
        else {
            $("#left-panel").removeClass('collapsed');
            $("#right-panel").addClass('open');
            $("#optionPanelToggle").addClass('is-active');
        }

        // 겹쳐 뜬 패널 바깥(반투명 배경)을 누르면 열려 있는 패널을 닫는다.
        // closeOptionPanel()은 옵션패널이 이미 닫혀 있으면 바로 return 해서 배경을 다시
        // 맞추지 않는다. 좌측 패널만 열려 있던 경우 배경이 그대로 남아 화면 전체가 막히므로
        // 여기서 직접 한 번 더 맞춘다.
        $("#panelBackdrop").on('click', function() {
            $("#left-panel").addClass('collapsed');
            closeOptionPanel();
            syncPanelBackdrop();
            notifyCanvasResized();
        });

        // 화면 회전 등으로 폭 기준을 넘나들면 배경 표시 여부를 다시 맞춘다.
        NARROW_MEDIA.addEventListener('change', syncPanelBackdrop);
        syncPanelBackdrop();
    }

    // 반투명 배경은 좁은 화면에서 패널이 하나라도 열려 있을 때만 보인다.
    // 넓은 화면에서는 패널이 캔버스를 밀어낼 뿐 가리지 않으므로 필요 없다.
    // 선택된 컴포넌트가 없어지면(삭제, 다시 불러오기) 옵션 내용을 비우고 안내문구를 보여준다.
    // 패널을 여닫는 건 사용자 버튼에 맡기므로 열림 상태는 건드리지 않는다.
    function resetOptionPanel() {
        // 페이지 로드 직후엔 VB.builder가 아직 준비 전(app.js가 비동기 로드)이라
        // VB.builder.clearOptionPanel()을 거치지 않고 직접 비운다(하는 일은 같다).
        $("#options").html(`
            <div class="vb-empty-hint">
                <i class="fas fa-mouse-pointer"></i>
                <p>캔버스에서 컴포넌트를 선택하면<br>속성을 편집할 수 있습니다.</p>
            </div>`);
    }

    function syncPanelBackdrop() {
        const panelOpen = !$("#left-panel").hasClass('collapsed') || $("#right-panel").hasClass('open');
        $("#panelBackdrop").toggleClass('show', NARROW_MEDIA.matches && panelOpen);
    }

    function toggleLeftPanel() {
        $("#left-panel").toggleClass('collapsed');
        syncPanelBackdrop();
        notifyCanvasResized();
    }

    // 옵션패널은 컴포넌트 패널처럼 상단바 버튼으로만 열고 닫는다.
    // 컴포넌트를 선택하면 내용만 바뀌고, 패널을 여닫지는 않는다.
    function toggleOptionPanel() {
        if($("#right-panel").hasClass('open')) {
            closeOptionPanel();
        }
        else {
            openOptionPanel();
        }
    }

    function openOptionPanel() {
        const $panel = $("#right-panel");
        if($panel.hasClass('open')) {
            return;
        }
        $panel.addClass('open');
        $("#optionPanelToggle").addClass('is-active');
        syncPanelBackdrop();
        notifyCanvasResized();
    }

    function closeOptionPanel() {
        const $panel = $("#right-panel");
        if(!$panel.hasClass('open')) {
            return;
        }
        $panel.removeClass('open');
        $("#optionPanelToggle").removeClass('is-active');
        syncPanelBackdrop();
        notifyCanvasResized();
    }

    // 패널이 열리고 닫히면 캔버스 폭이 바뀐다. 그리드/차트 컴포넌트가 새 폭에 맞춰
    // 다시 그려지도록 트랜지션이 끝난 뒤 resize 이벤트를 한 번 흘려준다.
    function notifyCanvasResized() {
        setTimeout(function() {
            window.dispatchEvent(new Event('resize'));
        }, PANEL_TRANSITION_MS);
    }

    function updateTopbarTitle() {
        const objectCode = $("#objectCode").val();
        const objectName = $("#objectName").val();

        $("#topbarObjectName").text(objectName || (objectCode ? '(이름없음)' : '오브젝트를 선택하세요'));
        $("#topbarObjectCode").text(objectCode || '');
    }

    function togglePreviewBtn(preview) {
        if(preview) {
            $("#previewBtn").removeClass('d-none');
            $("#cancelPreviewBtn").addClass('d-none');
        }
        else {
            $("#previewBtn").addClass('d-none');
            $("#cancelPreviewBtn").removeClass('d-none');
        }
    }

    function openPopupMenu() {
        App.modalPopup.open(`/${APPLICATION_ID}/console/menu`,{title:'메뉴 팝업',messageId:'MENU_REQUEST'});
    }

    function openPopupObject() {
        App.modalPopup.open(`/${APPLICATION_ID}/console/view-object`,{title:'오브젝트 팝업',messageId:'OBJECT_REQUEST'});
    }

    function openPopupAction() {
        let objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트 코드를 입력해주세요');
            return;
        }

        App.modalPopup.open(`/${APPLICATION_ID}/console/action`,{title:'Action 설정',messageId:'ACTION_REQUEST',size:'modal-fullscreen',height:'92vh'},{objectCode:objectCode});
    }

    function openPopupCode() {
        let objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트 코드를 입력해주세요');
            return;
        }

        App.modalPopup.open(`/${APPLICATION_ID}/console/code`,{title:'Code 팝업',messageId:'CODE_REQUEST'},{objectCode:objectCode});
    }

    function save() {
        const json = VB.builder.getViewData();

        const objectCode = $("#objectCode").val();

        if(!objectCode) {
            alert("오브젝트 코드를 입력해주세요.");
            return;
        }

        App.httpClient.post(`/${APPLICATION_ID}/console/api/object-content/upsert`,{},{
                objectCode:objectCode,
                content:JSON.stringify(json, null, 2)
            },
            function(response){
                alert("저장에성공하였습니다.");
            },
            function(error){
                alert("에러가 발생되었습니다.");
            }
        );
    }

    function loadObject(objectCode) {
        httpClient.get(`/${APPLICATION_ID}/console/api/object`, {objectCode:objectCode},
            function(response){
                if(response && response[0]){
                    $("#objectName").val(response[0].objectName);
                    updateTopbarTitle();
                    load();
                }
                else {
                    $("#objectName").val("(없음)");
                    updateTopbarTitle();
                }
            },
            function(error){
                alert('error');
            }
        );
    }


    function createObject() {
        let objectName = prompt("생성할 오브젝트명을 입력해주세요.");
        if(objectName == null) {
            return;
        }

        const objectCode = $("#objectCode").val();

        httpClient.post(`/${APPLICATION_ID}/console/api/object`,{},
            {
                objectCode: objectCode,
                objectName: objectName,
                type: 'VIEW_BUILDER',
                path: '-',
                useAuthValidation: "true",
                usePermissionValidation: "true"
            },
            function(response){
                alert("생성되었습니다.");
                loadObject(objectCode);
            },
            function(error){
                alert('error');
            }
        );
    }

    function load() {
        const objectCode = $("#objectCode").val();

        if(!objectCode) {
            alert("오브젝트 코드를 입력해주세요.");
            return;
        }

        App.httpClient.get(`/${APPLICATION_ID}/console/api/object-content`,{objectCode:objectCode},
            function(response){
                if(response[0]) {
                    loadEditor(JSON.parse(response[0].content));
                }
                else {
                    alert('오브젝트가 존재하지않아 빈화면으로 셋팅됩니다.\n오브젝트를 생성 후 작업을 진행해주세요.');
                    loadEditor([]);
                }
            },
            function(error){
                alert("에러가 발생되었습니다.");
            }
        );
    }

    function loadEditor(data) {
        // 캔버스를 새로 그리면 선택된 컴포넌트가 없어지므로 옵션패널도 닫는다.
        resetOptionPanel();
        VB.builder.loadEditor(data);
    }

    function preview() {
        const objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트 코드를 입력해주세요');
            return;
        }

        togglePreviewBtn(false);
        VB.builder.preview(objectCode);
    }

    function cancelPreview() {
        togglePreviewBtn(true);
        VB.builder.cancelPreview();
    }

    function reload() {
        location.reload();
    }
</script>
