<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<div th:fragment="view">
    <div id="app-container">
        <div id="left-panel">
            <div id="object-panel">
                <label class="vb-panel-label">오브젝트</label>
                <div class="vb-object-input-group">
                    <input type="text" class="vb-input" id="objectCode" placeholder="오브젝트코드 입력" spellcheck="false" autocomplete="off" data-watch="true">
                    <button type="button" class="vb-icon-btn" onclick="openPopupObject()" title="오브젝트 찾기">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <input type="text" class="vb-input vb-input-readonly" id="objectName" placeholder="오브젝트명" spellcheck="false" autocomplete="off" data-watch="true" disabled>

                <div class="vb-object-actions">
                    <button type="button" class="vb-btn" onclick="createObject()" title="새 오브젝트 생성">
                        <i class="fas fa-plus-square"></i><span>생성</span>
                    </button>
                    <button type="button" class="vb-btn" onclick="load()" title="오브젝트 불러오기">
                        <i class="fas fa-download"></i><span>불러오기</span>
                    </button>
                    <button type="button" class="vb-btn" onclick="openPopupMenu()" title="메뉴 관리">
                        <i class="fas fa-th-list"></i><span>메뉴</span>
                    </button>
                </div>
            </div>

            <h5><i class="fas fa-shapes"></i> Component</h5>
            <div id="component-panel">
            </div>
        </div>


        <div id="center-panel">
            <div class="drop-area" id="canvas"></div>
        </div>


        <div id="right-panel">
            <div class="vb-toolbar">
                <button type="button" class="vb-btn d-none" id="previewBtn" onclick="preview()" title="미리보기">
                    <i class="fas fa-eye"></i><span>Preview</span>
                </button>
                <button type="button" class="vb-btn d-none" id="cancelPreviewBtn" onclick="cancelPreview()" title="미리보기 종료">
                    <i class="fas fa-undo"></i><span>Cancel</span>
                </button>
                <button type="button" class="vb-btn" onclick="openPopupCode()" title="코드 보기">
                    <i class="fas fa-book"></i><span>Code</span>
                </button>
                <button type="button" class="vb-btn" onclick="openPopupAction()" title="액션 설정">
                    <i class="fas fa-layer-group"></i><span>Action</span>
                </button>
                <button type="button" class="vb-btn vb-btn-primary" onclick="save()" title="저장">
                    <i class="fas fa-save"></i><span>Save</span>
                </button>
            </div>

            <h5><i class="fas fa-sliders-h"></i> Option</h5>
            <div id="options">
                <div class="vb-empty-hint">
                    <i class="fas fa-mouse-pointer"></i>
                    <p>캔버스에서 컴포넌트를 선택하면<br>속성을 편집할 수 있습니다.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/ui/view-builder/builder/app.js"></script>
</div>
<script th:fragment="script">
    $( document ).ready(function() {
        togglePreviewBtn(true);

        App.modalPopup.receiveParam('OBJECT_RESULT',function(data){
            if(data.objectCode) {
                $("#objectCode").val(data.objectCode);
                $("#objectName").val(data.objectName);
                load();
            }
        });

        $('#objectCode').on('change', function() {
            loadObject($(this).val());
        });
    });

    function togglePreviewBtn(preview) {
        if(preview) {
            $("#previewBtn").removeClass('d-none');
            $("#cancelPreviewBtn").addClass('d-none');
        }
        else {
            $("#previewBtn").addClass('d-none');
            $("#cancelPreviewBtn").removeClass('d-none');
        }
    }

    function openPopupMenu() {
        App.modalPopup.open(`/${APPLICATION_ID}/console/menu`,{title:'메뉴 팝업',messageId:'MENU_REQUEST'});
    }

    function openPopupObject() {
        App.modalPopup.open(`/${APPLICATION_ID}/console/view-object`,{title:'오브젝트 팝업',messageId:'OBJECT_REQUEST'});
    }

    function openPopupAction() {
        let objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트 코드를 입력해주세요');
            return;
        }

        App.modalPopup.open(`/${APPLICATION_ID}/console/action`,{title:'Action 설정',messageId:'ACTION_REQUEST',size:'modal-fullscreen',height:'92vh'},{objectCode:objectCode});
    }

    function openPopupCode() {
        let objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트 코드를 입력해주세요');
            return;
        }

        App.modalPopup.open(`/${APPLICATION_ID}/console/code`,{title:'Code 팝업',messageId:'CODE_REQUEST'},{objectCode:objectCode});
    }

    function save() {
        const json = VB.builder.getViewData();

        const objectCode = $("#objectCode").val();

        if(!objectCode) {
            alert("오브젝트 코드를 입력해주세요.");
            return;
        }

        App.httpClient.post(`/${APPLICATION_ID}/console/api/object-content/upsert`,{},{
                objectCode:objectCode,
                content:JSON.stringify(json, null, 2)
            },
            function(response){
                alert("저장에성공하였습니다.");
            },
            function(error){
                alert("에러가 발생되었습니다.");
            }
        );
    }

    function loadObject(objectCode) {
        httpClient.get(`/${APPLICATION_ID}/console/api/object`, {objectCode:objectCode},
            function(response){
                if(response && response[0]){
                    $("#objectName").val(response[0].objectName);
                    load();
                }
                else {
                    $("#objectName").val("(없음)");
                }
            },
            function(error){
                alert('error');
            }
        );
    }


    function createObject() {
        let objectName = prompt("생성할 오브젝트명을 입력해주세요.");
        if(objectName == null) {
            return;
        }

        const objectCode = $("#objectCode").val();

        httpClient.post(`/${APPLICATION_ID}/console/api/object`,{},
            {
                objectCode: objectCode,
                objectName: objectName,
                type: 'VIEW_BUILDER',
                path: '-',
                useAuthValidation: "true",
                usePermissionValidation: "true"
            },
            function(response){
                alert("생성되었습니다.");
                loadObject(objectCode);
            },
            function(error){
                alert('error');
            }
        );
    }

    function load() {
        const objectCode = $("#objectCode").val();

        if(!objectCode) {
            alert("오브젝트 코드를 입력해주세요.");
            return;
        }

        App.httpClient.get(`/${APPLICATION_ID}/console/api/object-content`,{objectCode:objectCode},
            function(response){
                if(response[0]) {
                    loadEditor(JSON.parse(response[0].content));
                }
                else {
                    alert('오브젝트가 존재하지않아 빈화면으로 셋팅됩니다.\n오브젝트를 생성 후 작업을 진행해주세요.');
                    loadEditor([]);
                }
            },
            function(error){
                alert("에러가 발생되었습니다.");
            }
        );
    }

    function loadEditor(data) {
        VB.builder.loadEditor(data);
    }

    function preview() {
        const objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트 코드를 입력해주세요');
            return;
        }

        togglePreviewBtn(false);
        VB.builder.preview(objectCode);
    }

    function cancelPreview() {
        togglePreviewBtn(true);
        VB.builder.cancelPreview();
    }

    function reload() {
        location.reload();
    }
</script>
