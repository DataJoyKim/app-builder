<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #permission-app {
        padding: 16px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #permission-app .ds-layout {
        display: flex;
        align-items: flex-start;
        gap: 16px;
    }

    #permission-app .ds-list-panel,
    #permission-app .ds-detail-panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #permission-app .ds-list-panel {
        flex: 0 0 360px;
        display: flex;
        flex-direction: column;
    }

    #permission-app .ds-detail-panel {
        flex: 1 1 auto;
        min-width: 0;
    }

    #permission-app .ds-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        flex-wrap: wrap;
    }

    #permission-app .ds-panel-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #permission-app .ds-panel-header h3 i {
        color: #4A90E2;
    }

    #permission-app .ds-panel-tools {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #permission-app .ds-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #permission-app .ds-btn:hover {
        background: #f1f3f5;
    }

    #permission-app .ds-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #permission-app .ds-btn-primary:hover {
        background: #3d7fce;
    }

    #permission-app .ds-btn-danger {
        color: #dc2626;
    }

    #permission-app .ds-btn-danger:hover {
        background: #fef2f2;
    }

    /* ---- 목록: ag-Grid 대신 검색+카드형 리스트로 직접 렌더링 ---- */
    #permission-app .ds-list-search {
        position: relative;
        padding: 10px 12px;
        border-bottom: 1px solid #eef0f2;
    }

    #permission-app .ds-list-search i {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        font-size: 12px;
        pointer-events: none;
    }

    #permission-app .ds-list-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px 7px 28px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 12.5px;
    }

    #permission-app .ds-list-search input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #permission-app .ds-list-body {
        max-height: 560px;
        min-height: 200px;
        overflow-y: auto;
    }

    #permission-app .ds-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-bottom: 1px solid #f1f3f5;
        border-left: 3px solid transparent;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #permission-app .ds-list-item:hover {
        background: #fafbfc;
    }

    #permission-app .ds-list-item.selected {
        background: #eef5ff;
        border-left-color: #4A90E2;
    }

    #permission-app .ds-list-item-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #permission-app .ds-list-item-name {
        font-size: 13px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #permission-app .ds-list-item.selected .ds-list-item-name {
        color: #1d4ed8;
    }

    #permission-app .ds-list-item-code {
        font-size: 11px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #permission-app .ds-list-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 50px 16px;
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
    }

    #permission-app .ds-list-empty i {
        font-size: 22px;
        color: #d7dbe0;
    }

    /* ---- 탭 ---- */
    #permission-app .ds-tabs {
        display: flex;
        gap: 2px;
        padding: 8px 16px 0;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
    }

    #permission-app .ds-tabs .nav-link {
        border: none;
        border-radius: 7px 7px 0 0;
        padding: 8px 16px;
        font-size: 12.5px;
        font-weight: 600;
        color: #6b7280;
        background: transparent;
    }

    #permission-app .ds-tabs .nav-link.active {
        background: #fff;
        color: #1d4ed8;
        box-shadow: inset 0 -2px 0 #4A90E2;
    }

    #permission-app .ds-tab-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #eef0f2;
    }

    #permission-app .ds-tab-toolbar h4 {
        margin: 0;
        font-size: 12.5px;
        font-weight: 700;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    /* ---- 상세 설정 ---- */
    #permission-app .ds-detail-body {
        padding: 16px;
    }

    #permission-app .ds-section-grid {
        display: flex;
        flex-wrap: wrap;
    }

    #permission-app .ds-section-grid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #permission-app .ds-section-grid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #permission-app .ds-section-grid .form-control {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
        background: #fff;
        color: #1f2937;
    }

    #permission-app .ds-section-grid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    /* ---- 관계 편집기(메뉴접근권한) ---- */
    #permission-app .rel-body {
        padding: 16px;
    }

    #permission-app .rel-list {
        border: 1px solid #eef0f2;
        border-radius: 8px;
        overflow: hidden;
    }

    #permission-app .rel-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid #f1f3f5;
    }

    #permission-app .rel-row:last-child {
        border-bottom: none;
    }

    #permission-app .rel-row:hover {
        background: #fafbfc;
    }

    #permission-app .rel-row-main {
        flex: 1 1 auto;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    #permission-app .rel-row-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #permission-app .rel-field-label {
        font-size: 10px;
        color: #9199a3;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #permission-app .rel-field-value {
        color: #1f2937;
        font-weight: 600;
        font-size: 12.5px;
    }

    #permission-app .rel-row-actions {
        display: flex;
        gap: 4px;
        flex: 0 0 auto;
    }

    #permission-app .rel-icon-btn {
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #374151;
        font-size: 11px;
    }

    #permission-app .rel-icon-btn:hover {
        background: #f1f3f5;
    }

    #permission-app .rel-icon-btn.danger {
        color: #dc2626;
    }

    #permission-app .rel-icon-btn.danger:hover {
        background: #fef2f2;
    }

    #permission-app .rel-empty {
        padding: 24px;
        text-align: center;
        color: #9199a3;
        font-size: 12.5px;
    }

    /* ---- ROOT 메뉴 선택 (메뉴접근권한): 좌측 추가된 대상 / 우측 추가할 대상 ---- */
    #permission-app .ma-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        align-items: start;
    }

    @media (max-width: 900px) {
        #permission-app .ma-columns {
            grid-template-columns: 1fr;
        }
    }

    #permission-app .ma-column {
        min-width: 0;
        border: 1px solid #eef0f2;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
    }

    #permission-app .ma-column-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 50px;
        padding: 8px 12px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
    }

    #permission-app .ma-column-title {
        font-size: 12.5px;
        font-weight: 600;
        color: #374151;
    }

    #permission-app .ma-column-head .ds-list-search {
        flex: 1 1 auto;
        padding: 0;
        border-bottom: none;
    }

    #permission-app .ma-column-head .ds-list-search i {
        left: 10px;
    }

    /* 목록이 길어져도 화면이 늘어나지 않도록 각 칸 안에서 스크롤한다 */
    #permission-app .ma-column-body {
        height: calc(100vh - 340px);
        min-height: 240px;
        overflow-y: auto;
    }

    #permission-app .gp-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid #f1f3f5;
    }

    #permission-app .gp-row:last-child {
        border-bottom: none;
    }

    #permission-app .gp-row-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #permission-app .gp-name {
        font-size: 12.5px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #permission-app .gp-name em {
        font-style: normal;
        font-weight: 400;
        color: #9199a3;
        margin-left: 4px;
    }

    #permission-app .gp-path {
        font-size: 11px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #permission-app .gp-bound {
        font-size: 11px;
        font-weight: 700;
        color: #047857;
        white-space: nowrap;
    }
</style>
<script th:fragment="script">
        let PERMISSION_LIST = [];
        let SELECTED_PERMISSION_ID = null;
        let MENU_PERMISSION_LIST = [];
        // 이 애플리케이션의 ROOT 메뉴 (메뉴 트리의 최상위)
        let ROOT_MENU_LIST = [];
        // 선택한 권한으로 실행할 수 있는 워크플로우 (WorkflowPermission)
        let WORKFLOW_PERMISSION_LIST = [];
        // 이 애플리케이션의 워크플로우
        let WORKFLOW_LIST = [];
        // 저장된 권한 코드. WorkflowPermission 은 권한 코드로 연결되므로 입력 중인 코드가 아니라 저장된 코드를 쓴다
        let SAVED_PERMISSION_CODE = '';

        $( document ).ready(function() {
            console.log('version.0.0.5');
            init();
        });

        function init() {
            getList();
            getRootMenuList();
            getWorkflowList();
        }

        function getList() {
            httpClient.get(`/${APPLICATION_ID}/console/api/permission`, {},
                function(response){
                    PERMISSION_LIST = response || [];
                    renderPermissionList($("#permissionSearch").val());
                },
                function(error){
                    alert('error');
                }
            );
        }

        function renderPermissionList(keyword) {
            const kw = (keyword || '').trim().toLowerCase();
            const filtered = PERMISSION_LIST.filter(function(item) {
                if(!kw) return true;
                return (item.code || '').toLowerCase().includes(kw)
                    || (item.name || '').toLowerCase().includes(kw);
            });

            const $body = $("#permissionListBody");
            $body.empty();

            if(filtered.length === 0) {
                const $empty = $(`
                    <div class="ds-list-empty">
                        <i class="fas fa-inbox"></i>
                        <span></span>
                    </div>
                `);
                $empty.find('span').text(PERMISSION_LIST.length === 0 ? '등록된 권한이 없습니다.' : '검색 결과가 없습니다.');
                $body.append($empty);
                return;
            }

            for(const item of filtered) {
                const $item = $(`
                    <div class="ds-list-item" data-id="${item.id}">
                        <div class="ds-list-item-main">
                            <span class="ds-list-item-name"></span>
                            <span class="ds-list-item-code"></span>
                        </div>
                    </div>
                `);

                $item.find('.ds-list-item-name').text(item.name || item.code);
                $item.find('.ds-list-item-code').text(item.code);

                if(String(item.id) === String(SELECTED_PERMISSION_ID)) {
                    $item.addClass('selected');
                }

                $item.on('click', function() {
                    selectPermission(item.id);
                });

                $body.append($item);
            }
        }

        function selectPermission(id) {
            const item = PERMISSION_LIST.find(a => String(a.id) === String(id));
            if(!item) return;

            SELECTED_PERMISSION_ID = id;
            $("#permissionListBody .ds-list-item").removeClass('selected');
            $(`#permissionListBody .ds-list-item[data-id="${id}"]`).addClass('selected');

            selectedContent(item);
        }

        function selectedContent(item) {
            httpClient.get(`/${APPLICATION_ID}/console/api/permission/${item.id}`, {},
                function(response){
                    setContentData(response);
                    getMenuPermission(response.code);
                    getWorkflowPermission();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function isEmpty(v) {
            return (v == undefined || v == null || v == '');
        }

        function save() {
            let id = $("#id").val();

            if(isEmpty(id))
                insertContent();
            else
                updateContent(id);
        }

        function insertContent() {
            httpClient.post(`/${APPLICATION_ID}/console/api/permission`,{},getContent(),
                function(response){
                    alert("저장완료되었습니다.");
                    // 저장한 권한을 선택해 두어야 바로 메뉴접근권한을 추가할 수 있다
                    if(response && response.id) {
                        SELECTED_PERMISSION_ID = response.id;
                        setContentData(response);
                        getMenuPermission(response.code);
                        getWorkflowPermission();
                    }
                    getList();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function updateContent(id) {
          httpClient.put(`/${APPLICATION_ID}/console/api/permission/${id}`, {}, getContent(),
              function(response){
                  alert("저장완료되었습니다.");
                  getList();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function deleteContent() {
          let id = $("#id").val();

          httpClient.delete(`/${APPLICATION_ID}/console/api/permission/${id}`, {},
              function(response){
                  alert("삭제 처리 완료되었습니다.");
                  SELECTED_PERMISSION_ID = null;
                  MENU_PERMISSION_LIST = [];
                  renderMenuPermissionList();
                  SAVED_PERMISSION_CODE = '';
                  WORKFLOW_PERMISSION_LIST = [];
                  renderWorkflowPermissionList();
                  getList();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function setContentData(response) {
            SAVED_PERMISSION_CODE = response.code || '';
            setContent({
                id:response.id,
                code:response.code,
                name:response.name
              });
        }

        function getContent() {
            return {
                id: $("#id").val(),
                code: $("#code").val(),
                name: $("#name").val()
            }
        }

        function setContent(params) {
            $("#id").val(params.id);
            $("#code").val(params.code);
            $("#name").val(params.name);
          }

          function newContent(){
            SELECTED_PERMISSION_ID = null;
            $("#permissionListBody .ds-list-item").removeClass('selected');
            MENU_PERMISSION_LIST = [];
            renderMenuPermissionList();
            SAVED_PERMISSION_CODE = '';
            WORKFLOW_PERMISSION_LIST = [];
            renderWorkflowPermissionList();

            setContent({
                id:'',
                code:'',
                name:''
              });
          }


        function getMenuPermission(permissionCode) {
            httpClient.get(`/${APPLICATION_ID}/console/api/menu-permission`, {permissionCode:permissionCode},
                function(response){
                    MENU_PERMISSION_LIST = (response || []).map(item => ({
                        id: item.id,
                        menuCd: item.menu && item.menu.menuCd,
                        menuNm: item.menu && item.menu.menuNm
                    }));
                    renderMenuPermissionList();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        // ---- 메뉴접근권한: ROOT 메뉴 목록에서 골라 추가 ----
        function alertError(error) {
            const message = error && error.responseJSON && error.responseJSON.message;
            alert(message || 'error');
        }

        // 저장된(선택된) 권한의 id. 신규 작성 중이면 null
        function currentPermissionId() {
            const id = $("#id").val();
            return isEmpty(id) ? null : id;
        }

        // 메뉴 트리의 최상위 메뉴가 ROOT 메뉴다
        function getRootMenuList() {
            httpClient.get(`/${APPLICATION_ID}/console/api/menu/tree`, {},
                function(response){
                    ROOT_MENU_LIST = (response || []).map(menu => ({
                        menuCd: menu.menuCd,
                        menuNm: menu.menuNm,
                        childCount: (menu.children || []).length
                    }));
                    renderMenuPermissionList();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function renderMenuPermissionList() {
            renderBoundMenus();
            renderRootMenuCandidates();
        }

        function rootMenuOf(menuCd) {
            return ROOT_MENU_LIST.find(menu => menu.menuCd === menuCd);
        }

        // 이 권한에 추가된 ROOT 메뉴
        function renderBoundMenus() {
            const $body = $("#menuPermissionList");
            $body.empty();
            $("#menuPermissionCount").text(MENU_PERMISSION_LIST.length);

            if(!currentPermissionId()) {
                $body.append('<div class="rel-empty">권한을 선택하거나 먼저 저장해주세요.</div>');
                return;
            }
            if(MENU_PERMISSION_LIST.length === 0) {
                $body.append('<div class="rel-empty">등록된 메뉴접근권한이 없습니다.</div>');
                return;
            }

            for(const item of MENU_PERMISSION_LIST) {
                const menu = rootMenuOf(item.menuCd);
                const $row = $(`
                    <div class="gp-row">
                        <div class="gp-row-main">
                            <span class="gp-name"></span>
                            <span class="gp-path"></span>
                        </div>
                        <div class="rel-row-actions">
                            <button type="button" class="rel-icon-btn danger" title="삭제"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                `);
                $row.find('.gp-name').text(item.menuNm || item.menuCd).append($('<em></em>').text(item.menuCd));
                $row.find('.gp-path').text(menu ? `하위 메뉴 ${menu.childCount}개` : 'ROOT 메뉴가 아닙니다.');

                $row.find('.rel-icon-btn.danger').on('click', function() {
                    if(confirm(`[${item.menuNm || item.menuCd}] 메뉴접근권한을 삭제하시겠습니까?`)) {
                        deleteMenuPermission(item);
                    }
                });

                $body.append($row);
            }
        }

        // 추가할 수 있는 ROOT 메뉴 목록
        function renderRootMenuCandidates() {
            const $body = $("#rootMenuCandidateList");
            $body.empty();

            const enabled = !!currentPermissionId();
            $("#rootMenuSearch").prop('disabled', !enabled);
            if(!enabled) {
                $body.append('<div class="rel-empty">권한을 선택하거나 먼저 저장해주세요.</div>');
                return;
            }

            const kw = ($("#rootMenuSearch").val() || '').trim().toLowerCase();
            const boundCodes = new Set(MENU_PERMISSION_LIST.map(item => item.menuCd));
            const filtered = ROOT_MENU_LIST.filter(menu => !kw
                || (menu.menuCd || '').toLowerCase().includes(kw)
                || (menu.menuNm || '').toLowerCase().includes(kw));

            if(filtered.length === 0) {
                $body.append(`<div class="rel-empty">${ROOT_MENU_LIST.length === 0 ? '등록된 ROOT 메뉴가 없습니다.' : '검색 결과가 없습니다.'}</div>`);
                return;
            }

            for(const menu of filtered) {
                const $row = $(`
                    <div class="gp-row">
                        <div class="gp-row-main">
                            <span class="gp-name"></span>
                            <span class="gp-path"></span>
                        </div>
                    </div>
                `);
                $row.find('.gp-name').text(menu.menuNm || menu.menuCd).append($('<em></em>').text(menu.menuCd));
                $row.find('.gp-path').text(`하위 메뉴 ${menu.childCount}개`);

                if(boundCodes.has(menu.menuCd)) {
                    $row.append('<span class="gp-bound"><i class="fas fa-check"></i> 추가됨</span>');
                }
                else {
                    const $add = $('<button type="button" class="ds-btn"><i class="fas fa-plus"></i>추가</button>');
                    $add.on('click', () => insertMenuPermission(menu));
                    $row.append($add);
                }

                $body.append($row);
            }
        }

        function insertMenuPermission(menu) {
            const permissionCode = $("#code").val();

            httpClient.post(`/${APPLICATION_ID}/console/api/menu-permission`,{},
                {
                   menuCd:menu.menuCd,
                   permissionCode:permissionCode
                },
                function(response){
                    getMenuPermission(permissionCode);
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function deleteMenuPermission(item) {
            const permissionCode = $("#code").val();

            httpClient.delete(`/${APPLICATION_ID}/console/api/menu-permission/${item.id}`, {},
                function(response){
                    getMenuPermission(permissionCode);
                },
                function(error){
                    alertError(error);
                }
            );
        }

        // ---- 워크플로우실행권한: 워크플로우 목록에서 골라 추가 ----
        // 워크플로우 빌더의 워크플로우별 권한 설정과 같은 데이터(WorkflowPermission)를 권한 기준으로 본다
        function getWorkflowList() {
            httpClient.get(`/${APPLICATION_ID}/console/api/workflow`, {},
                function(response){
                    WORKFLOW_LIST = (response || []).slice().sort((a, b) =>
                        (a.workflowCode || '').localeCompare(b.workflowCode || ''));
                    renderWorkflowPermissionList();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function getWorkflowPermission() {
            if(!SAVED_PERMISSION_CODE) {
                WORKFLOW_PERMISSION_LIST = [];
                renderWorkflowPermissionList();
                return;
            }

            httpClient.get(`/${APPLICATION_ID}/console/api/workflow-permission/by-permission`, {permissionCode: SAVED_PERMISSION_CODE},
                function(response){
                    WORKFLOW_PERMISSION_LIST = response || [];
                    renderWorkflowPermissionList();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function renderWorkflowPermissionList() {
            renderBoundWorkflows();
            renderWorkflowCandidates();
        }

        function workflowLabelOf(workflow) {
            return (workflow && (workflow.displayName || workflow.workflowCode)) || '';
        }

        // 이 권한으로 실행할 수 있는 워크플로우
        function renderBoundWorkflows() {
            const $body = $("#workflowPermissionList");
            $body.empty();
            $("#workflowPermissionCount").text(WORKFLOW_PERMISSION_LIST.length);

            if(!currentPermissionId()) {
                $body.append('<div class="rel-empty">권한을 선택하거나 먼저 저장해주세요.</div>');
                return;
            }
            if(WORKFLOW_PERMISSION_LIST.length === 0) {
                $body.append('<div class="rel-empty">이 권한으로 실행할 수 있는 워크플로우가 없습니다.</div>');
                return;
            }

            for(const item of WORKFLOW_PERMISSION_LIST) {
                const workflow = item.workflow || {};
                const $row = $(`
                    <div class="gp-row">
                        <div class="gp-row-main">
                            <span class="gp-name"></span>
                            <span class="gp-path"></span>
                        </div>
                        <div class="rel-row-actions">
                            <button type="button" class="rel-icon-btn danger" title="삭제"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                `);
                $row.find('.gp-name').text(workflowLabelOf(workflow)).append($('<em></em>').text(workflow.workflowCode || ''));
                $row.find('.gp-path').text(workflow.useAuthValidation === false
                    ? '인증을 사용하지 않는 워크플로우라 권한 검사를 하지 않습니다.'
                    : (workflow.note || ''));

                $row.find('.rel-icon-btn.danger').on('click', function() {
                    if(confirm(`[${workflowLabelOf(workflow)}] 워크플로우실행권한을 삭제하시겠습니까?`)) {
                        deleteWorkflowPermission(item);
                    }
                });

                $body.append($row);
            }
        }

        // 추가할 수 있는 워크플로우
        function renderWorkflowCandidates() {
            const $body = $("#workflowCandidateList");
            $body.empty();

            const enabled = !!currentPermissionId();
            $("#workflowSearch").prop('disabled', !enabled);
            if(!enabled) {
                $body.append('<div class="rel-empty">권한을 선택하거나 먼저 저장해주세요.</div>');
                return;
            }

            const kw = ($("#workflowSearch").val() || '').trim().toLowerCase();
            const boundIds = new Set(WORKFLOW_PERMISSION_LIST.map(item => String(item.workflow && item.workflow.id)));
            const filtered = WORKFLOW_LIST.filter(workflow => !kw
                || (workflow.workflowCode || '').toLowerCase().includes(kw)
                || (workflow.displayName || '').toLowerCase().includes(kw));

            if(filtered.length === 0) {
                $body.append(`<div class="rel-empty">${WORKFLOW_LIST.length === 0 ? '등록된 워크플로우가 없습니다.' : '검색 결과가 없습니다.'}</div>`);
                return;
            }

            for(const workflow of filtered) {
                const $row = $(`
                    <div class="gp-row">
                        <div class="gp-row-main">
                            <span class="gp-name"></span>
                            <span class="gp-path"></span>
                        </div>
                    </div>
                `);
                $row.find('.gp-name').text(workflowLabelOf(workflow)).append($('<em></em>').text(workflow.workflowCode || ''));
                $row.find('.gp-path').text(workflow.useAuthValidation === false ? '인증 미사용' : (workflow.note || ''));

                if(boundIds.has(String(workflow.id))) {
                    $row.append('<span class="gp-bound"><i class="fas fa-check"></i> 추가됨</span>');
                }
                else {
                    const $add = $('<button type="button" class="ds-btn"><i class="fas fa-plus"></i>추가</button>');
                    $add.on('click', () => insertWorkflowPermission(workflow));
                    $row.append($add);
                }

                $body.append($row);
            }
        }

        function insertWorkflowPermission(workflow) {
            httpClient.post(`/${APPLICATION_ID}/console/api/workflow-permission`, {},
                {
                    workflowId: String(workflow.id),
                    permissionCode: SAVED_PERMISSION_CODE
                },
                function(response){
                    getWorkflowPermission();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function deleteWorkflowPermission(item) {
            httpClient.delete(`/${APPLICATION_ID}/console/api/workflow-permission/${item.id}`, {},
                function(response){
                    getWorkflowPermission();
                },
                function(error){
                    alertError(error);
                }
            );
        }
    </script>
<div id="permission-app" th:fragment="view">
    <div class="ds-layout">
        <aside class="ds-list-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-user-shield"></i> 권한 목록</h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="getList()"><i class="fas fa-sync-alt"></i>새로고침</button>
                </div>
            </div>
            <div class="ds-list-search">
                <i class="fas fa-search"></i>
                <input type="text" id="permissionSearch" placeholder="코드, 명칭으로 검색" oninput="renderPermissionList(this.value)">
            </div>
            <div class="ds-list-body" id="permissionListBody"></div>
        </aside>

        <section class="ds-detail-panel">
            <ul class="nav ds-tabs" id="permission-tab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="permission-detail-tab" data-toggle="pill" href="#permission-detail" role="tab" aria-controls="permission-detail" aria-selected="true">상세내용</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="menu-permission-tab" data-toggle="pill" href="#menu-permission" role="tab" aria-controls="menu-permission" aria-selected="false">메뉴접근권한</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="workflow-permission-tab" data-toggle="pill" href="#workflow-permission" role="tab" aria-controls="workflow-permission" aria-selected="false">워크플로우실행권한</a>
                </li>
            </ul>
            <div class="tab-content" id="permission-tabContent">
                <div class="tab-pane fade show active" id="permission-detail" role="tabpanel" aria-labelledby="permission-detail-tab">
                    <div class="ds-tab-toolbar">
                        <h4>상세 내용</h4>
                        <div class="ds-panel-tools">
                            <button type="button" class="ds-btn" onclick="newContent()"><i class="fas fa-plus"></i>신규</button>
                            <button type="button" class="ds-btn ds-btn-primary" onclick="save()"><i class="fas fa-save"></i>저장</button>
                            <button type="button" class="ds-btn ds-btn-danger" onclick="deleteContent()"><i class="fas fa-trash"></i>삭제</button>
                        </div>
                    </div>
                    <div class="ds-detail-body">
                        <input type="hidden" id="id">
                        <div class="ds-section-grid">
                            <div class="form-group col-4">
                                <label for="code">코드</label>
                                <input type="text" class="form-control" id="code" autocomplete="off">
                            </div>
                            <div class="form-group col-4">
                                <label for="name">명칭</label>
                                <input type="text" class="form-control" id="name" autocomplete="off">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="menu-permission" role="tabpanel" aria-labelledby="menu-permission-tab">
                    <div class="ds-tab-toolbar">
                        <h4>메뉴접근권한</h4>
                    </div>
                    <div class="rel-body ma-columns">
                        <!-- 좌측: 이 권한에 추가된 ROOT 메뉴 -->
                        <div class="ma-column">
                            <div class="ma-column-head">
                                <span class="ma-column-title">추가된 ROOT 메뉴 <b id="menuPermissionCount">0</b>개</span>
                            </div>
                            <div class="ma-column-body" id="menuPermissionList"></div>
                        </div>
                        <!-- 우측: 추가할 수 있는 ROOT 메뉴 -->
                        <div class="ma-column">
                            <div class="ma-column-head">
                                <div class="ds-list-search">
                                    <i class="fas fa-search"></i>
                                    <input type="text" id="rootMenuSearch" placeholder="ROOT 메뉴 코드, 명칭으로 검색" autocomplete="off" oninput="renderRootMenuCandidates()">
                                </div>
                                <button type="button" class="ds-btn" onclick="getRootMenuList()" title="ROOT 메뉴 새로고침"><i class="fas fa-sync-alt"></i></button>
                            </div>
                            <div class="ma-column-body" id="rootMenuCandidateList"></div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="workflow-permission" role="tabpanel" aria-labelledby="workflow-permission-tab">
                    <div class="ds-tab-toolbar">
                        <h4>워크플로우실행권한</h4>
                    </div>
                    <div class="rel-body ma-columns">
                        <!-- 좌측: 이 권한으로 실행할 수 있는 워크플로우 -->
                        <div class="ma-column">
                            <div class="ma-column-head">
                                <span class="ma-column-title">추가된 워크플로우 <b id="workflowPermissionCount">0</b>개</span>
                            </div>
                            <div class="ma-column-body" id="workflowPermissionList"></div>
                        </div>
                        <!-- 우측: 추가할 수 있는 워크플로우 -->
                        <div class="ma-column">
                            <div class="ma-column-head">
                                <div class="ds-list-search">
                                    <i class="fas fa-search"></i>
                                    <input type="text" id="workflowSearch" placeholder="워크플로우 코드, 명칭으로 검색" autocomplete="off" oninput="renderWorkflowCandidates()">
                                </div>
                                <button type="button" class="ds-btn" onclick="getWorkflowList()" title="워크플로우 새로고침"><i class="fas fa-sync-alt"></i></button>
                            </div>
                            <div class="ma-column-body" id="workflowCandidateList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</html>
