<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #wfmessage-app {
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 14px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #wfmessage-app .wf-card {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #wfmessage-app .wf-tabs {
        display: flex;
        gap: 2px;
        padding: 8px 16px 0;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        flex: 0 0 auto;
        margin: 0;
        list-style: none;
    }

    #wfmessage-app .wf-tabs .nav-link {
        border: none;
        border-radius: 7px 7px 0 0;
        padding: 8px 16px;
        font-size: 12.5px;
        font-weight: 600;
        color: #6b7280;
        background: transparent;
        cursor: pointer;
    }

    #wfmessage-app .wf-tabs .nav-link.active {
        background: #fff;
        color: #1d4ed8;
        box-shadow: inset 0 -2px 0 #4A90E2;
    }

    #wfmessage-app .wf-tab-content {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
    }

    #wfmessage-app .wf-tab-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #eef0f2;
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 1;
    }

    #wfmessage-app .wf-tab-toolbar h4 {
        margin: 0;
        font-size: 12.5px;
        font-weight: 700;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #wfmessage-app .wf-panel-tools {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #wfmessage-app .wf-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #wfmessage-app .wf-btn:hover {
        background: #f1f3f5;
    }

    #wfmessage-app .wf-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #wfmessage-app .wf-btn-primary:hover {
        background: #3d7fce;
    }

    #wfmessage-app .wf-btn-danger {
        color: #dc2626;
    }

    #wfmessage-app .wf-btn-danger:hover {
        background: #fef2f2;
    }

    #wfmessage-app .wf-btn-success {
        background: #16a34a;
        border-color: #16a34a;
        color: #fff;
    }

    #wfmessage-app .wf-btn-success:hover {
        background: #15803d;
    }

    #wfmessage-app .wf-detail-body {
        padding: 16px;
    }

    #wfmessage-app .wf-section {
        border: 1px solid #eef0f2;
        border-radius: 10px;
        margin-bottom: 14px;
        overflow: hidden;
    }

    #wfmessage-app .wf-section:last-child {
        margin-bottom: 0;
    }

    #wfmessage-app .wf-section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        font-weight: 700;
        font-size: 12px;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #wfmessage-app .wf-section-header i {
        color: #4A90E2;
    }

    #wfmessage-app .wf-section-body {
        padding: 14px;
    }

    #wfmessage-app .wf-section-grid {
        display: flex;
        flex-wrap: wrap;
        padding: 14px 8px 0;
    }

    #wfmessage-app .wf-section-grid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #wfmessage-app .wf-section-grid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #wfmessage-app .wf-section-grid .form-control {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
        background: #fff;
        color: #1f2937;
    }

    #wfmessage-app .wf-section-grid .form-control:disabled {
        background: #f8f9fa;
        color: #6b7280;
    }

    #wfmessage-app .wf-section-grid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #wfmessage-app .wf-lang-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: #92400e;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 7px;
        padding: 6px 10px;
        width: fit-content;
    }

    #wfmessage-app .CodeMirror {
        border: 1px solid #d7dbe0;
        border-radius: 7px;
    }

    /* ---- 인라인 편집 테이블 (jsGrid 대체) ---- */
    #wfmessage-app .wf-table-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 8px;
    }

    #wfmessage-app .wf-table-wrap {
        overflow-x: auto;
        border: 1px solid #eef0f2;
        border-radius: 8px;
    }

    #wfmessage-app .wf-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
    }

    #wfmessage-app .wf-table thead th {
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        text-align: left;
        padding: 8px 10px;
        font-size: 11px;
        font-weight: 700;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: .03em;
        white-space: nowrap;
    }

    #wfmessage-app .wf-table tbody td {
        border-bottom: 1px solid #f1f3f5;
        padding: 6px 8px;
        vertical-align: middle;
    }

    #wfmessage-app .wf-table tbody tr:last-child td {
        border-bottom: none;
    }

    #wfmessage-app .wf-table tbody tr:hover {
        background: #fafbfc;
    }

    #wfmessage-app .wf-cell-input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 6px;
        font-size: 12.5px;
        padding: 5px 8px;
        background: #fff;
    }

    #wfmessage-app .wf-cell-input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #wfmessage-app .wf-table-action-col {
        width: 34px;
        text-align: center;
    }

    #wfmessage-app .wf-row-del-btn {
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #dc2626;
    }

    #wfmessage-app .wf-row-del-btn:hover {
        background: #fef2f2;
    }

    #wfmessage-app .wf-table-empty {
        text-align: center;
        color: #9199a3;
        padding: 20px;
    }

    /* ---- 실행 결과 콘솔 ---- */
    #wfmessage-app .wf-console {
        width: 100%;
        box-sizing: border-box;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 12.5px;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px;
        resize: vertical;
    }
</style>
<script th:fragment="script">
    class EditableTable {
        constructor(containerId, columns) {
            this.containerId = containerId;
            this.columns = columns;
            this.data = [];
            this.render();
        }

        setData(data) {
            this.data = (data || []).map(d => Object.assign({}, d));
            this.render();
        }

        getData() {
            return this.data;
        }

        addRow(defaults) {
            this.data.push(Object.assign({}, defaults));
            this.render();
        }

        removeRow(index) {
            this.data.splice(index, 1);
            this.render();
        }

        render() {
            const $container = $('#' + this.containerId);
            $container.empty();

            const $table = $('<table class="wf-table"></table>');
            const $theadRow = $('<tr></tr>');
            for (const col of this.columns) {
                $theadRow.append($('<th></th>').text(col.label));
            }
            $theadRow.append('<th class="wf-table-action-col"></th>');
            $table.append($('<thead></thead>').append($theadRow));

            const $tbody = $('<tbody></tbody>');
            if (this.data.length === 0) {
                $tbody.append(`<tr><td colspan="${this.columns.length + 1}" class="wf-table-empty">데이터가 없습니다.</td></tr>`);
            }

            this.data.forEach((row, idx) => {
                const $tr = $('<tr></tr>');
                for (const col of this.columns) {
                    const $td = $('<td></td>');
                    const $input = $('<input type="text" class="wf-cell-input">');
                    $input.val(row[col.field] != null ? row[col.field] : '');
                    $input.on('input', (e) => { row[col.field] = $(e.target).val(); });
                    $td.append($input);
                    $tr.append($td);
                }

                const $actionTd = $('<td class="wf-table-action-col"></td>');
                const $delBtn = $('<button type="button" class="wf-row-del-btn" title="삭제"><i class="fas fa-times"></i></button>');
                $delBtn.on('click', () => this.removeRow(idx));
                $actionTd.append($delBtn);
                $tr.append($actionTd);

                $tbody.append($tr);
            });

            $table.append($tbody);
            $container.append($table);
        }
    }

    let codeEditor;
    let functionName;
    let executeGrid;

    $( document ).ready(function() {
        init();
    });

    function init() {
        codeEditor = initCodeEditor('script','text/javascript');
        codeEditor.setSize("100%", "420px");

        executeGrid = new EditableTable('executeGrid', [
            {field:'key', label:'key'},
            {field:'value', label:'value'}
        ]);

        App.modalPopup.receiveParam('FUNC_REQUEST', function(data){
            if(!data.functionName) {
                alert('기능코드가 존재하지않습니다.');
            }

            functionName = data.functionName;
            getCode(functionName);
        });
    }

    function initCodeEditor(id,mode) {
        let textarea = document.getElementById(id);

        return CodeMirror.fromTextArea(textarea, {
            lineNumbers: true,
            lineWrapping: true,
            theme: "darcula",
            mode: mode,
            val: textarea.value
        });
    }

    function execute() {
        let executeTarget = functionName;

        let contents = {};
        const gridData = executeGrid.getData();

        for(const data of gridData) {
            if(data.value == "null") {
                contents[data.key] = null;
            }
            else {
                contents[data.key] = data.value;
            }
        }

        httpClient.post(`/${APPLICATION_ID}/console/api/custom-code/${executeTarget}/execute`,{}, [contents],
            function(response){
                $("#responseData").val(JSON.stringify(response,null,3));
            },
            function(error){
                $("#responseData").val(JSON.stringify(error.responseJSON,null,3));
            }
        );

    }

    function copyResult() {
        const text = $("#responseData").val();
        if (!text) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
        } else {
            const $textarea = $("#responseData");
            $textarea.trigger('select');
            document.execCommand('copy');
        }
    }

    function getCode(functionName) {
        let defaultScript = "params.each { map ->\n";
        defaultScript+= "// TODO processing params\n";
        defaultScript+= "}\n";
        defaultScript+= "return params";

        httpClient.get(`/${APPLICATION_ID}/console/api/message-processor`, {processorName:`${functionName}`},
            function(response){
                let data = response;
                if(data) {
                    setCodeContent(data);
                }
                else {
                    setCodeContent({
                        id:'',
                        processorName:functionName,
                        displayName:'',
                        script:defaultScript
                    });
                }
            },
            function(error){
                alert('error');
            }
        );
    }

    function saveCode() {
        httpClient.post(`/${APPLICATION_ID}/console/api/message-processor/save`,{},getCodeContent(),
            function(response){
                alert("저장완료되었습니다.");
                getCode($("#code-processorName").val());
            },
            function(error){
                alert('error');
            }
        );
    }

    function deleteCode() {
      let id = $("#code-id").val();

      httpClient.delete(`/${APPLICATION_ID}/console/api/message-processor/${id}`, {},
          function(response){
              alert("삭제 되었습니다.");
              getCode($("#code-processorName").val());
          },
          function(error){
              alert('error');
          }
      );
    }

    function getCodeContent() {
        let id = $("#code-id").val();
        return {
            id: ((id) ? id : null),
            processorName: $("#code-processorName").val(),
            displayName: $("#code-displayName").val(),
            script: codeEditor.getValue()
        }
    }

    function setCodeContent(params) {
        $("#code-id").val(params.id);
        $("#code-processorName").val(params.processorName);
        $("#code-displayName").val(params.displayName);
        codeEditor.setValue(params.script);
    }
</script>
<div id="wfmessage-app" th:fragment="view">
    <div class="wf-card">
        <ul class="nav wf-tabs" id="detail-tab" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="workflow-def-tab" data-toggle="pill" href="#workflow-def" role="tab" aria-controls="workflow-def" aria-selected="true">정의</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="execute-tab" data-toggle="pill" href="#execute" role="tab" aria-controls="execute" aria-selected="false">실행</a>
            </li>
        </ul>
        <div class="tab-content wf-tab-content" id="detail-tabContent">

            <div class="tab-pane fade show active" id="workflow-def" role="tabpanel" aria-labelledby="workflow-def-tab">
                <div class="wf-tab-toolbar">
                    <h4>메시지 처리 정의</h4>
                    <div class="wf-panel-tools">
                        <button type="button" class="wf-btn wf-btn-primary" onclick="saveCode()"><i class="fas fa-save"></i>저장</button>
                        <button type="button" class="wf-btn wf-btn-danger" onclick="deleteCode()"><i class="fas fa-trash"></i>삭제</button>
                    </div>
                </div>
                <div class="wf-detail-body">
                    <input type="hidden" id="code-id">

                    <div class="wf-section">
                        <div class="wf-section-header"><i class="fas fa-info-circle"></i><span>기본 정보</span></div>
                        <div class="wf-section-grid">
                            <div class="form-group col-4">
                                <label for="code-processorName">처리기명</label>
                                <input type="text" class="form-control" id="code-processorName" autocomplete="off" disabled>
                            </div>
                            <div class="form-group col-4">
                                <label for="code-displayName">화면노출명</label>
                                <input type="text" class="form-control" id="code-displayName" autocomplete="off">
                            </div>
                            <div class="form-group col-4">
                                <label>처리 방식</label>
                                <div class="wf-lang-badge"><i class="fas fa-code"></i>Script (JavaScript)</div>
                            </div>
                        </div>
                    </div>

                    <div class="wf-section">
                        <div class="wf-section-header"><i class="fas fa-terminal"></i><span>스크립트</span></div>
                        <div class="wf-section-body">
                            <textarea id="script" name="script" style="display:none;"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="execute" role="tabpanel" aria-labelledby="execute-tab">
                <div class="wf-tab-toolbar">
                    <h4>실행 (정의 검증용)</h4>
                    <div class="wf-panel-tools">
                        <button type="button" class="wf-btn" onclick="executeGrid.addRow({})"><i class="fas fa-plus"></i>파라미터 추가</button>
                        <button type="button" class="wf-btn wf-btn-success" onclick="execute()"><i class="fas fa-play"></i>실행</button>
                    </div>
                </div>
                <div class="wf-detail-body">
                    <div class="wf-section">
                        <div class="wf-section-header"><i class="fas fa-sliders-h"></i><span>실행 파라미터 (params)</span></div>
                        <div class="wf-section-body">
                            <div class="wf-table-wrap" id="executeGrid"></div>
                        </div>
                    </div>
                    <div class="wf-section">
                        <div class="wf-section-header">
                            <i class="fas fa-terminal"></i><span>실행 결과</span>
                            <button type="button" class="wf-btn" style="margin-left:auto;" onclick="copyResult()"><i class="fas fa-copy"></i>복사</button>
                        </div>
                        <div class="wf-section-body">
                            <textarea class="wf-console" id="responseData" rows="14" readonly></textarea>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</html>
