<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #company-app {
        padding: 16px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #company-app .ds-layout {
        display: flex;
        align-items: flex-start;
        gap: 16px;
    }

    #company-app .ds-list-panel,
    #company-app .ds-detail-panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #company-app .ds-list-panel {
        flex: 0 0 360px;
        display: flex;
        flex-direction: column;
    }

    #company-app .ds-detail-panel {
        flex: 1 1 auto;
        min-width: 0;
    }

    #company-app .ds-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        flex-wrap: wrap;
    }

    #company-app .ds-panel-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #company-app .ds-panel-header h3 i {
        color: #4A90E2;
    }

    #company-app .ds-panel-tools {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #company-app .ds-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #company-app .ds-btn:hover {
        background: #f1f3f5;
    }

    #company-app .ds-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #company-app .ds-btn-primary:hover {
        background: #3d7fce;
    }

    #company-app .ds-btn-danger {
        color: #dc2626;
    }

    #company-app .ds-btn-danger:hover {
        background: #fef2f2;
    }

    #company-app .ds-list-search {
        position: relative;
        padding: 10px 12px;
        border-bottom: 1px solid #eef0f2;
    }

    #company-app .ds-list-search i {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        font-size: 12px;
        pointer-events: none;
    }

    #company-app .ds-list-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px 7px 28px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 12.5px;
    }

    #company-app .ds-list-search input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #company-app .ds-list-body {
        max-height: 560px;
        min-height: 200px;
        overflow-y: auto;
    }

    #company-app .ds-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-bottom: 1px solid #f1f3f5;
        border-left: 3px solid transparent;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #company-app .ds-list-item:hover {
        background: #fafbfc;
    }

    #company-app .ds-list-item.selected {
        background: #eef5ff;
        border-left-color: #4A90E2;
    }

    #company-app .ds-list-item-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #company-app .ds-list-item-name {
        font-size: 13px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #company-app .ds-list-item.selected .ds-list-item-name {
        color: #1d4ed8;
    }

    #company-app .ds-list-item-code {
        font-size: 11px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #company-app .ds-list-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 50px 16px;
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
    }

    #company-app .ds-list-empty i {
        font-size: 22px;
        color: #d7dbe0;
    }

    #company-app .ds-tab-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #eef0f2;
    }

    #company-app .ds-tab-toolbar h4 {
        margin: 0;
        font-size: 12.5px;
        font-weight: 700;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #company-app .ds-detail-body {
        padding: 16px;
    }

    #company-app .ds-section-grid {
        display: flex;
        flex-wrap: wrap;
    }

    #company-app .ds-section-grid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #company-app .ds-section-grid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #company-app .ds-section-grid .form-control {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
        background: #fff;
        color: #1f2937;
    }

    #company-app .ds-section-grid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }
</style>
<script th:fragment="script">
        let COMPANY_LIST = [];
        let SELECTED_COMPANY_ID = null;

        $( document ).ready(function() {
            console.log('version.0.0.1');
            getList();
        });

        function alertError(error) {
            const message = error && error.responseJSON && error.responseJSON.message;
            alert(message || 'error');
        }

        function isEmpty(v) {
            return (v == undefined || v == null || v == '');
        }

        // isEmpty 는 0 도 비었다고 보므로 순서는 따로 확인한다
        function hasOrderNum(item) {
            return item.orderNum !== undefined && item.orderNum !== null && item.orderNum !== '';
        }

        function getList() {
            httpClient.get(`/${APPLICATION_ID}/console/api/company`, {},
                function(response){
                    COMPANY_LIST = response || [];
                    renderCompanyList($("#companySearch").val());
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function renderCompanyList(keyword) {
            const kw = (keyword || '').trim().toLowerCase();
            const filtered = COMPANY_LIST.filter(function(item) {
                if(!kw) return true;
                return (item.companyCode || '').toLowerCase().includes(kw)
                    || (item.companyName || '').toLowerCase().includes(kw);
            });

            const $body = $("#companyListBody");
            $body.empty();

            if(filtered.length === 0) {
                const $empty = $(`
                    <div class="ds-list-empty">
                        <i class="fas fa-inbox"></i>
                        <span></span>
                    </div>
                `);
                $empty.find('span').text(COMPANY_LIST.length === 0 ? '등록된 회사가 없습니다.' : '검색 결과가 없습니다.');
                $body.append($empty);
                return;
            }

            for(const item of filtered) {
                const $item = $(`
                    <div class="ds-list-item" data-id="${item.id}">
                        <div class="ds-list-item-main">
                            <span class="ds-list-item-name"></span>
                            <span class="ds-list-item-code"></span>
                        </div>
                    </div>
                `);

                $item.find('.ds-list-item-name').text(item.companyName || item.companyCode);
                // 목록은 서버가 순서(orderNum) 순으로 준다. 순서가 없는 회사는 맨 뒤
                $item.find('.ds-list-item-code').text(hasOrderNum(item) ? `${item.companyCode} · 순서 ${item.orderNum}` : item.companyCode);

                if(String(item.id) === String(SELECTED_COMPANY_ID)) {
                    $item.addClass('selected');
                }

                $item.on('click', function() {
                    selectCompany(item.id);
                });

                $body.append($item);
            }
        }

        function selectCompany(id) {
            const item = COMPANY_LIST.find(a => String(a.id) === String(id));
            if(!item) return;

            SELECTED_COMPANY_ID = id;
            $("#companyListBody .ds-list-item").removeClass('selected');
            $(`#companyListBody .ds-list-item[data-id="${id}"]`).addClass('selected');

            setContent(item);
        }

        function save() {
            const params = getContent();

            if(isEmpty(params.companyCode) || isEmpty(params.companyName)) {
                alert('회사코드와 회사명을 입력해주세요.');
                return;
            }
            if(params.orderNum !== '' && !/^-?\d+$/.test(params.orderNum)) {
                alert('순서는 숫자로 입력해주세요.');
                return;
            }

            if(isEmpty(params.id))
                insertContent(params);
            else
                updateContent(params);
        }

        function insertContent(params) {
            httpClient.post(`/${APPLICATION_ID}/console/api/company`, {}, params,
                function(response){
                    alert("저장완료되었습니다.");
                    if(response && response.id) {
                        SELECTED_COMPANY_ID = response.id;
                        setContent(response);
                    }
                    getList();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function updateContent(params) {
            httpClient.put(`/${APPLICATION_ID}/console/api/company/${params.id}`, {}, params,
                function(response){
                    alert("저장완료되었습니다.");
                    getList();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function deleteContent() {
            const id = $("#id").val();
            if(isEmpty(id)) {
                alert('삭제할 회사를 선택해주세요.');
                return;
            }
            if(!confirm('삭제하시겠습니까?')) return;

            httpClient.delete(`/${APPLICATION_ID}/console/api/company/${id}`, {},
                function(response){
                    alert("삭제 처리 완료되었습니다.");
                    newContent();
                    getList();
                },
                function(error){
                    alertError(error);
                }
            );
        }

        function getContent() {
            return {
                id: $("#id").val(),
                companyCode: $("#companyCode").val(),
                companyName: $("#companyName").val(),
                orderNum: ($("#orderNum").val() || '').trim()
            }
        }

        function setContent(params) {
            $("#id").val(params.id);
            $("#companyCode").val(params.companyCode);
            $("#companyName").val(params.companyName);
            $("#orderNum").val(hasOrderNum(params) ? params.orderNum : '');
        }

        function newContent() {
            SELECTED_COMPANY_ID = null;
            $("#companyListBody .ds-list-item").removeClass('selected');

            setContent({
                id:'',
                companyCode:'',
                companyName:'',
                orderNum:''
            });
        }
    </script>
<div id="company-app" th:fragment="view">
    <div class="ds-layout">
        <aside class="ds-list-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-building"></i> 회사 목록</h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="getList()"><i class="fas fa-sync-alt"></i>새로고침</button>
                </div>
            </div>
            <div class="ds-list-search">
                <i class="fas fa-search"></i>
                <input type="text" id="companySearch" placeholder="회사코드, 회사명으로 검색" oninput="renderCompanyList(this.value)">
            </div>
            <div class="ds-list-body" id="companyListBody"></div>
        </aside>

        <section class="ds-detail-panel">
            <div class="ds-tab-toolbar">
                <h4>상세 내용</h4>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="newContent()"><i class="fas fa-plus"></i>신규</button>
                    <button type="button" class="ds-btn ds-btn-primary" onclick="save()"><i class="fas fa-save"></i>저장</button>
                    <button type="button" class="ds-btn ds-btn-danger" onclick="deleteContent()"><i class="fas fa-trash"></i>삭제</button>
                </div>
            </div>
            <div class="ds-detail-body">
                <input type="hidden" id="id">
                <div class="ds-section-grid">
                    <div class="form-group col-4">
                        <label for="companyCode">회사코드</label>
                        <input type="text" class="form-control" id="companyCode" autocomplete="off">
                    </div>
                    <div class="form-group col-4">
                        <label for="companyName">회사명</label>
                        <input type="text" class="form-control" id="companyName" autocomplete="off">
                    </div>
                    <div class="form-group col-4">
                        <label for="orderNum">순서</label>
                        <input type="number" class="form-control" id="orderNum" step="1" placeholder="작을수록 앞 (비우면 맨 뒤)" autocomplete="off">
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</html>
