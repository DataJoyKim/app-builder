<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    /* ============ Full-height page shell ============ */
    html, body {
        height: 100% !important;
        margin: 0;
    }

    .wrapper {
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .wrapper > div {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    /* ============ App shell ============ */
    .usergroup-app {
        display: flex;
        flex: 1;
        min-height: 0;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        background: #ffffff;
    }

    /* ============ Tree pane ============ */
    .usergroup-tree-pane {
        width: 340px;
        flex: 0 0 340px;
        border-right: 1px solid #eef0f2;
        display: flex;
        flex-direction: column;
        background: #fbfbfc;
    }

    .usergroup-tree-header {
        padding: 14px;
        border-bottom: 1px solid #eef0f2;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .usergroup-tree-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .usergroup-tree-header-top h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        color: #1f2937;
    }

    .btn-new-root-usergroup {
        border: none;
        border-radius: 8px;
        background: #4A90E2;
        color: #fff;
        padding: 7px 12px;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }

    .btn-new-root-usergroup:hover {
        background: #3d7fce;
    }

    .btn-new-root-usergroup:disabled {
        opacity: .45;
        cursor: not-allowed;
    }

    .usergroup-company select {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid #d7dbe0;
        border-radius: 6px;
        font-size: 12.5px;
        background: #fff;
    }

    .usergroup-company-empty {
        margin-top: 6px;
        font-size: 12px;
        color: #9199a3;
    }

    .usergroup-search {
        position: relative;
    }

    .usergroup-search input {
        width: 100%;
        padding: 6px 30px 6px 10px;
        border: 1px solid #d7dbe0;
        border-radius: 6px;
        font-size: 12.5px;
    }

    .usergroup-search i {
        position: absolute;
        right: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        font-size: 12px;
        pointer-events: none;
    }

    .usergroup-tree-toolbar {
        display: flex;
        gap: 6px;
    }

    .usergroup-tree-toolbar button {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12px;
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 7px;
        padding: 6px 8px;
        cursor: pointer;
        color: #374151;
    }

    .usergroup-tree-toolbar button:hover {
        background: #f1f3f5;
    }

    .usergroup-tree-toolbar button:disabled {
        opacity: .45;
        cursor: not-allowed;
    }

    .usergroup-tree-toolbar button.btn-danger-outline {
        color: #dc2626;
        border-color: #f3c9c9;
    }

    .usergroup-tree-toolbar button.btn-danger-outline:hover:not(:disabled) {
        background: #fef2f2;
    }

    .usergroup-tree-wrap {
        flex: 1;
        overflow: auto;
        padding: 10px 8px;
    }

    .usergroup-tree-empty {
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
        padding: 32px 12px;
        line-height: 1.6;
    }

    /* ============ jsTree skin override ============ */
    #usergroup_tree {
        min-height: 40px;
    }

    #usergroup_tree.jstree-default .jstree-anchor {
        height: 32px;
        line-height: 32px;
        font-size: 13px;
        color: #374151;
        border-radius: 6px;
        padding-right: 8px;
    }

    #usergroup_tree.jstree-default .jstree-hovered {
        background: #f1f3f5;
        box-shadow: none;
    }

    #usergroup_tree.jstree-default .jstree-clicked {
        background: #eef5ff;
        color: #1d4ed8;
        box-shadow: none;
    }

    #usergroup_tree.jstree-default .jstree-wholerow-hovered {
        background: #f1f3f5;
    }

    #usergroup_tree.jstree-default .jstree-wholerow-clicked {
        background: #eef5ff;
    }

    #usergroup_tree.jstree-default .jstree-wholerow {
        height: 32px;
        border-radius: 6px;
    }

    #usergroup_tree.jstree-default .jstree-icon.fas,
    #usergroup_tree.jstree-default .jstree-icon.far,
    #usergroup_tree.jstree-default .jstree-icon.fa {
        font-size: 13px;
        color: #6b7280;
    }

    #usergroup_tree.jstree-default .jstree-clicked .jstree-icon.fas,
    #usergroup_tree.jstree-default .jstree-clicked .jstree-icon.far,
    #usergroup_tree.jstree-default .jstree-clicked .jstree-icon.fa {
        color: #1d4ed8;
    }

    #usergroup_tree .jstree-anchor .fa-plus {
        color: #16a34a !important;
    }

    #usergroup_tree .jstree-anchor .fa-pen {
        color: #d97706 !important;
    }

    #usergroup_tree .jstree-anchor .fa-trash {
        color: #dc2626 !important;
        text-decoration: line-through;
    }

    #usergroup_tree.jstree-default .jstree-search {
        color: #1d4ed8;
        font-weight: 600;
    }

    /* ============ Detail pane ============ */
    .usergroup-detail-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .usergroup-detail-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 18px;
        border-bottom: 1px solid #eef0f2;
        min-height: 52px;
    }

    .usergroup-breadcrumb {
        font-size: 13px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
    }

    .usergroup-breadcrumb b {
        color: #1f2937;
        font-weight: 700;
    }

    .usergroup-detail-actions {
        display: flex;
        gap: 6px;
        flex: 0 0 auto;
    }

    .usergroup-detail-actions button {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
        color: #374151;
        white-space: nowrap;
    }

    .usergroup-detail-actions button:hover {
        background: #f1f3f5;
    }

    .usergroup-detail-actions button.btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    .usergroup-detail-actions button.btn-primary:hover {
        background: #3d7fce;
    }

    .usergroup-detail-actions button.btn-danger {
        color: #dc2626;
        border-color: #f3c9c9;
    }

    .usergroup-detail-actions button.btn-danger:hover {
        background: #fef2f2;
    }

    .usergroup-detail-actions button:disabled {
        opacity: .45;
        cursor: not-allowed;
        pointer-events: none;
    }

    .usergroup-detail-body {
        flex: 1;
        overflow-y: auto;
        padding: 0;
    }

    .usergroup-empty-state {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #9199a3;
        gap: 10px;
        text-align: center;
    }

    .usergroup-empty-state i {
        font-size: 34px;
        color: #d7dbe0;
    }

    .usergroup-empty-state p {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.7;
    }

    .usergroup-pending-delete-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #fef2f2;
        border: 1px solid #f3c9c9;
        color: #b91c1c;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 12.5px;
        margin: 18px 24px 0;
    }

    .usergroup-pending-delete-banner button {
        border: 1px solid #f3c9c9;
        background: #fff;
        color: #b91c1c;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
    }

    .usergroup-pending-delete-banner button:hover {
        background: #fee2e2;
    }

    /* ============ 탭 ============ */
    .usergroup-tabs {
        display: flex;
        gap: 2px;
        padding: 8px 24px 0;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
    }

    .usergroup-tabs .nav-link {
        border: none;
        border-radius: 7px 7px 0 0;
        padding: 8px 16px;
        font-size: 12.5px;
        font-weight: 600;
        color: #6b7280;
        background: transparent;
    }

    .usergroup-tabs .nav-link.active {
        background: #fff;
        color: #1d4ed8;
        box-shadow: inset 0 -2px 0 #4A90E2;
    }

    .usergroup-tab-toolbar {
        padding: 16px 24px 0;
    }

    .usergroup-tab-toolbar h4 {
        margin: 0;
        font-size: 12.5px;
        font-weight: 700;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    .usergroup-field {
        margin-bottom: 18px;
        max-width: 560px;
    }

    .usergroup-field label {
        font-size: 12px;
        font-weight: 600;
        color: #6b7280;
        display: block;
        margin-bottom: 6px;
    }

    .usergroup-field-hint {
        font-size: 11.5px;
        color: #9199a3;
        margin-top: 5px;
    }

    .usergroup-field-row {
        display: flex;
        gap: 16px;
        max-width: 560px;
    }

    .usergroup-field-row .usergroup-field {
        flex: 1;
        max-width: none;
    }

    .usergroup-input {
        width: 100%;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 13.5px;
        color: #1f2937;
        box-sizing: border-box;
    }

    .usergroup-input:focus {
        outline: none;
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
    }

    .usergroup-input.usergroup-input-lg {
        font-size: 16px;
        font-weight: 600;
        padding: 10px 12px;
    }

    .usergroup-input-readonly {
        width: 100%;
        border: 1px solid #eef0f2;
        background: #f8f9fa;
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 13.5px;
        color: #6b7280;
        box-sizing: border-box;
    }

    /* ---- 관계 편집기(사용자 / 권한 부여) ---- */
    .ds-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    .ds-btn:hover {
        background: #f1f3f5;
    }

    .ds-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    .ds-btn-primary:hover {
        background: #3d7fce;
    }

    .rel-locked-msg {
        padding: 24px;
        text-align: center;
        color: #9199a3;
        font-size: 12.5px;
    }

    .rel-body {
        padding: 16px 24px;
    }

    .rel-add-form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        flex-wrap: wrap;
        padding: 12px;
        background: #fbfbfc;
        border: 1px solid #eef0f2;
        border-radius: 8px;
        margin-bottom: 12px;
    }

    .rel-add-form .form-group {
        margin-bottom: 0;
    }

    .rel-add-form label {
        font-size: 11px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 4px;
        display: block;
    }

    .rel-add-form .form-control {
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
    }

    .rel-add-actions {
        display: flex;
        gap: 6px;
        margin-left: auto;
    }

    .rel-list {
        border: 1px solid #eef0f2;
        border-radius: 8px;
        overflow: hidden;
    }

    .rel-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid #f1f3f5;
    }

    .rel-row:last-child {
        border-bottom: none;
    }

    .rel-row:hover {
        background: #fafbfc;
    }

    .rel-row-main {
        flex: 1 1 auto;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .rel-row-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .rel-field-label {
        font-size: 10px;
        color: #9199a3;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    .rel-field-value {
        color: #1f2937;
        font-weight: 600;
        font-size: 12.5px;
    }

    .rel-row-actions {
        display: flex;
        gap: 4px;
        flex: 0 0 auto;
    }

    .rel-icon-btn {
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #374151;
        font-size: 11px;
    }

    .rel-icon-btn:hover {
        background: #f1f3f5;
    }

    .rel-icon-btn.danger {
        color: #dc2626;
    }

    .rel-icon-btn.danger:hover {
        background: #fef2f2;
    }

    .rel-empty {
        padding: 24px;
        text-align: center;
        color: #9199a3;
        font-size: 12.5px;
    }
</style>
<script th:fragment="script">
    const USERGROUP_TREE_ID = 'usergroup_tree';

    let selectedNodeId = null;
    let UG_USER_LIST = [];
    let UG_USER_EDIT_ID = null;
    let UG_PERMISSION_LIST = [];
    let UG_PERMISSION_EDIT_ID = null;

    $( document ).ready(function() {
        init();
    });

    function init() {
        initTree();
        showEmptyState();
        getCompanyList();

        App.modalPopup.receiveParam('USER_PICKER_RESULT', function(data){
            if(!data || !data.id) return;

            $("#ugUserIdInput").val(data.id);
            $("#ugUserDisplayInput").val((data.userName || data.loginId || '') + (data.loginId ? ' (' + data.loginId + ')' : ''));
        });

        App.modalPopup.receiveParam('PERMISSION_PICKER_RESULT', function(data){
            if(!data || !data.id) return;

            $("#ugPermissionIdInput").val(data.id);
            $("#ugPermissionDisplayInput").val((data.name || data.code || '') + (data.code ? ' (' + data.code + ')' : ''));
        });
    }

    function openUserPicker() {
        App.modalPopup.open(`/${APPLICATION_ID}/console/user-picker`, {title:'사용자 검색', messageId:'USER_PICKER_REQUEST'});
    }

    function openPermissionPicker() {
        App.modalPopup.open(`/${APPLICATION_ID}/console/permission-picker`, {title:'권한 검색', messageId:'PERMISSION_PICKER_REQUEST'});
    }

    function isEmpty(v) {
        return (v === undefined || v === null || v === '');
    }

    function alertError(error) {
        const message = error && error.responseJSON && error.responseJSON.message;
        alert(message || 'error');
    }

    /* ================= 회사 ================= */

    // 사용자그룹은 회사별로 관리한다: 선택한 회사의 그룹 트리만 보여주고, 새 그룹도 그 회사에 만든다
    function selectedCompanyCode() {
        return $('#userGroupCompany').val() || '';
    }

    function getCompanyList() {
        httpClient.get(`/${APPLICATION_ID}/console/api/company`, {},
            function(response){
                const $select = $('#userGroupCompany');
                $select.empty();

                for (const company of (response || [])) {
                    $select.append($('<option></option>').val(company.companyCode).text(`${company.companyName} (${company.companyCode})`));
                }

                const hasCompany = $select.find('option').length > 0;
                $select.prop('disabled', !hasCompany);
                $('#userGroupNoCompany').toggle(!hasCompany);
                $('#userGroupCompanyLink').attr('href', `/${APPLICATION_ID}/console/company`);
                $('.btn-new-root-usergroup').prop('disabled', !hasCompany);

                getList();
            },
            function(error){
                alertError(error);
            }
        );
    }

    function onCompanyChange() {
        getList();
    }

    /* ================= Tree ================= */

    function initTree() {
        $('#'+USERGROUP_TREE_ID).jstree({
            "core" : {
                "themes" : {
                    "name" : "default",
                    "responsive": true,
                    "dots": false
                },
                "multiple": false,
                "check_callback": function (op, node, parent, pos, more) {
                    if (op === "create_node") {
                        if (parent && parent.data && parent.data.status === "C") {
                            alert("상위 사용자그룹을 저장 후에 생성 가능합니다.");
                            return false;
                        }
                    }
                    if (op === "move_node") {
                        if (parent && parent.id !== '#') {
                            const tree = $('#'+USERGROUP_TREE_ID).jstree(true);
                            let p = parent;
                            while (p && p.id !== '#') {
                                if (p.id === node.id) {
                                    return false;
                                }
                                p = tree.get_node(p.parent);
                            }
                        }
                    }
                    return true;
                },
                "data" : false
            },
            "plugins": ["dnd","contextmenu","search","wholerow"],
            "dnd": {
                "copy": false,
                "inside_pos": "last",
                "drag_selection": true,
                "touch": true
            },
            "search": {
                "show_only_matches": true,
                "show_only_matches_children": true
            },
            contextmenu: {
                items: function(node) {
                    return {
                        "Create": {
                            "label": "하위 그룹 추가",
                            "icon": "fas fa-plus",
                            "action": function() {
                                createChildUserGroup(node);
                            }
                        },
                        "Delete": {
                            "label": "삭제",
                            "icon": "fas fa-trash",
                            "action": function() {
                                markNodeDeleted(node);
                            }
                        }
                    };
                },
                select_node: true,
                show_at_node: true
            }
        })
        .on('select_node.jstree', function (e, data) {
            selectedNodeId = data.node.id;
            updateToolbarState();
            renderSelectedNode(data.node, data.instance);
        })
        .on('deselect_node.jstree deselect_all.jstree', function () {
            selectedNodeId = null;
            updateToolbarState();
        })
        .on('create_node.jstree', function (e, data) {
            const tree = $('#'+USERGROUP_TREE_ID).jstree(true);

            data.node.data.status = "C";
            tree.set_icon(data.node, "fas fa-plus");

            tree.deselect_all(true);
            tree.select_node(data.node);
            tree.edit(data.node);
        })
        .on("rename_node.jstree", function (e, data) {
            const tree = $('#'+USERGROUP_TREE_ID).jstree(true);

            if (isEmpty(data.node.data.status)) {
                data.node.data.status = "U";
                tree.set_icon(data.node, "fas fa-pen");
            }

            data.node.data.name = data.text;
            renderSelectedNode(data.node, tree);
        })
        .on('move_node.jstree', function(e, data) {
            const tree = $('#'+USERGROUP_TREE_ID).jstree(true);

            const node = data.node;
            const newParentNode = tree.get_node(data.parent);

            if (isEmpty(node.data.status)) {
                node.data.status = "U";
                tree.set_icon(node, "fas fa-pen");
            }

            node.data.parentUserGroupCode = (newParentNode.id === '#') ? '' : newParentNode.data.code;

            if (selectedNodeId === node.id) {
                renderSelectedNode(node, tree);
            }
        });

        let searchTimer = null;
        $('#userGroupSearch').on('input', function() {
            clearTimeout(searchTimer);
            const value = this.value;
            searchTimer = setTimeout(function() {
                $('#'+USERGROUP_TREE_ID).jstree(true).search(value);
            }, 200);
        });
    }

    function updateToolbarState() {
        const hasSelection = !!selectedNodeId;
        $('#btnAddChildUserGroup, #btnDeleteUserGroup').prop('disabled', !hasSelection);
    }

    function createRootUserGroup() {
        if (isEmpty(selectedCompanyCode())) {
            alert('회사를 먼저 등록/선택해주세요.');
            return;
        }

        const tree = $('#'+USERGROUP_TREE_ID).jstree(true);

        tree.create_node(null, {
            text: "새 사용자그룹",
            data: {
                companyCode: selectedCompanyCode(),
                code: "",
                name: "새 사용자그룹",
                parentUserGroupCode: ""
            }
        });
    }

    function createChildUserGroupFromToolbar() {
        if (!selectedNodeId) return;
        const tree = $('#'+USERGROUP_TREE_ID).jstree(true);
        createChildUserGroup(tree.get_node(selectedNodeId));
    }

    function createChildUserGroup(node) {
        const tree = $('#'+USERGROUP_TREE_ID).jstree(true);

        tree.create_node(node, {
            text: "새 사용자그룹",
            data: {
                companyCode: node.data.companyCode,
                code: "",
                name: "새 사용자그룹",
                parentUserGroupCode: node.data.code
            }
        });
    }

    function deleteUserGroupFromToolbar() {
        if (!selectedNodeId) return;
        const tree = $('#'+USERGROUP_TREE_ID).jstree(true);
        markNodeDeleted(tree.get_node(selectedNodeId));
    }

    function markNodeDeleted(node) {
        const tree = $('#'+USERGROUP_TREE_ID).jstree(true);

        if (node.data.status === 'C') {
            tree.delete_node(node);
            if (selectedNodeId === node.id) {
                selectedNodeId = null;
                updateToolbarState();
                showEmptyState();
            }
            return;
        }

        node.data.status = 'D';
        tree.set_icon(node, "fas fa-trash");
        renderSelectedNode(node, tree);
    }

    function cancelPendingDelete() {
        if (!selectedNodeId) return;
        const tree = $('#'+USERGROUP_TREE_ID).jstree(true);
        const node = tree.get_node(selectedNodeId);

        node.data.status = 'U';
        tree.set_icon(node, "fas fa-pen");
        renderSelectedNode(node, tree);
    }

    function toTree(r) {
        const children = [];
        if (!isEmpty(r.children)) {
            for (let i = 0; i < r.children.length; i++) {
                children.push(toTree(r.children[i]));
            }
        }

        return {
            "status": "",
            "text": r.name,
            "children": children,
            "icon": r.isLeafNode ? "far fa-circle" : "fa fa-folder",
            "data": r
        };
    }

    function renderTree(response) {
        const nodeData = [];
        if (!isEmpty(response)) {
            for (let i = 0; i < response.length; i++) {
                nodeData.push(toTree(response[i]));
            }
        }

        const tree = $('#'+USERGROUP_TREE_ID).jstree(true);
        tree.settings.core.data = nodeData;
        tree.refresh();

        $('#userGroupTreeEmpty').toggle(nodeData.length === 0 && !isEmpty(selectedCompanyCode()));

        selectedNodeId = null;
        updateToolbarState();
        showEmptyState();
    }

    function getList() {
        // 회사가 없으면 조회하지 않는다 (companyCode 없이 부르면 모든 회사의 그룹이 온다)
        if (isEmpty(selectedCompanyCode())) {
            renderTree([]);
            return;
        }

        httpClient.get(`/${APPLICATION_ID}/console/api/user-group/tree`, {companyCode: selectedCompanyCode()},
            function(response){
                renderTree(response);
            },
            function(error){
                alert('조회하는데 실패하였습니다.');
            }
        );
    }

    /* ================= Detail panel ================= */

    function showEmptyState() {
        $('#userGroupDetailEmpty').show();
        $('#userGroupDetailForm').hide();
        $('#userGroupBreadcrumb').text('사용자그룹을 선택하세요');
        $('#btnSaveUserGroup, #btnDeleteSelectedUserGroup').prop('disabled', true);
    }

    function toggleRelationTabs(hasId) {
        $('#userRelLockedMsg, #permissionRelLockedMsg').toggle(!hasId);
        $('#userRelBody, #permissionRelBody').toggle(hasId);
    }

    function renderSelectedNode(node, tree) {
        let parentUserGroupNm = '최상위 그룹';
        if (node.parent && node.parent !== '#') {
            const parentNode = tree.get_node(node.parent);
            if (parentNode) {
                parentUserGroupNm = parentNode.text;
            }
        }

        setContent(Object.assign({}, node.data, {parentUserGroupNm: parentUserGroupNm}));

        $('#userGroupBreadcrumb').html('<b>' + tree.get_path(node, ' / ') + '</b>');
        $('#userGroupDetailEmpty').hide();
        $('#userGroupDetailForm').show();
        $('#btnSaveUserGroup').prop('disabled', false);
        $('#btnDeleteSelectedUserGroup').prop('disabled', false);

        const hasId = !isEmpty(node.data.id);
        toggleRelationTabs(hasId);

        if (hasId) {
            getUserGroupUser(node.data.id);
            getUserGroupPermission(node.data.id);
        }
        else {
            UG_USER_LIST = [];
            UG_PERMISSION_LIST = [];
            renderUserGroupUserList();
            renderUserGroupPermissionList();
        }
    }

    function onUserGroupFieldChange(field, value) {
        $('#'+field).val(value);

        if (isEmpty($('#status').val())) {
            $('#status').val('U');
        }

        syncFieldToNode();
    }

    function syncFieldToNode() {
        if (!selectedNodeId) return;
        const tree = $('#'+USERGROUP_TREE_ID).jstree(true);
        const node = tree.get_node(selectedNodeId);
        if (!node) return;

        node.data.name = $('#name').val();
        node.data.code = $('#code').val();
        node.data.status = $('#status').val();

        // rename_node()는 rename_node.jstree 이벤트를 발생시켜 상세폼을 다시 그리게 되고,
        // 그러면 지금 타이핑 중인 #name의 값을 다시 세팅하면서 커서 위치가 끝으로
        // 튀는 문제가 생긴다. set_text()는 이벤트 없이 트리 라벨만 조용히 갱신한다.
        if ($('#name').val() !== node.text) {
            tree.set_text(node, $('#name').val() || '(이름없음)');
        }

        if (node.data.status === 'U') {
            tree.set_icon(node, 'fas fa-pen');
        }
    }

    function save() {
        const status = $('#status').val();
        const id = $('#id').val();

        if (status === 'C') {
            insertContent();
        }
        else if (status === 'U') {
            updateContent(id);
        }
        else if (status === 'D') {
            deleteContent();
        }
        else {
            alert('변경된 내용이 없습니다.');
        }
    }

    function insertContent() {
        httpClient.post(`/${APPLICATION_ID}/console/api/user-group`, {}, getContent(),
            function(response){
                alert('저장완료되었습니다.');
                getList();
            },
            function(error){
                alertError(error);
            }
        );
    }

    function updateContent(id) {
        httpClient.put(`/${APPLICATION_ID}/console/api/user-group/${id}`, {}, getContent(),
            function(response){
                alert('저장완료되었습니다.');
                getList();
            },
            function(error){
                alertError(error);
            }
        );
    }

    function deleteContent() {
        const id = $('#id').val();

        httpClient.delete(`/${APPLICATION_ID}/console/api/user-group/${id}`, {},
            function(response){
                alert('삭제 처리 완료되었습니다.');
                getList();
            },
            function(error){
                alert('error');
            }
        );
    }

    function getContent() {
        return {
            status: $('#status').val(),
            id: $('#id').val(),
            companyCode: $('#companyCode').val() || selectedCompanyCode(),
            code: $('#code').val(),
            name: $('#name').val(),
            parentUserGroupCode: $('#parentUserGroupCode').val()
        };
    }

    function setContent(params) {
        $('#status').val(params.status);
        $('#id').val(params.id);
        $('#companyCode').val(params.companyCode);
        $('#code').val(params.code);
        $('#name').val(params.name);
        $('#parentUserGroupCode').val(params.parentUserGroupCode);
        $('#parentUserGroupNmDisplay').val(params.parentUserGroupNm || '최상위 그룹');

        $('#userGroupPendingDeleteBanner').toggle(params.status === 'D');
    }

    /* ================= 사용자 ================= */

    function getUserGroupUser(userGroupId) {
        httpClient.get(`/${APPLICATION_ID}/console/api/user-group/user/${userGroupId}`, {},
            function(response){
                for(let i=0; i<response.length; i++) {
                    response[i].userId = response[i].user.id;
                    response[i].userName = response[i].user.userName;
                    response[i].userLoginId = response[i].user.loginId;
                }

                UG_USER_LIST = response;
                renderUserGroupUserList();
            },
            function(error){
                alert('error');
            }
        );
    }

    function renderUserGroupUserList() {
        const $body = $("#ugUserList");
        $body.empty();

        if(UG_USER_LIST.length === 0) {
            $body.append('<div class="rel-empty">등록된 사용자가 없습니다.</div>');
            return;
        }

        for(const item of UG_USER_LIST) {
            const $row = $(`
                <div class="rel-row" data-id="${item.id}">
                    <div class="rel-row-main">
                        <div class="rel-row-field"><span class="rel-field-label">사용자명</span><span class="rel-field-value ug-user-name"></span></div>
                        <div class="rel-row-field"><span class="rel-field-label">로그인ID</span><span class="rel-field-value ug-user-login-id"></span></div>
                    </div>
                    <div class="rel-row-actions">
                        <button type="button" class="rel-icon-btn" title="수정"><i class="fas fa-pen"></i></button>
                        <button type="button" class="rel-icon-btn danger" title="삭제"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            `);

            $row.find('.ug-user-name').text(item.userName || item.userLoginId || '');
            $row.find('.ug-user-login-id').text(item.userLoginId || '');

            $row.find('.rel-icon-btn:not(.danger)').on('click', function() {
                editUserGroupUser(item.id);
            });
            $row.find('.rel-icon-btn.danger').on('click', function() {
                if(confirm('삭제하시겠습니까?')) {
                    deleteUserGroupUser($("#id").val(), item);
                }
            });

            $body.append($row);
        }
    }

    function editUserGroupUser(id) {
        const item = UG_USER_LIST.find(a => String(a.id) === String(id));
        if(!item) return;

        UG_USER_EDIT_ID = id;
        $("#ugUserIdInput").val(item.userId);
        $("#ugUserDisplayInput").val((item.userName || item.userLoginId || '') + (item.userLoginId ? ' (' + item.userLoginId + ')' : ''));
        $("#ugUserSubmitBtn").html('<i class="fas fa-check"></i>수정');
        $("#ugUserCancelBtn").removeClass('d-none');
    }

    function cancelUserGroupUserEdit() {
        UG_USER_EDIT_ID = null;
        $("#ugUserIdInput").val('');
        $("#ugUserDisplayInput").val('');
        $("#ugUserSubmitBtn").html('<i class="fas fa-plus"></i>추가');
        $("#ugUserCancelBtn").addClass('d-none');
    }

    function submitUserGroupUser() {
        const userGroupId = $("#id").val();
        if(!userGroupId) {
            alert('먼저 사용자그룹을 저장해주세요.');
            return;
        }

        const userId = $("#ugUserIdInput").val();
        if(!userId) {
            alert('사용자를 검색하여 선택해주세요.');
            return;
        }

        if(UG_USER_EDIT_ID) {
            updateUserGroupUser(userGroupId, UG_USER_EDIT_ID, {userId});
        }
        else {
            insertUserGroupUser(userGroupId, {userId});
        }

        cancelUserGroupUserEdit();
    }

    function insertUserGroupUser(userGroupId, item) {
        httpClient.post(`/${APPLICATION_ID}/console/api/user-group/user`,{},
            {
               userGroupId:userGroupId,
               userId:item.userId
            },
            function(response){
                getUserGroupUser(userGroupId);
            },
            function(error){
                alert('error');
            }
        );
    }

    function updateUserGroupUser(userGroupId, userGroupUserId, item) {
      httpClient.put(`/${APPLICATION_ID}/console/api/user-group/user/${userGroupUserId}`, {},
          {
               userGroupId:userGroupId,
               userId:item.userId
          },
          function(response){
              getUserGroupUser(userGroupId);
          },
          function(error){
              alert('error');
          }
      );
    }

    function deleteUserGroupUser(userGroupId, item) {
      httpClient.delete(`/${APPLICATION_ID}/console/api/user-group/user/${item.id}`, {},
          function(response){
              getUserGroupUser(userGroupId);
          },
          function(error){
              alert('error');
          }
      );
    }

    /* ================= 권한 부여 ================= */

    function getUserGroupPermission(userGroupId) {
        httpClient.get(`/${APPLICATION_ID}/console/api/user-group/permission/${userGroupId}`, {},
            function(response){
                for(let i=0; i<response.length; i++) {
                    response[i].permissionId = response[i].permission.id;
                    response[i].permissionCode = response[i].permission.code;
                    response[i].permissionName = response[i].permission.name;
                }

                UG_PERMISSION_LIST = response;
                renderUserGroupPermissionList();
            },
            function(error){
                alert('error');
            }
        );
    }

    function renderUserGroupPermissionList() {
        const $body = $("#ugPermissionList");
        $body.empty();

        if(UG_PERMISSION_LIST.length === 0) {
            $body.append('<div class="rel-empty">등록된 권한이 없습니다.</div>');
            return;
        }

        for(const item of UG_PERMISSION_LIST) {
            const $row = $(`
                <div class="rel-row" data-id="${item.id}">
                    <div class="rel-row-main">
                        <div class="rel-row-field"><span class="rel-field-label">권한명</span><span class="rel-field-value ug-permission-name"></span></div>
                        <div class="rel-row-field"><span class="rel-field-label">권한코드</span><span class="rel-field-value ug-permission-code"></span></div>
                        <div class="rel-row-field"><span class="rel-field-label">하위 전파</span><span class="rel-field-value ug-permission-lower-grant"></span></div>
                    </div>
                    <div class="rel-row-actions">
                        <button type="button" class="rel-icon-btn" title="수정"><i class="fas fa-pen"></i></button>
                        <button type="button" class="rel-icon-btn danger" title="삭제"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            `);

            $row.find('.ug-permission-name').text(item.permissionName || item.permissionCode || '');
            $row.find('.ug-permission-code').text(item.permissionCode || '');
            $row.find('.ug-permission-lower-grant').text(item.lowerPermissionGrant ? '적용' : '-');

            $row.find('.rel-icon-btn:not(.danger)').on('click', function() {
                editUserGroupPermission(item.id);
            });
            $row.find('.rel-icon-btn.danger').on('click', function() {
                if(confirm('삭제하시겠습니까?')) {
                    deleteUserGroupPermission($("#id").val(), item);
                }
            });

            $body.append($row);
        }
    }

    function editUserGroupPermission(id) {
        const item = UG_PERMISSION_LIST.find(a => String(a.id) === String(id));
        if(!item) return;

        UG_PERMISSION_EDIT_ID = id;
        $("#ugPermissionIdInput").val(item.permissionId);
        $("#ugPermissionDisplayInput").val((item.permissionName || item.permissionCode || '') + (item.permissionCode ? ' (' + item.permissionCode + ')' : ''));
        $("#ugPermissionLowerGrantInput").prop('checked', !!item.lowerPermissionGrant);
        $("#ugPermissionSubmitBtn").html('<i class="fas fa-check"></i>수정');
        $("#ugPermissionCancelBtn").removeClass('d-none');
    }

    function cancelUserGroupPermissionEdit() {
        UG_PERMISSION_EDIT_ID = null;
        $("#ugPermissionIdInput").val('');
        $("#ugPermissionDisplayInput").val('');
        $("#ugPermissionLowerGrantInput").prop('checked', false);
        $("#ugPermissionSubmitBtn").html('<i class="fas fa-plus"></i>추가');
        $("#ugPermissionCancelBtn").addClass('d-none');
    }

    function submitUserGroupPermission() {
        const userGroupId = $("#id").val();
        if(!userGroupId) {
            alert('먼저 사용자그룹을 저장해주세요.');
            return;
        }

        const permissionId = $("#ugPermissionIdInput").val();
        if(!permissionId) {
            alert('권한을 검색하여 선택해주세요.');
            return;
        }

        const lowerPermissionGrant = $("#ugPermissionLowerGrantInput").is(':checked');

        if(UG_PERMISSION_EDIT_ID) {
            updateUserGroupPermission(userGroupId, UG_PERMISSION_EDIT_ID, {permissionId, lowerPermissionGrant});
        }
        else {
            insertUserGroupPermission(userGroupId, {permissionId, lowerPermissionGrant});
        }

        cancelUserGroupPermissionEdit();
    }

    function insertUserGroupPermission(userGroupId, item) {
        httpClient.post(`/${APPLICATION_ID}/console/api/user-group/permission`,{},
            {
               userGroupId:userGroupId,
               permissionId:item.permissionId,
               lowerPermissionGrant:item.lowerPermissionGrant
            },
            function(response){
                getUserGroupPermission(userGroupId);
            },
            function(error){
                alert('error');
            }
        );
    }

    function updateUserGroupPermission(userGroupId, userGroupPermissionId, item) {
      httpClient.put(`/${APPLICATION_ID}/console/api/user-group/permission/${userGroupPermissionId}`, {},
          {
               userGroupId:userGroupId,
               permissionId:item.permissionId,
               lowerPermissionGrant:item.lowerPermissionGrant
          },
          function(response){
              getUserGroupPermission(userGroupId);
          },
          function(error){
              alert('error');
          }
      );
    }

    function deleteUserGroupPermission(userGroupId, item) {
      httpClient.delete(`/${APPLICATION_ID}/console/api/user-group/permission/${item.id}`, {},
          function(response){
              getUserGroupPermission(userGroupId);
          },
          function(error){
              alert('error');
          }
      );
    }
</script>

                    <div class="tab-content" id="tabContent">
                        <div class="tab-pane fade show active" id="detail" role="tabpanel" aria-labelledby="detail-tab">
                            <div style="padding: 22px 24px;">
                                <div class="usergroup-field">
                                    <label>그룹명</label>

                        <div class="tab-pane fade" id="user" role="tabpanel" aria-labelledby="user-tab">
                            <div class="usergroup-tab-toolbar">
                                <h4>사용자</h4>
                            </div>
                            <div class="rel-locked-msg" id="userRelLockedMsg" style="display:none;">사용자그룹을 먼저 저장해주세요.</div>
                            <div class="rel-body" id="userRelBody">
                                <div class="rel-add-form">
                                    <div class="form-group">
                                        <label for="ugUserDisplayInput">사용자</label>
                                        <div style="display:flex;gap:6px;">
                                            <input type="text" class="form-control" id="ugUserDisplayInput" style="width:220px;" placeholder="검색하여 선택" readonly onclick="openUserPicker()">
                                            <button type="button" class="rel-icon-btn" title="사용자 검색" onclick="openUserPicker()"><i class="fas fa-search"></i></button>
                                        </div>
                                        <input type="hidden" id="ugUserIdInput">
