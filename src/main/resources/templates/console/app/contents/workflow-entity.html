<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #wfentity-app {
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 14px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #wfentity-app .wf-card {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #wfentity-app .wf-tabs {
        display: flex;
        gap: 2px;
        padding: 8px 16px 0;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        flex: 0 0 auto;
        margin: 0;
        list-style: none;
    }

    #wfentity-app .wf-tabs.wf-tabs-sub {
        padding: 8px 0 0;
        background: transparent;
    }

    #wfentity-app .wf-tabs .nav-link {
        border: none;
        border-radius: 7px 7px 0 0;
        padding: 8px 16px;
        font-size: 12.5px;
        font-weight: 600;
        color: #6b7280;
        background: transparent;
        cursor: pointer;
    }

    #wfentity-app .wf-tabs .nav-link.active {
        background: #fff;
        color: #1d4ed8;
        box-shadow: inset 0 -2px 0 #4A90E2;
    }

    #wfentity-app .wf-tabs-sub .nav-link.active {
        background: #fbfbfc;
    }

    #wfentity-app .wf-tab-content {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
    }

    #wfentity-app .wf-tab-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #eef0f2;
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 1;
    }

    #wfentity-app .wf-tab-toolbar h4 {
        margin: 0;
        font-size: 12.5px;
        font-weight: 700;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #wfentity-app .wf-panel-tools {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #wfentity-app .wf-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #wfentity-app .wf-btn:hover {
        background: #f1f3f5;
    }

    #wfentity-app .wf-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #wfentity-app .wf-btn-primary:hover {
        background: #3d7fce;
    }

    #wfentity-app .wf-btn-success {
        background: #16a34a;
        border-color: #16a34a;
        color: #fff;
    }

    #wfentity-app .wf-btn-success:hover {
        background: #15803d;
    }

    #wfentity-app .wf-detail-body {
        padding: 16px;
    }

    #wfentity-app .wf-section {
        border: 1px solid #eef0f2;
        border-radius: 10px;
        margin-bottom: 14px;
        overflow: hidden;
    }

    #wfentity-app .wf-section:last-child {
        margin-bottom: 0;
    }

    #wfentity-app .wf-section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        font-weight: 700;
        font-size: 12px;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #wfentity-app .wf-section-header i {
        color: #4A90E2;
    }

    #wfentity-app .wf-section-body {
        padding: 14px;
    }

    #wfentity-app .wf-section-grid {
        display: flex;
        flex-wrap: wrap;
        padding: 14px 8px 0;
    }

    #wfentity-app .wf-section-grid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #wfentity-app .wf-section-grid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #wfentity-app .wf-section-grid .form-control {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
        background: #fff;
        color: #1f2937;
    }

    #wfentity-app .wf-section-grid .form-control:disabled {
        background: #f8f9fa;
        color: #6b7280;
    }

    #wfentity-app .wf-section-grid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    /* ---- 인라인 편집 테이블 (jsGrid 대체) ---- */
    #wfentity-app .wf-table-toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-bottom: 8px;
    }

    #wfentity-app .wf-table-wrap {
        overflow-x: auto;
        border: 1px solid #eef0f2;
        border-radius: 8px;
    }

    #wfentity-app .wf-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
    }

    #wfentity-app .wf-table thead th {
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        text-align: left;
        padding: 8px 10px;
        font-size: 11px;
        font-weight: 700;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: .03em;
        white-space: nowrap;
    }

    #wfentity-app .wf-table tbody td {
        border-bottom: 1px solid #f1f3f5;
        padding: 6px 8px;
        vertical-align: middle;
    }

    #wfentity-app .wf-table tbody tr:last-child td {
        border-bottom: none;
    }

    #wfentity-app .wf-table tbody tr:hover {
        background: #fafbfc;
    }

    #wfentity-app .wf-cell-input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 6px;
        font-size: 12.5px;
        padding: 5px 8px;
        background: #fff;
    }

    #wfentity-app .wf-cell-input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #wfentity-app .wf-cell-checkbox {
        width: 16px;
        height: 16px;
    }

    #wfentity-app .wf-table-action-col {
        width: 34px;
        text-align: center;
    }

    #wfentity-app .wf-row-del-btn {
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #dc2626;
    }

    #wfentity-app .wf-row-del-btn:hover {
        background: #fef2f2;
    }

    #wfentity-app .wf-table-empty {
        text-align: center;
        color: #9199a3;
        padding: 20px;
    }

    /* ---- 실행 결과 콘솔 ---- */
    #wfentity-app .wf-console {
        width: 100%;
        box-sizing: border-box;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 12.5px;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px;
        resize: vertical;
    }
</style>
<script th:fragment="script">
    App.codes = {
        "YN_CD":[
            {code:"true",name:"Y"},
            {code:"false",name:"N"}
        ],
        "COLUMN_TYPE":[
            {code:"STRING",name:"String"},
            {code:"NUMBER",name:"Number"},
            {code:"DATE",name:"Date"},
            {code:"DATETIME",name:"Datetime"}
        ],
        "SELECT_WHERE_TYPE":[
            {code:"COMPARE_REQUIRED",name:"필수"},
            {code:"COMPARE_NOT_REQUIRED",name:"필수아님"}
        ],
        "SELECT_WHERE_COMPARE_OPERATOR":[
            {code:"=",name:"="},
            {code:"!=",name:"!="},
            {code:">",name:">"},
            {code:">=",name:">="},
            {code:"<",name:"<"},
            {code:"<=",name:"<="},
            {code:"like",name:"like"}
        ],
        "SORT_ORDER":[
            {code:"ASC",name:"오름차순"},
            {code:"DESC",name:"내림차순"}
        ],
        "NULL_RESOLVE_TYPE":[
            {code:"EXCEPTION",name:"예외처리"},
            {code:"SET_NULL",name:"null 셋팅"},
            {code:"EXCLUDE_QUERY",name:"제외"}
        ],
        "ENTITY_AUTO_VALUE_TYPE":[
            {code:"STATIC_VALUE",name:"static 값"},
            {code:"QUERY",name:"쿼리"},
            {code:"RESERVED_WORD",name:"예약어"}
        ]
    };

    class EditableTable {
        constructor(containerId, columns) {
            this.containerId = containerId;
            this.columns = columns;
            this.data = [];
            this.render();
        }

        setData(data) {
            this.data = (data || []).map(d => Object.assign({}, d));
            this.render();
        }

        getData() {
            return this.data;
        }

        addRow(defaults) {
            this.data.push(Object.assign({}, defaults));
            this.render();
        }

        removeRow(index) {
            this.data.splice(index, 1);
            this.render();
        }

        render() {
            const $container = $('#' + this.containerId);
            $container.empty();

            const $table = $('<table class="wf-table"></table>');
            const $theadRow = $('<tr></tr>');
            for (const col of this.columns) {
                $theadRow.append($('<th></th>').text(col.label));
            }
            $theadRow.append('<th class="wf-table-action-col"></th>');
            $table.append($('<thead></thead>').append($theadRow));

            const $tbody = $('<tbody></tbody>');
            if (this.data.length === 0) {
                $tbody.append(`<tr><td colspan="${this.columns.length + 1}" class="wf-table-empty">데이터가 없습니다.</td></tr>`);
            }

            this.data.forEach((row, idx) => {
                const $tr = $('<tr></tr>');
                for (const col of this.columns) {
                    const $td = $('<td></td>');
                    if (col.editable === false) {
                        $td.text(row[col.field] != null ? row[col.field] : '');
                    }
                    else if (col.type === 'select') {
                        const $select = $('<select class="wf-cell-input"></select>');
                        for (const opt of col.options) {
                            $select.append($('<option></option>').attr('value', opt.code).text(opt.name));
                        }
                        $select.val(row[col.field]);
                        $select.on('change', (e) => { row[col.field] = $(e.target).val(); });
                        $td.append($select);
                    }
                    else if (col.type === 'check') {
                        const $chk = $('<input type="checkbox" class="wf-cell-checkbox">');
                        $chk.prop('checked', !!row[col.field]);
                        $chk.on('change', (e) => { row[col.field] = e.target.checked; });
                        $td.append($chk);
                    }
                    else {
                        const $input = $(`<input type="${col.type === 'number' ? 'number' : 'text'}" class="wf-cell-input">`);
                        $input.val(row[col.field] != null ? row[col.field] : '');
                        $input.on('input', (e) => { row[col.field] = $(e.target).val(); });
                        $td.append($input);
                    }
                    $tr.append($td);
                }

                const $actionTd = $('<td class="wf-table-action-col"></td>');
                const $delBtn = $('<button type="button" class="wf-row-del-btn" title="삭제"><i class="fas fa-times"></i></button>');
                $delBtn.on('click', () => this.removeRow(idx));
                $actionTd.append($delBtn);
                $tr.append($actionTd);

                $tbody.append($tr);
            });

            $table.append($tbody);
            $container.append($table);
        }
    }

    let functionName;
    let entityColumnGrid;
    let selectQueryGrid;
    let insertQueryGrid;
    let updateQueryGrid;
    let deleteQueryGrid;
    let executeGrid;

    $( document ).ready(function() {
        init();
    });

    function init() {
        setDatSourceAsDatabase();

        entityColumnGrid = new EditableTable('entityColumnGrid', [
            {field:'columnName', label:'컬럼', type:'text'},
            {field:'displayName', label:'화면노출명', type:'text'},
            {field:'useKey', label:'Key', type:'check'},
            {field:'columnType', label:'타입', type:'select', options:App.codes['COLUMN_TYPE']},
            {field:'orderNum', label:'순서', type:'number'}
        ]);

        selectQueryGrid = new EditableTable('selectQueryGrid', [
            {field:'columnName', label:'컬럼', editable:false},
            {field:'selectWhereType', label:'where 유형', type:'select', options:App.codes['SELECT_WHERE_TYPE']},
            {field:'selectWhereCompareOperator', label:'where 비교연산자', type:'select', options:App.codes['SELECT_WHERE_COMPARE_OPERATOR']},
            {field:'selectOrderByNum', label:'order by 순서', type:'number'},
            {field:'selectOrderBySortOrder', label:'order by 정렬유형', type:'select', options:App.codes['SORT_ORDER']}
        ]);

        insertQueryGrid = new EditableTable('insertQueryGrid', [
            {field:'columnName', label:'컬럼', editable:false},
            {field:'insertNullResolveType', label:'null 처리유형', type:'select', options:App.codes['NULL_RESOLVE_TYPE']},
            {field:'insertAutoValueType', label:'자동값 유형', type:'select', options:App.codes['ENTITY_AUTO_VALUE_TYPE']},
            {field:'insertAutoValue', label:'자동값', type:'text'}
        ]);

        updateQueryGrid = new EditableTable('updateQueryGrid', [
            {field:'columnName', label:'컬럼', editable:false},
            {field:'updateNullResolveType', label:'null 처리유형', type:'select', options:App.codes['NULL_RESOLVE_TYPE']},
            {field:'updateAutoValueType', label:'자동값 유형', type:'select', options:App.codes['ENTITY_AUTO_VALUE_TYPE']},
            {field:'updateAutoValue', label:'자동값', type:'text'}
        ]);

        deleteQueryGrid = new EditableTable('deleteQueryGrid', [
            {field:'columnName', label:'컬럼', editable:false},
            {field:'deleteAutoValueType', label:'자동값 유형', type:'select', options:App.codes['ENTITY_AUTO_VALUE_TYPE']},
            {field:'deleteAutoValue', label:'자동값', type:'text'}
        ]);

        executeGrid = new EditableTable('executeGrid', [
            {field:'key', label:'파라미터', type:'text'},
            {field:'value', label:'값', type:'text'}
        ]);

        App.modalPopup.receiveParam('FUNC_REQUEST', function(data){
            if(!data.functionName) {
                alert('기능코드가 존재하지않습니다.');
            }

            functionName = data.functionName;
            getEntity(functionName)
        });
    }

    function newRowEntityColumnGrid() {
        const existingData = entityColumnGrid.getData();
        const maxOrderNum = existingData.reduce((max, row) => Math.max(max, Number(row.orderNum) || 0), 0);

        entityColumnGrid.addRow({
            columnName:"(컬럼)",
            displayName:"(화면노출명)",
            columnType:"STRING",
            orderNum:maxOrderNum + 1
        });
    }

    function autoAddColumns() {
        const dataSourceName = $("#entity-dataSourceName").val();
        const tableName = $("#entity-tableName").val();

        if (!dataSourceName) {
            alert('데이터소스를 선택해주세요.');
            return;
        }
        if (!tableName) {
            alert('테이블명을 입력해주세요.');
            return;
        }

        httpClient.get(`/${APPLICATION_ID}/console/api/datasource/database/${encodeURIComponent(dataSourceName)}/table/${encodeURIComponent(tableName)}/columns`, {},
            function(response){
                if (!response || response.length === 0) {
                    alert('테이블의 컬럼 정보를 찾을 수 없습니다.');
                    return;
                }

                const existingData = entityColumnGrid.getData();
                const existingNames = existingData.map(row => row.columnName);
                let maxOrderNum = existingData.reduce((max, row) => Math.max(max, Number(row.orderNum) || 0), 0);

                let addedCount = 0;
                for (const col of response) {
                    if (existingNames.includes(col.columnName)) {
                        continue;
                    }

                    maxOrderNum++;
                    existingData.push({
                        columnName: col.columnName,
                        displayName: col.comment || col.columnName,
                        useKey: !!col.primaryKey,
                        columnType: col.columnType,
                        orderNum: maxOrderNum
                    });
                    addedCount++;
                }

                entityColumnGrid.setData(existingData);

                if (addedCount === 0) {
                    alert('추가할 새로운 컬럼이 없습니다.');
                }
            },
            function(error){
                alert('error');
            }
        );
    }

    function setDatSourceAsDatabase() {
        httpClient.get(`/${APPLICATION_ID}/console/api/datasource/database`, {},
            function(response){
                let codes = new Array();
                for(let i=0; i<response.length; i++) {
                    codes.push({code:response[i].dataSourceName,name:response[i].displayName});
                }

                App.util.setCodeBox("entity-dataSourceName", codes, {useFirstItem:true, firstItemLabel:'선택', firstItemValue:''});
            },
            function(error){
                alert('error');
            }
        );
    }

    function execute() {
        alert('아직 지원하지않습니다.');
        return;
    }

    function copyResult() {
        const text = $("#responseData").val();
        if (!text) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
        } else {
            const $textarea = $("#responseData");
            $textarea.trigger('select');
            document.execCommand('copy');
        }
    }

    function getEntity(entityName) {
        httpClient.get(`/${APPLICATION_ID}/console/api/entity`, {entityName:entityName},
            function(response){
                if(response[0]) {
                    setEntityContent(response[0]);
                }
                else {
                    newEntityContent(entityName);
                }
            },
            function(error){
                alert('error');
            }
        );
    }

    function getEntityContent() {
        return {
            id: $("#entity-id").val(),
            entityName: $("#entity-entityName").val(),
            displayName: $("#entity-displayName").val(),
            dataSourceName: $("#entity-dataSourceName").val(),
            tableName: $("#entity-tableName").val()
        }
    }

    function getEntityColumns() {
        const columns = entityColumnGrid.getData();
        const selectQueryMap = getQuerySheetData(selectQueryGrid.getData());
        const insertQueryMap = getQuerySheetData(insertQueryGrid.getData());
        const updateQueryMap = getQuerySheetData(updateQueryGrid.getData());
        const deleteQueryMap = getQuerySheetData(deleteQueryGrid.getData());

        for(const col of columns) {
            const selectObj = selectQueryMap[col.columnName];
            if(selectObj) {
                for(let queryCol in selectObj) {
                    col[queryCol] = selectObj[queryCol];
                }
            }
            const insertObj = insertQueryMap[col.columnName];
            if(insertObj) {
                for(let queryCol in insertObj) {
                    col[queryCol] = insertObj[queryCol];
                }
            }
            const updateObj = updateQueryMap[col.columnName];
            if(updateObj) {
                for(let queryCol in updateObj) {
                    col[queryCol] = updateObj[queryCol];
                }
            }
            const deleteObj = deleteQueryMap[col.columnName];
            if(deleteObj) {
                for(let queryCol in deleteObj) {
                    col[queryCol] = deleteObj[queryCol];
                }
            }
        }

        return columns;
    }

    function getQuerySheetData(data) {
        return data.reduce((result, item) => {
            result[item.columnName] = item;
            return result;
        }, {});

    }

    function setEntityContent(params) {
        $("#entity-id").val(params.id);
        $("#entity-entityName").val(params.entityName);
        $("#entity-displayName").val(params.displayName);
        $("#entity-dataSourceName").val(params.dataSourceName);
        $("#entity-tableName").val(params.tableName);
        entityColumnGrid.setData(params.entityColumns);
        selectQueryGrid.setData(params.entityColumns);
        insertQueryGrid.setData(params.entityColumns);
        updateQueryGrid.setData(params.entityColumns);
        deleteQueryGrid.setData(params.entityColumns);
      }

      function newEntityContent(entityName){
        setEntityContent({
            id:'',
            entityName:entityName,
            displayName:'',
            dataSourceName:'',
            tableName:'',
            entityColumns:[]
            });
      }

    function save() {
        httpClient.post(`/${APPLICATION_ID}/console/api/entity/save`,
            {},
            {
                'entity':getEntityContent(),
                'entityColumns':getEntityColumns()
            },
            function(response){
                alert("저장완료되었습니다.");
                getEntity($("#entity-entityName").val());
            },
            function(error){
                alert('error');
            }
        );
    }
</script>
<div id="wfentity-app" th:fragment="view">
    <div class="wf-card">
        <ul class="nav wf-tabs" id="detail-tab" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="workflow-def-tab" data-toggle="pill" href="#workflow-def" role="tab" aria-controls="workflow-def" aria-selected="true">정의</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="execute-tab" data-toggle="pill" href="#execute" role="tab" aria-controls="execute" aria-selected="false">실행</a>
            </li>
        </ul>
        <div class="tab-content wf-tab-content" id="detail-tabContent">

            <div class="tab-pane fade show active" id="workflow-def" role="tabpanel" aria-labelledby="workflow-def-tab">
                <div class="wf-tab-toolbar">
                    <h4>Entity 정의</h4>
                    <div class="wf-panel-tools">
                        <button type="button" class="wf-btn wf-btn-primary" onclick="save()"><i class="fas fa-save"></i>저장</button>
                    </div>
                </div>
                <div class="wf-detail-body">
                    <input type="hidden" id="entity-id">

                    <div class="wf-section">
                        <div class="wf-section-header"><i class="fas fa-info-circle"></i><span>기본 정보</span></div>
                        <div class="wf-section-grid">
                            <div class="form-group col-3">
                                <label for="entity-entityName">엔티티명</label>
                                <input type="text" class="form-control" id="entity-entityName" autocomplete="off" disabled>
                            </div>
                            <div class="form-group col-3">
                                <label for="entity-displayName">화면노출명</label>
                                <input type="text" class="form-control" id="entity-displayName" autocomplete="off">
                            </div>
                            <div class="form-group col-3">
                                <label for="entity-dataSourceName">데이터소스</label>
                                <select class="form-control" id="entity-dataSourceName"></select>
