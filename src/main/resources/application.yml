spring:
  application:
    name: admin-builder

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  thymeleaf:
    prefix: file:src/main/resources/templates/
    suffix: .html
    cache: false

  # multipart/form-data 파일 업로드 한도 (기본값은 파일 1MB / 요청 10MB)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    resources:
      static-locations: file:src/main/resources/static/
      cache:
        period: 0
      chain:
        cache: false

  datasource:
    driver-class-name: org.h2.Driver
    url: 'jdbc:h2:C:\admin-builder\data\admin-builder'
    username: sys_admin
    password: sysadmin1!

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # DB 초기화 전략 (none, create, create-drop, update, validate)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true

  quartz:
    job-store-type: memory
    # 여러 인스턴스로 배포(클러스터링)할 때는 아래처럼 전환한다:
    # job-store-type: jdbc
    # jdbc:
    #   initialize-schema: always
    # (jobStore.isClustered는 JDBC 기반 JobStore(JobStoreTX)에만 존재하는 속성이라
    #  jdbc 모드로 전환할 때만 아래 한 줄을 함께 추가해야 한다. RAMJobStore(memory 모드)에는
    #  해당 setter 자체가 없어 설정 시 기동 오류가 난다.)
    # org.quartz.jobStore.isClustered: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: AdminBuilderScheduler
            instanceId: AUTO
          threadPool:
            threadCount: 5

server:
  port: 8080

