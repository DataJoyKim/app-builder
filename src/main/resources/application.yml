spring:
  application:
    name: admin-builder

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  thymeleaf:
    prefix: file:src/main/resources/templates/
    suffix: .html
    cache: false

  # multipart/form-data 파일 업로드 한도 (기본값은 파일 1MB / 요청 10MB)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    resources:
      static-locations: file:src/main/resources/static/
      cache:
        period: 0
      chain:
        cache: false

  datasource:
    driver-class-name: org.h2.Driver
    url: 'jdbc:h2:C:\admin-builder\data\admin-builder'
    username: sys_admin
    password: sysadmin1!

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # DB 초기화 전략 (none, create, create-drop, update, validate)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true

  quartz:
    job-store-type: memory
    # 여러 인스턴스로 배포(클러스터링)할 때는 아래처럼 전환한다:
    # job-store-type: jdbc
    # jdbc:
    #   initialize-schema: always
    # (jobStore.isClustered는 JDBC 기반 JobStore(JobStoreTX)에만 존재하는 속성이라
    #  jdbc 모드로 전환할 때만 아래 한 줄을 함께 추가해야 한다. RAMJobStore(memory 모드)에는
    #  해당 setter 자체가 없어 설정 시 기동 오류가 난다.)
    # org.quartz.jobStore.isClustered: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: AdminBuilderScheduler
            instanceId: AUTO
          threadPool:
            threadCount: 5

  # 플랫폼 공통 메일 서버 (가입 인증코드, 관리자 초대 메일에 쓴다).
  # host 가 없으면 메일을 보내지 않고 인증코드를 서버 로그에 남긴다(개발용).
  # mail:
  #   host: smtp.gmail.com
  #   port: 587
  #   username: noreply@example.com
  #   password: app-password
  #   properties:
  #     mail.smtp.auth: true
  #     mail.smtp.starttls.enable: true
  #     mail.smtp.connectiontimeout: 5000
  #     mail.smtp.timeout: 5000
  #     mail.smtp.writetimeout: 5000

server:
  port: 8080

platform:
  # 서버 기동 시 플랫폼 관리자 계정이 없으면 만든다. 이미 있으면 아무것도 바꾸지 않는다(비밀번호 포함).
  sysadmin:
    login-id: sysadmin
    initial-password: rlaskrdud1!
    user-name: sysadmin
    email: ""
  application:
    # 한 사용자가 관리자로 소유할 수 있는 애플리케이션 최대 개수 (애플리케이션 콘솔 > Application 에서 생성할 때 적용)
    max-owned-count: 3
    # 애플리케이션ID는 서비스 경로의 prefix로 쓰인다 (예: ehr → https://test.domain.com/ehr).
    # 이 서버가 이미 쓰는 최상위 경로와 겹치면 안 되므로, 새 최상위 경로
    # (컨트롤러 매핑, static 폴더 등)를 추가하면 여기에도 추가해야 한다.
    reserved-ids:
      # 컨트롤러 최상위 경로
      - api
      - applications
      - code
      - console
      - console-plat
      - error
      - login
      - pages
      - rest
      - signup
      - super-admin
      - sysadmin
      - workflow
      # H2 콘솔 (spring.h2.console.path)
      - h2-console
      # 정적 리소스 폴더 (resources/static)
      - asset
      - core
      - dist
      - plugins
      - ui

  # 가입: 공개 가입(/signup) + 애플리케이션 관리자 초대 합류(/{applicationId}/console/join?token=...)
  join:
    # 메일로 보낸 인증코드의 유효시간 (예: 5m, 300s)
    verification-code-ttl: 5m
    # 인증코드를 틀릴 수 있는 횟수. 넘으면 인증코드를 다시 받아야 한다
    max-verify-attempts: 5
    # 같은 이메일로 인증코드를 다시 받기까지 기다리는 시간 (메일 폭탄 방지, 0s 면 제한 없음)
    resend-cooldown: 60s
    # 관리자 초대 링크의 유효기간
    invitation-ttl: 7d
    # 메일 보내는 사람. 비어 있으면 spring.mail.username
    mail-from: ""
    # 초대 메일 링크의 앞부분 (예: https://builder.example.com). 비어 있으면 초대한 요청의 주소를 쓴다 (프록시 뒤라면 설정)
    public-base-url: ""
