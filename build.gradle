plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.prometis'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

ext {
	graaljsVersion = '24.2.2'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':plugin-api')
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'org.mindrot:jbcrypt:0.4'
	implementation 'org.codehaus.groovy:groovy-all:3.0.21'
	implementation "org.graalvm.polyglot:polyglot:${graaljsVersion}"
	implementation "org.graalvm.polyglot:js:${graaljsVersion}"
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// PluginRuntimeTest 가 템플릿 플러그인 jar 를 실제로 로드해 본다
evaluationDependsOn(':plugin-template')

tasks.named('test') {
	useJUnitPlatform()
	def templateJar = project(':plugin-template').tasks.named('jar')
	dependsOn templateJar
	systemProperty 'plugin.template.jar', templateJar.get().archiveFile.get().asFile.absolutePath
}
